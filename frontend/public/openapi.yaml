openapi: 3.0.0
info:
  title: PiGate API Specification
  description: >-
    API endpoints for PiGate - Raspberry Pi 5 Firewall & Gateway Controller. This spec is synchronized with the React frontend service layer.
    Request bodies are capped at 1 MB on every endpoint (a request that exceeds this fails with a 4xx), except POST /system/config/import which allows up to 10 MB for backup files.
  version: 1.0.0
servers:
  - url: http://localhost:2479/api
    description: Development server (default port, mock mode)
  - url: /api
    description: Production (same-origin — HTTPS on real devices)
  - url: https://pigate.local/api
    description: Production HTTPS (self-signed; replace host with the device IP/hostname)

security:
  - cookieAuth: []

paths:
  # =========================================================================
  # AUTHENTICATION
  # =========================================================================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Administrator login
      security: [] # No auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: admin
      responses:
        '200':
          description: |
            Login successful. The session token is delivered ONLY via the
            `Set-Cookie: pigate_session=...` response header (HttpOnly, Secure
            over HTTPS, SameSite=Strict) — it is never returned in the body.

            Session lifetime (server-enforced): a 15-minute idle TTL that slides
            forward on use (any authenticated request within ~7.5 min of expiry
            re-issues the cookie with a fresh deadline), capped by a 7-day
            absolute maximum from login. A user may hold at most 5 concurrent
            sessions; a 6th login evicts that user's oldest session. Separately,
            the web UI auto-logs-out after 5 minutes of no mouse/keyboard
            activity, calling POST /auth/logout to revoke the session immediately.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie carrying the session token.
              schema:
                type: string
                example: pigate_session=session_id_abc123xyz; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  mustChangePassword:
                    type: boolean
                    description: If true, user must change password before using other API endpoints
                    example: false
                  role:
                    type: string
                    enum: [super_admin, admin_readonly]
                    description: Role of the authenticated user; the frontend uses it to adjust the UI.
                    example: super_admin
        '401':
          description: Invalid username or password, or the account is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid username or password

  /auth/session:
    get:
      tags:
        - Authentication
      summary: Check current session validity and user context
      description: |
        Verifies that the current session cookie (pigate_session) is still valid on the backend.
        A session is invalid once it has expired server-side (15-minute sliding idle TTL, or the
        7-day absolute cap), was evicted by the per-user session cap, or was revoked by logout —
        all of which return 401 here. A valid session may also be renewed as a side effect (a
        fresh Set-Cookie), since this route passes through the auth middleware.
        Also returns whether the user must change their password (IsInitial check).
        If mustChangePassword is true, all other API endpoints (except /system/password) will return 403 Forbidden.
      responses:
        '200':
          description: Session is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  username:
                    type: string
                    example: pigate
                  role:
                    type: string
                    enum: [super_admin, admin_readonly]
                    example: super_admin
                  mustChangePassword:
                    type: boolean
                    example: false
        '401':
          description: |
            Session invalid, revoked, or expired server-side (idle TTL / absolute
            cap / per-user cap eviction). The frontend clears its UI hints and
            redirects to /login.

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out from the system
      description: Invalidates the current session token and clears the session cookie.
      responses:
        '200':
          description: Logout successful

  # =========================================================================
  # USER MANAGEMENT (super_admin only)
  # =========================================================================
  /users:
    get:
      tags:
        - User Management
      summary: List all user accounts
      description: Restricted to super_admin. Password hashes are never returned.
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Caller is not a super_admin
    post:
      tags:
        - User Management
      summary: Create a new user
      description: Restricted to super_admin. New users always start with is_initial=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation failure or duplicate username
        '403':
          description: Caller is not a super_admin

  /users/{id}:
    put:
      tags:
        - User Management
      summary: Update a user's role and optionally reset password
      description: |
        Restricted to super_admin. Setting `password` resets it and forces a
        change on next login. Username is immutable. Guard rails: you cannot
        demote yourself, and the system must always keep at least one active
        super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
        '400':
          description: Validation failure or guard-rail violation
        '403':
          description: Caller is not a super_admin
        '404':
          description: User not found
    delete:
      tags:
        - User Management
      summary: Delete a user
      description: |
        Restricted to super_admin. You cannot delete yourself, nor the last
        active super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '400':
          description: Guard-rail violation (self-delete or last super_admin)
        '403':
          description: Caller is not a super_admin
        '404':
          description: User not found

  /users/{id}/toggle:
    post:
      tags:
        - User Management
      summary: Toggle a user between active and disabled
      description: |
        Restricted to super_admin. You cannot disable yourself, nor the last
        active super_admin. Disabling a user immediately evicts their sessions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status toggled
        '400':
          description: Guard-rail violation (self-disable or last super_admin)
        '403':
          description: Caller is not a super_admin
        '404':
          description: User not found

  # =========================================================================
  # DASHBOARD
  # =========================================================================
  /dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get general dashboard metrics and summary status
      responses:
        '200':
          description: General stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  /dashboard/performance:
    get:
      tags:
        - Dashboard
      summary: Get live hardware performance metrics (CPU, RAM, Temp)
      responses:
        '200':
          description: Performance metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceMetrics'

  /dashboard/performance/stream:
    get:
      tags:
        - Dashboard
      summary: SSE stream for live hardware performance metrics (CPU/RAM/temp/storage)
      description: |
        Establishes a `text/event-stream` connection that pushes a full
        `PerformanceMetrics` snapshot every ~5s (server-sampled, not client
        polling). Auth rides on the `pigate_session` cookie (`withCredentials`).

        Event format:
        - `event: connected` — one handshake frame on connect, immediately
          followed by one default message carrying the first snapshot so the UI
          paints without waiting a full interval.
        - default message (no event name) — `data:` is a `PerformanceMetrics`
          JSON object. Each is a complete snapshot the client replaces wholesale
          (no dedupe/merge needed). Consume via `EventSource.onmessage`.

        The server re-checks the session on every push **without** sliding its
        idle deadline, and closes the stream within ~5s once the session is
        revoked, deleted, or idles out. EventSource reconnects automatically; the
        next tick delivers a fresh snapshot, so no snapshot refetch is required.
        The plain `GET /dashboard/performance` endpoint is retained as the mock
        fallback and reconnect 401 probe.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: SSE stream initiated
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
  /dashboard/traffic:
    get:
      tags:
        - Dashboard
      summary: Get WAN bandwidth history (RAM ring buffer, ~24h of 5-minute buckets)
      description: >
        Returns rx/tx byte deltas bucketed in 5-minute intervals for the WAN
        interface(s). The history lives only in RAM and resets on reboot, so
        immediately after boot only a few buckets are present — the client must
        cope with a short series.
      responses:
        '200':
          description: Traffic history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficHistory'

  /dashboard/traffic-detail:
    get:
      tags:
        - Dashboard
      summary: >-
        Get the Detailed-tab traffic-analytics cards (Protocol Breakdown, Top
        Talkers, Top Rules by Traffic)
      description: >
        Backs three Dashboard "Detailed" tab cards. Categories and topTalkers
        are derived from a background conntrack-polling collector and are
        **estimates** (see `estimated`) — accurate to roughly 95-99% of actual
        bytes in typical home/office conditions, degrading under heavy
        port-scan/P2P conditions; their percentages are computed against
        `observedBytes` (the total the collector itself saw), NOT against the
        WAN total from `/dashboard/traffic` — the two must never be conflated.
        topRules is derived from nftables' own exact per-rule packet/byte
        counter and is not an estimate. All three lists live only in a RAM
        ring buffer (5-minute buckets, up to 24h) and reset on reboot — never
        persisted to SQLite.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
      responses:
        '200':
          description: Traffic detail retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficDetail'

  /statistics/traffic:
    get:
      tags:
        - Statistics
      summary: >-
        Get the Statistics page's Top Source Hosts / Top Destinations / Top
        Conversations / Top Denied cards
      description: >
        Backs the standalone Statistics Overview page (`/statistics/overview`),
        separate from the Dashboard "Detailed" tab. topSources/topDestinations/
        topConversations are conntrack-derived byte estimates from the same
        RAM bucket ring `/dashboard/traffic-detail` uses (percentages are
        computed against `observedBytes`); deniedSources/deniedPorts are
        **event counts, not bytes**, sourced from the NFLOG packet-filter log
        and are always a sampled approximation (`deniedSampled` is always
        true) because the underlying nftables log rules carry a rate limit
        (3 pkt/min on most drop rules, 10 pkt/s on the final catch-all drop) —
        never mix deniedSources/deniedPorts counts into observedBytes'
        percentages. Nothing here is persisted to SQLite; all state resets on
        reboot.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
      responses:
        '200':
          description: Traffic statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficStatistics'

  /statistics/traffic/hosts:
    get:
      tags:
        - Statistics
      summary: Get the full Top Source Hosts / Top Destinations lists for the Statistics -> Traffic page
      description: >
        Backs the Statistics -> Traffic page (`/statistics/traffic`,
        docs/ref/todo/statistics-traffic-page-plan.md). Unlike
        `/statistics/traffic`'s `topSources`/`topDestinations` (always cut to
        the top 10), this endpoint returns up to `limit` rows each, sourced
        from the SAME RAM-only conntrack bucket ring — nothing here is ever
        persisted to SQLite, and a pigate restart resets all counts to zero.
        Filtering and sorting are done client-side by the page; this endpoint
        only widens the row count.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          description: >
            Maximum rows returned per list (sources/destinations
            independently capped at this same value). A missing/unparseable
            value falls back to the default (100); a value outside [1, 500]
            is CLAMPED into range, never rejected.
      responses:
        '200':
          description: Full Top Source Hosts / Top Destinations lists retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficTopHosts'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/traffic/host:
    get:
      tags:
        - Statistics
      summary: Drill down a single IP from the Statistics -> Traffic page into its conversations, in both directions
      description: >
        Given an IP, returns two independent conversation lists: `asSource`
        (conversations where this IP is the flow's source — "this IP went to
        these destinations") and `asDestination` (conversations where this IP
        is the flow's destination — "these hosts came to this IP"), so a WAN
        destination can be drilled into just as easily as a LAN source (plan
        §1.3). A row is a 4-tuple conversation (src IP, dst IP, proto, dst
        port) — the same granularity as `TopConversation` — NOT a single TCP
        connection (model.FlowSample carries no source port, plan §1.1).
        `percent` on each row is relative to THIS IP's own `totalBytes`
        (summed across both directions), NOT `observedBytes` — a different
        denominator than `/statistics/traffic/hosts` and `/statistics/traffic`
        (plan §1.4); `percentOfObserved` is provided separately for the
        window-relative figure. Same RAM-only, never-persisted data source as
        every other Statistics endpoint — resets on restart.
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
            example: 192.168.1.101
          description: >
            IP address to drill into (LAN or WAN). Must parse via
            `net/netip`'s address parser; anything else returns 400 with a
            generic message — the submitted value is never echoed back in the
            error response. A valid IP is re-normalized (e.g. non-canonical
            IPv6) before lookup so it matches the ring's stored key.
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 300
          description: >
            Maximum rows returned per list (asSource/asDestination
            independently capped at this same value). A missing/unparseable
            value falls back to the default (100); a value outside [1, 300]
            is CLAMPED into range, never rejected.
      responses:
        '200':
          description: Both-direction conversation lists for this IP retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficHostDetail'
        '400':
          description: Missing or invalid `ip`
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/ipinfo:
    get:
      tags:
        - Statistics
      summary: Public IP Info lookup for the Statistics -> Traffic -> Host page's "Public IP Info" card
      description: >
        Backend proxy in front of ipinfo.io (docs/ref/todo/
        statistics-host-ipinfo-plan.md) — backs the drill-down page's
        "Public IP Info" card, which replaces "Top peers" when the drilled-in
        IP is public. **Opt-in, default OFF**: gated entirely server-side by
        the `ipinfo-enabled` bootstrap config key (file-only, no CLI flag, no
        UI toggle — must be edited by hand in
        `/var/lib/pigate/pigate.conf`). When enabled, this endpoint sends the
        queried IP to the third-party service ipinfo.io over HTTPS (no API
        token in the current phase); no client IP or other PiGate data is
        ever sent. Results are cached in RAM only (24h TTL for a successful
        lookup, 1h for a failed one) and rate-limited (~1 req/s, burst 5)
        server-wide to protect the upstream provider from this page's own
        10-second auto-refresh — nothing here is ever persisted to SQLite.
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
            example: 8.8.8.8
          description: >
            IP address to look up. Must parse via `net/netip`'s address
            parser; anything else returns 400. Must also be a public,
            globally-routable address (not RFC1918/CGNAT/loopback/link-local/
            multicast/TEST-NET/IPv6 ULA/IPv6 documentation range, with
            IPv4-mapped IPv6 addresses unmapped before this check) — a LAN or
            otherwise non-routable IP also returns 400, since this endpoint
            never sends such an address to ipinfo.io.
      responses:
        '200':
          description: Public IP Info retrieved (from cache or a live ipinfo.io lookup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPInfoLookup'
        '400':
          description: Missing/invalid `ip`, or `ip` is not a public/globally-routable address
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            The Public IP Info feature is disabled (`ipinfo-enabled=false`,
            the default). Deliberately 404, not 403, so the response doesn't
            hint at server configuration either way.
        '429':
          description: Server-wide rate limit to ipinfo.io exceeded; retry later.
        '502':
          description: >-
            The ipinfo.io lookup failed or timed out. The response message is
            generic — the raw upstream error is never relayed to the client.

  /statistics/dns:
    get:
      tags:
        - Statistics
      summary: Get the DNS Statistics page's Top Domains / Top Clients tables
      description: >
        Backs the Statistics -> DNS page's overview tables (`/statistics/dns`)
        — formerly a "สถิติ" tab on the DNS Server page, promoted to its own
        route (docs/ref/todo/statistics-nav-restructure-plan.md), then
        extended with per-row byte volume and drill-down fields
        (docs/ref/todo/statistics-dns-page-revamp-plan.md). Same opt-in
        switch as TrafficStatistics.topDomains (`dns/settings.queryLogging`)
        — `enabled` mirrors it and both list fields are empty arrays (not
        omitted) when off. Fed by an in-memory ring keyed by (domain, client)
        pairs joined against TrafficStatsService's conntrack-derived byte
        counters by IP; **RAM-only, display-only** — nothing here is ever
        persisted to SQLite, and a pigate restart resets all counts to zero.
        `topDomains` is `DNSDomainStat` (NOT the same schema as
        `/statistics/traffic`'s `topDomains`, which stays `TopDomain`
        unchanged) — `percent` is computed against this endpoint's own
        `totalQueries` (DNS query count), `bytesPercent` against
        `domainBytes` (a separate, byte-based denominator — see the schema).
        `bytes`/`bytesUp`/`bytesDown` are an APPROXIMATION derived by joining
        the DNS answer -> IP mapping against conntrack byte counters, not a
        true per-domain packet count, and that domain->IP mapping must never
        be used for security/policy decisions (firewall, routing, QoS). Also
        returns `querySeries` (docs/ref/todo/
        statistics-dns-query-bar-chart-plan.md T-02/T-03/T-05), a time series
        of DNS query counts per 5-minute bucket for the same window, backing
        the overview page's bar chart. No sort-key input is accepted from the
        client — sorting of the tables is done entirely in the browser.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
      responses:
        '200':
          description: DNS query statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSQueryStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/dns/domain:
    get:
      tags:
        - Statistics
      summary: Drill down a domain from the Statistics -> DNS page into its clients, resolved IPs, and volume
      description: >
        Given a domain, returns every client (source IP, or the reserved
        `unknown` bucket for queries whose source IP could not be parsed)
        that queried it within the window, with per-client counts, plus (as
        of docs/ref/todo/statistics-dns-page-revamp-plan.md T-04/T-07) the
        `ips` this domain was resolved to (ranked by APPROXIMATE volume, with
        a `shared` flag when an IP is also used by another domain),
        `totalBytes`/`totalBytesUp`/`totalBytesDown`, and a `series` time
        series — all derived by joining the RAM-only domain->IP forward index
        against TrafficStatsService's conntrack byte counters by IP, never a
        true per-domain packet count, and never to be used for
        security/policy decisions (firewall, routing, QoS). Same RAM-only,
        display-only, opt-in data source as `/statistics/dns` — never
        persisted to SQLite, resets on restart. `percent` here is relative to
        this domain's own `totalQueries`, NOT the window's overall total (a
        different denominator than `/statistics/dns`'s
        `topDomains`/`topClients`); `bytesPercent` on `ips[]` rows is
        relative to this response's own `totalBytes`. A domain that passes
        validation but was never queried in the window still returns 200
        with an empty `clients` array (not 404 — a normal outcome as the
        window slides). No sort-key input is accepted — sorting is done
        entirely in the browser.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
            maxLength: 253
          description: >
            Domain to drill into. Lower-cased and a single trailing dot is
            stripped before matching; only `a-z 0-9 . - _ *` are accepted
            (max 253 bytes). An invalid value returns 400 with a generic
            message — the submitted value is never echoed back in the
            error response.
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
      responses:
        '200':
          description: Clients that queried this domain in the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSDomainDrilldown'
        '400':
          description: Missing or invalid `domain`
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/dns/client:
    get:
      tags:
        - Statistics
      summary: Drill down a client from the Statistics -> DNS page into the domains it queried and its volume
      description: >
        Given a client, returns every domain it queried within the window,
        with per-domain counts, plus (as of docs/ref/todo/
        statistics-dns-page-revamp-plan.md T-04/T-07) `domains[].bytes`
        (bytes exchanged between THIS client and each domain's known IPs
        only — a conversation-level join, more precise than the
        network-wide approximation `/statistics/dns` uses),
        `totalBytes`/`totalBytesUp`/`totalBytesDown`, and a `series` time
        series. For the reserved `unknown` client bucket there is no IP to
        join against, so those byte/series fields stay at their zero value
        rather than a fabricated number. Same RAM-only, display-only, opt-in
        data source as `/statistics/dns` — never persisted to SQLite, resets
        on restart. `percent` here is relative to this client's own
        `totalQueries`, NOT the window's overall total (same rule as
        `/statistics/dns/domain` above); `bytesPercent` on `domains[]` rows is
        relative to this response's own `totalBytes`. A client that passes
        validation but never queried anything in the window still returns
        200 with an empty `domains` array (not 404). No sort-key input is
        accepted — sorting is done entirely in the browser.
      parameters:
        - name: client
          in: query
          required: true
          schema:
            type: string
            example: 192.168.1.101
          description: >
            Source IP of the client to drill into, or the reserved literal
            `unknown` for queries whose source IP could not be parsed. Must
            either parse as an IP address or equal `unknown` exactly;
            anything else returns 400 with a generic message — the
            submitted value is never echoed back in the error response. A
            valid IP is re-normalized (e.g. non-canonical IPv6) before
            lookup so it matches the ring's stored key.
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
      responses:
        '200':
          description: Domains this client queried in the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSClientDrilldown'
        '400':
          description: Missing or invalid `client`
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/dns/ip:
    get:
      tags:
        - Statistics
      summary: Reverse-lookup an IP from the Statistics -> DNS page into every domain that has resolved to it
      description: >
        Given an IP, returns every domain the RAM-only reverse index
        (docs/ref/todo/statistics-dns-ip-filter-plan.md T-03/T-04) knows to
        have resolved to it — answering "this IP shows up under more than
        one domain, which ones?" for CDN/shared-hosting IP reuse. Same
        RAM-only, display-only, opt-in data source as `/statistics/dns` —
        never persisted to SQLite, resets on restart, and MUST NEVER be used
        for firewall rule generation, policy matching, routing, or QoS
        decisions (the mapping is derived from dnsmasq's answer log, which
        any LAN client can influence). `bytesPercent` on `domains[]` rows is
        relative to this response's own `matchedBytes` (the sum of
        `domains[].bytes`), NOT the window-wide `domainBytes` used by
        `/statistics/dns`. A domain the forward index still remembers but
        that had no query in this window still appears with
        `count`/`percent` = 0 — that row is still the correct answer to
        "what domain is this IP for". No sort-key input is accepted —
        sorting is done entirely in the browser.
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
            example: 142.250.199.14
          description: >
            IP address to look up. Must parse as an IP address (IPv4 or
            IPv6); anything else returns 400 with a generic message — the
            submitted value is never echoed back in the error response. A
            valid IP is re-normalized (e.g. non-canonical IPv6) before
            lookup so it matches the forward index's stored key.
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
      responses:
        '200':
          description: Domains that have resolved to this IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSIPDomains'
        '400':
          description: Missing or invalid `ip`
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/reference/ip:
    get:
      tags:
        - Statistics
      summary: Lightweight IP hover-popover summary (reference popover)
      description: >
        Backs the reference popover (docs/ref/todo/reference-popover-plan.md)
        that opens when hovering an IP value in the Logs/Policy/Statistics
        pages — a deliberately lightweight sibling of `/statistics/dns/ip`
        and `/statistics/traffic/host`, returning only the top few domain
        references + counts (never a full series/per-client join), since a
        hover popover can fire dozens of times a minute. Reuses the exact
        same RAM-only indices those endpoints already read (the domain->IP
        forward/reverse index, the DNS query-count ring, the conntrack byte
        breakdown) — no new data source, no new aggregation logic.

        `scope` is decided EXCLUSIVELY by the server (never accepted from the
        client) via the same `isGloballyRoutable` guard `/statistics/ipinfo`
        uses (RFC1918/CGNAT/loopback/link-local/multicast/TEST-NET/IPv6
        ULA/IPv6 documentation range all classify as `lan`, with
        IPv4-mapped IPv6 addresses unmapped before the check) — it is a
        security boundary, not a UX hint: the frontend must only call
        `/statistics/ipinfo` for this IP when `scope == "public"`. `domains`
        changes meaning with `scope`: for `public` it is every domain known
        to have resolved to this IP (`lastSeen` populated, `count` omitted);
        for `lan` it is the top domains THIS IP queried in the window
        (`count` populated, `lastSeen` omitted).

        The window is always the fixed `1h` — this endpoint does not accept
        a `window` query parameter at all (any `window`/`scope` the client
        sends is silently ignored). `enabled=false` (DNS query logging
        switched off) still returns 200 with `domains` as an empty array —
        not an error, and the UI should show a muted notice with a link to
        turn logging on rather than treating it as a failure. Same
        RAM-only, display-only data source as `/statistics/dns/ip` — MUST
        NEVER be used for firewall rule generation, policy matching,
        routing, or QoS decisions.
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
            example: 142.250.199.14
          description: >
            IP address to look up. Must parse as an IP address (IPv4 or
            IPv6); anything else returns 400 with a generic message — the
            submitted value is never echoed back in the error response. A
            valid IP is re-normalized (e.g. non-canonical IPv6) before
            lookup.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
          description: >
            Max number of `domains[]` rows to return. Out-of-range or
            unparseable values are silently clamped into [1, 10] — never a
            400. `domainCount` always reflects the true total before this
            limit is applied.
      responses:
        '200':
          description: Lightweight reference summary for this IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPReferenceSummary'
        '400':
          description: Missing or invalid `ip`
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/reference/domain:
    get:
      tags:
        - Statistics
      summary: Lightweight domain hover-popover summary (reference popover)
      description: >
        The domain-side sibling of `/statistics/reference/ip` (docs/ref/todo/
        reference-popover-plan.md) — same lightweight, top-few-entries-only
        shape, reusing the domain->IP forward index
        (`dns_domain_ips.go`'s `IPsFor`, the same one
        `/statistics/dns/domain` reads) and the DNS query-count ring, without
        any traffic series or per-client join. The window is always the
        fixed `1h` — no `window` query parameter is accepted.
        `enabled=false` (DNS query logging switched off) still returns 200
        with `ips` as an empty array — not an error, same UI treatment as
        `/statistics/reference/ip`. Same RAM-only, display-only data source
        as `/statistics/dns/domain` — MUST NEVER be used for firewall rule
        generation, policy matching, routing, or QoS decisions.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
            maxLength: 253
          description: >
            Domain to look up. Lower-cased and a single trailing dot is
            stripped before matching; only `a-z 0-9 . - _ *` are accepted
            (max 253 bytes). An invalid value returns 400 with a generic
            message — the submitted value is never echoed back in the
            error response.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
          description: >
            Max number of `ips[]` rows to return. Out-of-range or
            unparseable values are silently clamped into [1, 10] — never a
            400. `ipCount` always reflects the true total before this limit
            is applied.
      responses:
        '200':
          description: Lightweight reference summary for this domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainReferenceSummary'
        '400':
          description: Missing or invalid `domain`
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/capacity:
    get:
      tags:
        - Statistics
      summary: Current usage vs configured cap for every RAM-only statistics tracking ring/index
      description: >
        Backs the Statistics -> Capacity page and the small "capacity"
        indicator pills on the Overview/Traffic/DNS pages (docs/ref/todo/
        statistics-capacity-visibility-plan.md, GitHub issue #123). Returns
        exactly 11 rings, always in the same fixed order (traffic.hosts,
        traffic.dests, traffic.conversations, firewall.denySources,
        firewall.denyPorts, dns.pairs, dns.clients, dns.reverseCache,
        dns.domainIps, dns.domainIpsPerDomain, firewall.logBuffer) — the
        current/peak size of each of the RAM-only in-memory tracking
        structures backing `/statistics/traffic` and `/statistics/dns`,
        relative to its configured cap. This is an EARLY-WARNING signal
        (percent full, before data is dropped) on top of the existing
        after-the-fact `truncated` booleans those other two endpoints
        already expose. Contains ONLY counts and percentages — no domain
        name, IP address, or hostname ever appears in this response, which
        is why (unlike some other Statistics endpoints) it carries no extra
        sensitivity beyond ordinary authenticated access. `estimatedBytes`
        on each ring is an APPROXIMATION (entries currently held in RAM x a
        documented per-entry byte constant) — never a measured value — and,
        for a "bucket"-kind ring, reflects the WHOLE ring (up to 24h of
        history), not just the requested `window`. The 11th ring,
        `firewall.logBuffer` (docs/ref/todo/
        firewall-log-buffer-capacity-plan.md, issue #134), reports the
        shared traffic log ring buffer's fill state — its `cap` comes from
        the `traffic-log-buffer-capacity` key in `pigate.conf` (default
        10000, range 500-100000) and only changes on the next service
        restart; it is also the only ring that ever populates
        `oldestEntry`.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring. Scopes each
            ring's `series` (when requested)/`peak`/`fullBuckets`; does NOT
            scope `estimatedBytes` (see above).
        - name: series
          in: query
          schema:
            type: string
            default: "0"
          description: >
            Whether to include each bucket-kind ring's per-bucket `series`
            array. Strict whitelist: exactly "1" or "true" means true;
            anything else (omitted, "0", "false", garbage) means false —
            never a 400. Flat-kind rings (`dns.reverseCache`, `dns.domainIps`,
            `dns.domainIpsPerDomain`) never carry a `series`, regardless of
            this parameter.
      responses:
        '200':
          description: Capacity usage for all 11 tracking rings/indices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /statistics/firewall:
    get:
      tags:
        - Statistics
      summary: Firewall traffic/blocked-event summary for the Statistics -> Firewall page
      description: >
        Backs the Statistics -> Firewall page (docs/ref/todo/
        statistics-firewall-page-plan.md). Composes data from two
        independently-sourced, differently-scoped accountings that already
        exist elsewhere in the API — never mixed into one percentage or one
        denominator:


        - `acceptedBytes`/`acceptedPackets`/`blockedBytes`/`blockedPackets`
        and every byte/packet figure in `trend`/`chains`/`rules` come from
        the nftables PER-RULE COUNTER (the same exact, kernel-counted source
        `/policies/stats` and the Dashboard "Top Rules by Traffic" card use).
        This is EXACT, but it ONLY EVER reflects traffic that matched a
        USER-DEFINED policy rule — traffic dropped by the board's built-in
        default-drop rule (the final catch-all of the input/forward chain,
        see docs/tech_stack_design.md §4.3) is NOT counted in these fields
        at all, because that drop has no associated DB rule/counter.

        - `blockedEvents` and every value in `denyTrend`/`blockedSources`/
        `blockedPorts`/`recentBlockedEvents` come from NFLOG (the same "Top
        Denied Sources/Ports" deny-ring source `/statistics/traffic`
        already exposes) — an EVENT COUNT, not bytes, and it DOES include
        packets dropped by the default-drop, a strictly larger and
        differently-shaped population than `blockedBytes`/`blockedPackets`.


        Every field is RAM-only (never persisted to SQLite): the per-rule
        counters additionally reset to 0 on every successful Apply Settings
        (see `countersSince`), and the whole response resets on a pigate
        restart. `percent` on `chains`/`rules` rows is always relative to the
        sum of accepted+blocked bytes across every chain/rule in this
        response, never against `blockedEvents`.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
          description: >
            Aggregation window. Any value outside {15m, 30m, 1h, 3h, 6h, 12h,
            24h} — including omitted, wrong case (e.g. "1H"), or garbage —
            silently falls back to 1h rather than erroring.
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          description: >
            Maximum rows returned for `rules`/`blockedSources`/`blockedPorts`/
            `recentBlockedEvents` (each independently capped at this same
            value). A missing/unparseable value falls back to the default
            (100); a value outside [1, 500] is CLAMPED into range, never
            rejected.
      responses:
        '200':
          description: Firewall traffic/blocked-event summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/logs:
    get:
      tags:
        - Dashboard
      summary: Get recent firewall filter packet logs (nftables block logs)
      description: |
        Backs the Dashboard "Recent Logs" widget. Reads the same shared RAM
        ring buffer as `/logs/traffic` — entries from all three chains
        (forward/input/output) appear here, unfiltered by chain.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
          description: |
            Max rows to return (default 100, capped at 500). Always pass this —
            the ring buffer can hold up to 10,000 entries and an unbounded
            request would download several MB of JSON on every page load/SSE
            reconnect.
      responses:
        '200':
          description: List of firewall logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FirewallLog'

  /dashboard/logs/clear:
    post:
      tags:
        - Dashboard
      summary: Clear all firewall packet filter logs
      responses:
        '200':
          description: Logs cleared successfully

  /dashboard/logs/stream:
    get:
      tags:
        - Dashboard
      summary: Server-Sent Events (SSE) stream for live firewall/forward-traffic logs
      description: |
        Establishes a `text/event-stream` connection that pushes each new
        firewall/forward-traffic log entry the moment it is recorded in the RAM
        ring buffer (real push via pub/sub — not polling). Auth rides on the
        `pigate_session` cookie (`withCredentials`).

        Event format:
        - `event: connected` — one handshake frame sent immediately on connect.
        - default message (no event name) — `data:` is a single `FirewallLog`
          JSON object for one new entry. Consume via `EventSource.onmessage`.
        - `event: clear` — the buffer was wiped (someone hit Clear); `data:` is
          `{}`. Clients should empty their local list. Broadcast to every open
          stream.
        - `: ping` comment lines — heartbeat (~every 25s) to keep the connection
          alive and detect dead peers.

        The server re-checks the session on each heartbeat **without** sliding
        its idle deadline, and closes the stream within ~1 heartbeat once the
        session is revoked, deleted, or idles out. EventSource reconnects
        automatically; clients should refetch a snapshot (`GET /dashboard/logs`
        or `GET /logs/traffic`) on (re)connect and dedupe by `id`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: SSE stream initiated
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-cache
            Connection:
              schema:
                type: string
                example: keep-alive

  # =========================================================================
  # CENTRAL EVENT LOG (audit trail)
  # =========================================================================

  /logs/events:
    get:
      tags:
        - Event Log
      summary: Get central system/audit events (newest first)
      description: |
        Central event log covering security events (login success/failed,
        password changed, user CRUD), network/firewall/route/DHCP/DNS changes,
        config import/export, and reboot/shutdown. Persisted in SQLite across
        reboots. Available to any authenticated role.
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [auth, user, network, firewall, route, dhcp, dns, qos, system, config]
          description: Filter by event category
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error, critical]
          description: Filter by severity
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive text search across message, action, actor, and target
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Page size (max 200)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: Matching events plus total count for pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemEvent'
                  total:
                    type: integer
                    example: 1234
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logs/events/clear:
    post:
      tags:
        - Event Log
      summary: Clear the entire event log (super_admin only)
      description: |
        Destroys the audit trail, so it is restricted to super_admin and blocked
        in -disable-edit mode. The first row of the emptied table is always a
        `config.logs_cleared` event recording who performed the wipe.
      responses:
        '200':
          description: Event log cleared (a logs_cleared audit event is written immediately)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not super_admin

  # =========================================================================
  # FORWARD TRAFFIC LOG (live packet PASS/DROP, RAM-only)
  # =========================================================================

  /logs/traffic:
    get:
      tags:
        - Event Log
      summary: Get live packet logs for forward/input/output chains (PASS/DROP, cursor-paginated, newest first)
      description: |
        Real-time PASS/DROP events for packets on any of the three firewall
        chains — forward (LAN↔WAN traffic routed through the box, the
        "Forward Traffic" page), input (traffic destined to the box itself)
        and output (traffic the box itself originates) — the latter two
        together power the "Local Traffic" page. All three are captured from
        the kernel via NFLOG (two netlink groups: one for forward, one shared
        by input/output) into a single fixed-size RAM ring buffer (10,000
        entries). Deliberately NOT persisted to SQLite (packet rate + SD-card
        wear), so it is a recent-sample view, not a complete record. Shares
        the buffer with `/dashboard/logs`; clear it via `/dashboard/logs/clear`.
        Established connections are accepted without a log (ct state), so
        mostly connection-opening and dropped packets appear. Available to
        any authenticated role.

        **Cursor pagination**: the server filters the entire buffer by
        action/q/chain FIRST, then locates `beforeId` in the filtered result,
        then returns up to `limit` rows after it (never the other way
        around — a match deeper in the buffer than the first page must still
        be found). `beforeId`/`beforeTime` together form the cursor: pass the
        `id`/`time` of the last row you already have. If `beforeId` is no
        longer present in the buffer (evicted by newer entries), the server
        falls back to cutting by `time < beforeTime` instead. Getting back
        fewer than `limit` rows means there is nothing older left — no
        separate "hasMore" field is added, to keep the response format
        (a plain array, `[]` when empty — never `null`) unchanged for
        clients that don't send a cursor at all.
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [PASS, DROP]
          description: Filter by verdict (case-insensitive); omit for all
        - name: q
          in: query
          schema:
            type: string
          description: >-
            Case-insensitive text search across src, dest, srcPort, port,
            proto, inIface, outIface, reason, chain, ruleName, and ruleId.
            ruleName/ruleId let the "ดู log ของกฎนี้" deep-link from a policy
            rule's usage-stats drawer find its own matched rows — matching is
            a plain substring against the rule's name as it was at the
            moment the log entry was captured (snapshot-on-write), so a rule
            renamed afterwards won't match its older entries, and a name
            that's a substring of another rule's name may also match.
        - name: chain
          in: query
          schema:
            type: string
            enum: [forward, input, output, local]
          description: |
            Filter by chain. "local" means input+output combined (used by the
            Local Traffic page). Omit for all chains (used by legacy clients
            and the Dashboard). An unrecognized value is rejected with 400
            rather than silently returning all chains.
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Max rows to return (default 100, capped at min(1000, buffer capacity))
        - name: beforeId
          in: query
          schema:
            type: string
          description: |
            Cursor: the `id` of the last row already fetched under the
            current filter. Rows strictly after this one (within the
            filtered result) are returned. Omit to fetch the first page.
        - name: beforeTime
          in: query
          schema:
            type: string
            example: "2026-07-28T14:31:02.123456789Z"
          description: |
            Cursor fallback (RFC3339Nano; plain RFC3339 also accepted): used
            only when `beforeId` can no longer be found (evicted from the
            ring buffer). If neither resolves, the response is an empty array
            rather than restarting from the first page.
      responses:
        '200':
          description: Matching packet logs (newest first); fewer than `limit` rows means no older data remains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FirewallLog'
        '400':
          description: Invalid `chain` value
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logs/traffic/usage:
    get:
      tags:
        - Event Log
      summary: Traffic log ring buffer fill state (used/capacity/oldest/newest/evicted)
      description: |
        A small, purpose-built summary for the Forward Traffic / Local
        Traffic page headers (docs/ref/todo/
        firewall-log-buffer-capacity-plan.md, GitHub issue #134) — separate
        from `GET /statistics/capacity`'s 11-ring response so these pages
        don't have to fetch every ring + series just to show one line. All
        numbers are for the WHOLE shared ring buffer (forward + input +
        output chains combined), NOT scoped to whichever page is asking.
        `capacity` comes from the `traffic-log-buffer-capacity` config key
        in `pigate.conf` (default 10000, accepted range 500-100000) and
        only changes on the next service restart. `oldestEntry`/
        `newestEntry` are the as-stored `time` string (RFC3339 or
        RFC3339Nano) of the oldest/newest entries currently held, empty
        when the buffer is empty. `evicted` is the cumulative count of
        entries pushed out of the buffer since boot or the last
        `POST /dashboard/logs/clear` — non-zero means the buffer has
        filled up at least once.
      responses:
        '200':
          description: Traffic log ring buffer usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficLogBufferUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =========================================================================
  # NETWORK INTERFACES
  # =========================================================================
  /interfaces:
    get:
      tags:
        - Network Interfaces
      summary: Get all network interfaces (Ethernet & Wireless)
      description: >-
        Returns the unified data layer (kernel state overlaid with database configuration).
        The list also includes "offline" interfaces: rows that have a database configuration
        but no live kernel link (status="offline", managed=true), so the UI can surface them
        and offer to delete their config. Other backend consumers do not see offline rows.
      responses:
        '200':
          description: List of interfaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkInterface'

  /interfaces/vlan:
    post:
      tags:
        - Network Interfaces
      summary: Create an 802.1Q VLAN sub-interface
      description: |
        Creates a VLAN (802.1Q) sub-interface on top of an existing ethernet parent via
        Netlink (no shell execution). The resulting link is always named
        "<parent>.<vlanId>" (e.g. "eth0.100"). The parent must be an existing, non-VLAN
        ethernet interface (wireless parents are rejected). The VLAN is persisted to the
        database and re-created automatically on every boot, so it survives reboots.
        Requires super_admin (blocked for read-only users and in -disable-edit mode).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - parent
                - vlanId
              properties:
                parent:
                  type: string
                  description: Parent ethernet interface name (must exist, non-VLAN)
                  example: eth0
                vlanId:
                  type: integer
                  minimum: 1
                  maximum: 4094
                  example: 100
                alias:
                  type: string
                  description: >-
                    Optional display alias (defaults to the link name). Same rules as
                    PUT /interfaces/{id}: unique case-insensitively, must not equal
                    another interface's OS name.
                  example: vlan100
                role:
                  type: string
                  enum: [LAN, WAN]
                  example: LAN
                addressingMode:
                  type: string
                  enum: [dhcp, static]
                  example: static
                ip:
                  type: string
                  example: 192.168.100.1
                netmask:
                  type: string
                  example: "24"
                gateway:
                  type: string
                  example: ""
                adminAccess:
                  type: array
                  items:
                    type: string
                    enum: [HTTPS, HTTP, PING, SSH]
                  example: [PING, HTTP, SSH]
      responses:
        '201':
          description: VLAN interface created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterface'
        '400':
          description: Invalid input (bad VLAN ID, missing/invalid parent, wireless parent, malformed alias, etc.)
        '403':
          description: Forbidden (read-only user or -disable-edit mode)
        '409':
          description: A VLAN with that name already exists (in the kernel or database), or the alias is already in use
        '500':
          description: Internal server error (kernel link creation or DB write failed)

  /interfaces/{id}:
    put:
      tags:
        - Network Interfaces
      summary: Full update of a network interface configuration
      description: |
        Replaces the full configuration of an interface. For password fields (wifiPassword, backupWifiPassword),
        if the masked placeholder "••••••••" is sent, the existing stored password is preserved.
        Wi-Fi passwords are only updated if non-empty and not masked, or if security is explicitly "Open".
        If adminAccess changes, firewall rules are automatically re-synced.
        The dhcpcd client is reconciled to the saved addressing mode: switching to DHCP on an up
        interface (re)starts dhcpcd immediately (Wi-Fi once associated), and switching to static
        releases any running lease — no manual interface toggle is required.
        The alias is validated server-side: an empty alias defaults to the OS name; a
        malformed alias returns 400; an alias already used by another interface
        (case-insensitive) or equal to another interface's OS name returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInterface'
      responses:
        '200':
          description: Interface updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterface'
        '400':
          description: Invalid alias (must contain only letters, numbers and underscores)
        '404':
          description: Interface not found
        '409':
          description: >-
            Alias already in use by another interface, or equals another interface's OS name
            (case-insensitive); or the interface is offline (has no live kernel link), in which
            case only delete is allowed.
        '500':
          description: Internal server error or OS firewall sync failed
    patch:
      tags:
        - Network Interfaces
      summary: Partial update of a network interface configuration
      description: |
        Applies partial (PATCH) updates to an interface. Only fields explicitly present in the request body
        are updated; omitted fields are left unchanged. Useful for changing a single property without
        sending the full interface payload.
        Password masking rules are identical to PUT.
        Alias validation rules are identical to PUT (400 malformed / 409 conflict).
        If adminAccess changes, firewall rules are automatically re-synced.
        The dhcpcd client is reconciled to the saved addressing mode: switching to DHCP on an up
        interface (re)starts dhcpcd immediately (Wi-Fi once associated), and switching to static
        releases any running lease — no manual interface toggle is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                role:
                  type: string
                  enum: [LAN, WAN]
                addressingMode:
                  type: string
                  enum: [dhcp, static]
                ip:
                  type: string
                netmask:
                  type: string
                gateway:
                  type: string
                macAddress:
                  type: string
                status:
                  type: string
                  enum: [up, down]
                adminAccess:
                  type: array
                  items:
                    type: string
                    enum: [HTTPS, HTTP, PING, SSH]
                wifiSSID:
                  type: string
                wifiPassword:
                  type: string
                wifiSecurity:
                  type: string
                macMode:
                  type: string
                  enum: [hardware, randomized, laa]
                prefer5GHz:
                  type: boolean
                  description: Lock Wi-Fi scanning to 5GHz channels only (adds freq_list to wpa_supplicant network block) for maximum speed.
                laaMacAddress:
                  type: string
                randomizeOnReconnect:
                  type: boolean
                failoverEnabled:
                  type: boolean
                backupSsid:
                  type: string
                backupWifiPassword:
                  type: string
                backupWifiSecurity:
                  type: string
                ipCheckTimeout:
                  type: integer
                primaryMaxRetries:
                  type: integer
                failoverCooldown:
                  type: integer
      responses:
        '200':
          description: Interface partially updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterface'
        '400':
          description: Invalid alias (must contain only letters, numbers and underscores)
        '404':
          description: Interface not found
        '409':
          description: >-
            Alias already in use by another interface, or equals another interface's OS name
            (case-insensitive); or the interface is offline (has no live kernel link), in which
            case only delete is allowed.
        '500':
          description: Internal server error or OS firewall sync failed
    delete:
      tags:
        - Network Interfaces
      summary: Delete an interface
      description: >-
        Deletes an interface configuration. For physical interfaces, only offline interfaces
        (status="offline" — a database row whose kernel link is gone) can be deleted; active
        interfaces return a 400 Bad Request. Deleting the row also prunes any DNS Server
        binding to the interface. VLAN sub-interfaces (subtype='vlan') are an exception: they
        are removed via Netlink (kernel link + database row) and can be deleted while up,
        since that is the only way to tear a VLAN down; when the VLAN's kernel link is already
        gone the Netlink delete is skipped and only the database row is removed. The kernel
        layer additionally guards against deleting a non-VLAN link.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Interface deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Cannot delete active interfaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cannot delete active interfaces. Only offline interfaces can be deleted.
        '404':
          description: Interface not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Interface not found
        '500':
          description: Internal server error

  /interfaces/{id}/toggle:
    post:
      tags:
        - Network Interfaces
      summary: Toggle interface status UP or DOWN (ifconfig up/down)
      description: >-
        Toggles the interface's administrative state. On the UP leg the interface is
        brought up and its stored configuration (static IP, default gateway route, and
        metric) is reapplied from the database, so a static gateway/metric that was
        deferred while the link was down is restored. Status is persisted with a targeted
        update; toggling an unmanaged interface (no database row) does not create one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Toggle state changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterface'
        '409':
          description: Interface is offline (has no live kernel link); only delete is allowed
  /interfaces/{id}/reset:
    post:
      tags:
        - Network Interfaces
      summary: Reset interface configuration to default values
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Interface reset successful, returns default configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterface'
        '404':
          description: Interface not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Interface not found
        '500':
          description: Internal server error

  /interfaces/{id}/scan:
    get:
      tags:
        - Network Interfaces
      summary: Scan for available Wi-Fi access points (Wireless interfaces only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wi-Fi scan results retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WifiScanResult'
        '409':
          description: Interface is offline (has no live kernel link); only delete is allowed

  /interfaces/{id}/wifi-status:
    get:
      tags:
        - Network Interfaces
      summary: Retrieve the live real-time Wi-Fi connection status (Wireless interfaces only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wi-Fi connection status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiConnectionStatus'
        '400':
          description: Interface is not wireless
        '404':
          description: Interface not found
        '409':
          description: Interface is offline (has no live kernel link); only delete is allowed

  # =========================================================================
  # WI-FI PRESETS (SAVED NETWORKS)
  # =========================================================================
  /wifi-presets:
    get:
      tags:
        - Wi-Fi Presets
      summary: List all saved Wi-Fi presets (super_admin only)
      description: >-
        Returns the saved-network library. The stored password is write-only and
        is NEVER included in the response; each item carries a `hasPassword`
        boolean instead.
      responses:
        '200':
          description: List of Wi-Fi presets (no passwords)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WifiPreset'
        '403':
          description: Caller is not a super_admin
    post:
      tags:
        - Wi-Fi Presets
      summary: Create a new Wi-Fi preset (super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WifiPresetInput'
      responses:
        '200':
          description: Preset created (response has no password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiPreset'
        '400':
          description: Validation failed (empty name/ssid, bad security/macMode, or newline/quote in ssid/password)
        '403':
          description: Caller is not a super_admin
        '409':
          description: A preset with the same name already exists

  /wifi-presets/{id}:
    put:
      tags:
        - Wi-Fi Presets
      summary: Update an existing Wi-Fi preset (super_admin only)
      description: >-
        Submit an empty `password` to keep the currently stored password
        unchanged; a non-empty value replaces it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WifiPresetInput'
      responses:
        '200':
          description: Preset updated (response has no password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiPreset'
        '400':
          description: Validation failed
        '403':
          description: Caller is not a super_admin
        '404':
          description: Preset not found
        '409':
          description: Another preset already uses the requested name
    delete:
      tags:
        - Wi-Fi Presets
      summary: Delete a Wi-Fi preset (super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Preset deleted
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '403':
          description: Caller is not a super_admin
        '404':
          description: Preset not found

  /wifi-presets/{id}/apply:
    post:
      tags:
        - Wi-Fi Presets
      summary: Apply a preset to an interface's primary or backup Wi-Fi slot (super_admin only)
      description: >-
        Server-side apply — the backend reads the preset's password from the DB
        and drives the existing wpa_supplicant configuration flow itself. The
        password never travels through the browser: the request body carries only
        `interfaceId` and `slot`, and the returned interface has its passwords
        masked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interfaceId
                - slot
              properties:
                interfaceId:
                  type: string
                  example: iface-wlan0
                slot:
                  type: string
                  enum: [primary, backup]
                  example: primary
      responses:
        '200':
          description: Preset applied; the updated interface is returned with passwords masked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterface'
        '400':
          description: Invalid slot, or the target interface is not wireless
        '403':
          description: Caller is not a super_admin
        '404':
          description: Preset or interface not found

  # =========================================================================
  # FIREWALL POLICIES
  # =========================================================================
  /policies:
    get:
      tags:
        - Firewall Policies
      summary: Retrieve firewall policy rules ordered by chain, then precedence
      parameters:
        - name: chain
          in: query
          required: false
          description: >-
            Filter to one chain (forward/input/output). Omitted or empty
            returns every chain (backward compatible with clients that
            predate this parameter, used internally when applying rules to
            the kernel).
          schema:
            type: string
            enum: [forward, input, output]
      responses:
        '200':
          description: List of policy rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRule'
    post:
      tags:
        - Firewall Policies
      summary: Create a new firewall policy rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRuleInput'
      responses:
        '200':
          description: Policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'

  /policies/stats:
    get:
      tags:
        - Firewall Policies
      summary: Per-rule usage statistics (bytes/packets/percent/last matched)
      description: >
        Backs the "Usage" column on the Firewall/Local-In/Local-Out Policy
        list pages and the per-rule details drawer (docs/ref/todo/
        firewall-policy-rule-usage-stats-plan.md). Four important
        limitations:

        (1) SNAPSHOT, NOT CUMULATIVE — nftables' own counters reset to 0 on
        every full ruleset sync (Apply Settings), even when only one rule
        changed, so every number here is "since `countersSince`", not
        lifetime-of-the-rule. (2) `percent` on every rule, and
        `totalBytes`/`totalPackets`, are always computed across EVERY chain
        combined, never scoped to just the `chain` query filter — a rule's
        percentage does not change depending on which policy page it's
        viewed from. (3) `lastMatchedAt`/`lastMatchedSource` is a hybrid: for
        rules with `log` enabled it is resolved from the live traffic-log
        ring buffer (precise, but only as far back as the buffer still holds
        the entry); for rules without `log` (or once the log evidence has
        aged out of the buffer) it falls back to the background 10-second nft
        counter poll (`lastMatchedSource: "counter"`, accurate to roughly
        ±10s). (4) Disabled rules are never created in nftables at all and
        are therefore OMITTED from `rules` entirely — the frontend renders
        "—" for them rather than 0/Unused.
      parameters:
        - name: chain
          in: query
          required: false
          description: >-
            Filter the `rules` array to one chain (forward/input/output).
            Omitted or empty returns every chain. Does NOT affect
            `totalBytes`/`totalPackets`/each rule's `percent` (see above).
          schema:
            type: string
            enum: [forward, input, output]
      responses:
        '200':
          description: Per-rule usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleStats'
        '400':
          description: Invalid chain query parameter
        '401':
          description: No active session
        '503':
          description: Statistics service not wired up (should not happen in a normal build)

  /policies/{id}/endpoints:
    get:
      tags:
        - Firewall Policies
      summary: Top IPs/services observed matching one rule (troubleshooting)
      description: >
        "Which IP/service hit this rule" for the per-rule usage details
        drawer (docs/ref/todo/firewall-rule-matched-endpoints-plan.md).
        Originally aggregated live by scanning the in-memory traffic-log
        ring buffer on every request (no persistence, no background
        aggregator); since docs/ref/todo/persisted-rule-endpoints-plan.md
        (issue #141 follow-up) a rule with Monitor enabled instead reads
        this data from SQLite, which survives Apply Settings, a process
        restart, and clearing the Traffic Log — see the `source` field on
        `PolicyRuleEndpoints` for exactly which mode a given response used.
        Four hard limitations (true in BOTH modes unless noted):

        (1) REQUIRES `log` ENABLED — a rule with `log: false` always returns
        `logEnabled: false` and empty lists; there is no other way to see
        which packets matched it (this is an NFLOG limitation, not specific
        to either source mode — even a monitored rule collects nothing until
        its own `log` flag is turned on). (2) COUNTS ARE LOG ENTRIES, NOT
        BYTES — the underlying NFLOG capture carries no packet size, so
        `count` on every entry is "number of log events", not traffic volume
        (byte/packet totals live in GET /policies/stats instead). (3) THE
        DATA WINDOW: for `source: "buffer"`, results only cover whatever is
        still in the traffic-log buffer right now (see
        `bufferOldestAt`/`scannedEntries`); clearing the traffic log (or the
        buffer simply rolling over under heavy traffic) makes older matches
        disappear immediately, and a low-traffic rule can be pushed out
        entirely by a high-traffic one. For `source: "persisted"`, data
        instead accumulates in SQLite under a per-direction cap
        (`maxPerDirection`, LRU-evicted — see `capped`/`evicted`) starting
        from the moment Monitor was turned on (or last reset) — there is no
        backfill of data the buffer already had. (4) ONLY NEW CONNECTIONS
        AND DROPS ARE LOGGED — same NFLOG behavior as the Traffic Log pages:
        established/related traffic on an already-open connection is never
        logged again, so counts are not a full packet tally.

        Name resolution precedence differs deliberately from the Traffic Log
        pages: for each IP, a user-defined Address Object name
        (`addressName`) wins over a DNS-resolved `domain`, which wins over a
        DHCP-lease `hostname` — because here the point is "what did I name
        this", not "what does the internet call this".
      parameters:
        - name: id
          in: path
          required: true
          description: Policy rule id.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >-
            Max entries per category (sources/destinations/services).
            Default 10. Out-of-range or non-integer values are a 400 (unlike
            most other `limit` query params in this API, which silently
            clamp).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Matched endpoints for this rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleEndpoints'
        '400':
          description: Invalid limit query parameter (must be an integer 1-50)
        '401':
          description: No active session
        '404':
          description: Policy rule not found
        '503':
          description: Policy usage statistics service not wired up (should not happen in a normal build)

  /policies/{id}:
    put:
      tags:
        - Firewall Policies
      summary: Update an existing firewall policy rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRuleInput'
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
    delete:
      tags:
        - Firewall Policies
      summary: Delete a firewall policy rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policy deleted successfully
          content:
            application/json:
              schema:
                type: boolean
                example: true

  /policies/reorder:
    put:
      tags:
        - Firewall Policies
      summary: Save one chain's rules list in the new order (Drag and Drop sequence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - policies
              properties:
                chain:
                  type: string
                  enum: [forward, input, output]
                  description: >-
                    The chain being reordered. Every id in policies must
                    already belong to this chain, or the request is rejected
                    with 400 (an id from another chain would otherwise steal
                    that chain's priority sequence).
                policies:
                  type: array
                  items:
                    $ref: '#/components/schemas/PolicyRule'
      responses:
        '200':
          description: Reordered list saved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRule'

  /policies/{id}/toggle-log:
    post:
      tags:
        - Firewall Policies
      summary: Toggle logging state for a specific rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Logging status toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'

  /policies/{id}/toggle-status:
    post:
      tags:
        - Firewall Policies
      summary: Enable or disable a specific firewall rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rule active status toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'

  /policies/{id}/toggle-monitor:
    post:
      tags:
        - Firewall Policies
      summary: Toggle the persisted "Monitor" opt-in on a rule
      description: >-
        Flips PolicyRule.monitored. Turning it on starts a persisted running
        total (bytes/packets) from 0 that accumulates across every future
        Apply Settings and process restart, unlike the ephemeral
        "since last apply" counters exposed by GET /policies/stats. Turning
        it off permanently discards the accumulated total (the frontend is
        expected to confirm with the user before calling this to turn
        Monitor off). See docs/ref/todo/
        fqdn-retry-and-monitored-counters-plan.md (issue #141).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Monitor opt-in toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '401':
          description: No valid session
        '403':
          description: Forbidden (read-only role or -disable-edit mode)
        '404':
          description: Policy rule not found
        '503':
          description: Monitor counter store not available

  /policies/{id}/monitor/reset:
    post:
      tags:
        - Firewall Policies
      summary: Reset a rule's persisted Monitor counter back to 0
      description: >-
        Zeroes the rule's accumulated Monitor bytes/packets and resets
        monitoredSince to now. Only valid for a rule that currently has
        monitored=true. The frontend is expected to show a confirm dialog
        before calling this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Counter reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset:
                    type: boolean
        '400':
          description: Policy rule is not monitored
        '401':
          description: No valid session
        '403':
          description: Forbidden (read-only role or -disable-edit mode)
        '404':
          description: Policy rule not found
        '503':
          description: Monitor counter store not available

  /policies/apply:
