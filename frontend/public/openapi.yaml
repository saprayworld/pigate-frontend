  # =========================================================================
  # DNS BLOCKLISTS (bulk hosts-file import — docs/ref/todo/
  # dns-blocklist-import-plan.md). A separate feature from the deny-list
  # above: metadata lives in a JSON manifest on disk
  # (/var/lib/pigate/blocklists/manifest.json), NOT the database. GET is
  # available to any authenticated role; every mutation below (create,
  # upload, update, delete, toggle, refresh) requires super_admin because it
  # makes the device fetch an HTTP URL the caller supplies and/or writes
  # multi-MB files to disk. Block mode (sinkhole/nxdomain) is selected per
  # list, never per domain within a list.
  # =========================================================================
  /dns/blocklists:
    get:
      tags:
        - DNS Server
      summary: List all DNS blocklists (bulk hosts-file import)
      description: >-
        Returns manifest metadata for every subscribed/uploaded blocklist
        (id, name, sourceType, url, blockMode, enabled, domainCount,
        fileBytes, sha256, lastFetchedAt, lastError, createdAt) — never the
        domain list itself (a list can hold up to hundreds of thousands of
        entries). Metadata is stored in a single JSON manifest file
        (`/var/lib/pigate/blocklists/manifest.json`), not SQLite. Any
        authenticated role may call this endpoint.
      responses:
        '200':
          description: List of DNS blocklists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DNSBlocklist'
    post:
      tags:
        - DNS Server
      summary: Subscribe to a new URL-sourced DNS blocklist (super_admin only)
      description: >-
        Fetches the URL synchronously (HTTPS-only; SSRF-guarded — private,
        loopback, link-local and CGNAT addresses are refused at dial time,
        re-checked on every redirect) and parses it as a hosts-format file
        BEFORE writing anything to the manifest, so an unreachable/invalid
        URL never leaves a stale entry behind. The block mode is chosen per
        list via `blockMode` (see `DNSBlocklistInput`): `sinkhole` (default)
        answers `0.0.0.0` for an exact domain match only and does **not**
        cover subdomains; `nxdomain` answers NXDOMAIN and **covers every
        subdomain**, but requires dnsmasq >= 2.86 and counts against a
        separate, lower domain quota (`DNSBlocklistMaxNXDomainDomains`)
        because dnsmasq must parse its `conf-file` twice per Apply. Writes
        to `/var/lib/pigate/blocklists/` and the manifest only — does NOT
        restart dnsmasq; call `POST /dns/apply` afterwards to take effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSBlocklistInput'
      responses:
        '200':
          description: Blocklist created and fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSBlocklist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Caller is not a super_admin
        '503':
          description: DNS blocklist feature is not available on this server instance

  /dns/blocklists/upload:
    post:
      tags:
        - DNS Server
      summary: Upload a hosts-format file as a new DNS blocklist (super_admin only)
      description: >-
        Body is the raw hosts-format file content (`Content-Type:
        text/plain`), not JSON — the list name and block mode are passed as
        query parameters instead. Exempt from the global 1 MB request-body
        cap; capped instead at `DNSBlocklistMaxFileBytes` (16 MiB) via
        `http.MaxBytesReader`. Writes to `/var/lib/pigate/blocklists/` and
        the manifest only — does NOT restart dnsmasq; call `POST
        /dns/apply` afterwards to take effect.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: blockMode
          in: query
          required: false
          schema:
            type: string
            enum: [sinkhole, nxdomain]
            default: sinkhole
          description: >-
            `sinkhole` (default) answers `0.0.0.0`, exact-match only (no
            subdomain coverage). `nxdomain` answers NXDOMAIN and covers
            subdomains, but requires dnsmasq >= 2.86 and a separate, lower
            domain quota. Chosen per list, not per domain.
        - name: enabled
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", "0", "false"]
            default: "true"
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Blocklist created from upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSBlocklist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Caller is not a super_admin
        '503':
          description: DNS blocklist feature is not available on this server instance

  /dns/blocklists/{id}:
    put:
      tags:
        - DNS Server
      summary: Update a DNS blocklist's name/url/blockMode/enabled (super_admin only)
      description: >-
        Never re-fetches or re-parses the source. Changing only `blockMode`
        re-derives the `<id>.conf` file purely from the already-written
        `<id>.hosts` file (no network access) — switching modes therefore
        works offline and for upload-sourced lists too. Writes to
        `/var/lib/pigate/blocklists/` and the manifest only — does NOT
        restart dnsmasq; call `POST /dns/apply` afterwards to take effect.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSBlocklistInput'
      responses:
        '200':
          description: Blocklist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSBlocklist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Caller is not a super_admin
        '404':
          description: Blocklist not found
        '503':
          description: DNS blocklist feature is not available on this server instance
    delete:
      tags:
        - DNS Server
      summary: Delete a DNS blocklist (super_admin only)
      description: >-
        Removes both the `<id>.hosts` and (if present) `<id>.conf` file plus
        the manifest entry. Writes to `/var/lib/pigate/blocklists/` and the
        manifest only — does NOT restart dnsmasq; call `POST /dns/apply`
        afterwards to take effect.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blocklist deleted
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Caller is not a super_admin
        '503':
          description: DNS blocklist feature is not available on this server instance

  /dns/blocklists/{id}/toggle:
    post:
      tags:
        - DNS Server
      summary: Toggle a DNS blocklist's enabled flag (super_admin only)
      description: >-
        Re-checked against the cross-list domain-count quotas when
        re-enabling a currently disabled list (`DNSBlocklistMaxTotalDomains`
        always, plus `DNSBlocklistMaxNXDomainDomains` if its `blockMode` is
        `nxdomain`). Writes to the manifest only — does NOT restart
        dnsmasq; call `POST /dns/apply` afterwards to take effect.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blocklist toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSBlocklist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Caller is not a super_admin
        '503':
          description: DNS blocklist feature is not available on this server instance

  /dns/blocklists/{id}/refresh:
    post:
      tags:
        - DNS Server
      summary: Re-fetch a subscribe-URL DNS blocklist (super_admin only)
      description: >-
        Only meaningful for `sourceType: url` lists. A fetch/parse failure
        leaves the existing `<id>.hosts`/`<id>.conf` files and
        `domainCount` completely untouched — only `lastError` is recorded —
        so a transient network problem never takes down a list that is
        currently working. Writes to `/var/lib/pigate/blocklists/` and the
        manifest only — does NOT restart dnsmasq; call `POST /dns/apply`
        afterwards to take effect.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blocklist refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSBlocklist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Caller is not a super_admin
        '503':
          description: DNS blocklist feature is not available on this server instance

  /dns/apply:
    post:
      tags:
        - DNS Server
      summary: Apply DNS server configuration (regenerate dnsmasq config, restart daemon, re-sync firewall)
      responses:
        '200':
          description: DNS server configuration applied
          content:
            application/json:
              schema:
                type: boolean
                example: true

  /dns/clear-cache:
    post:
      tags:
        - DNS Server
      summary: Clear the dnsmasq DNS resolver cache
      responses:
        '200':
          description: DNS cache cleared
          content:
            application/json:
              schema:
                type: boolean
                example: true

  /dns/settings:
    get:
      tags:
        - DNS Server
      summary: Get the interfaces the DNS server is bound to
      responses:
        '200':
          description: DNS server listen-interface settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSServerSettings'
    put:
      tags:
        - DNS Server
      summary: Set the interfaces the DNS server should listen on
      description: |
        These interfaces are the ones dnsmasq actually listens for DNS on: applying
        the DNS config emits an `interface=<name>` line per selected interface (using
        dnsmasq `bind-dynamic`), so the DNS server works without any DHCP server
        enabled. A selected interface that is missing is harmless — dnsmasq binds it
        automatically if it later appears (no re-apply needed).

        Tolerates dangling references: names already saved are accepted even if the
        interface no longer exists on the device (e.g. a deleted VLAN), so they can be
        kept or removed without error. Only names newly added in the request are
        validated against the live interfaces; unknown new names are rejected.
        Independent from the DHCP server configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSServerSettings'
      responses:
        '200':
          description: Settings saved (echoes the stored settings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSServerSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /dns/resolve-ns:
    get:
      tags:
        - DNS Server
      summary: Auto-lookup the IP address(es) of an NS-delegation nameserver name
      description: >
        Resolves `name` to its IP address(es), for the "ค้นหา IP อัตโนมัติ" button
        next to an NS record's glue IP field (docs/ref/todo/
        dns-ns-delegation-plan.md). Resolution goes through this device's own
        resolver (`/etc/resolv.conf`, the same resolver dnsmasq/systemd-resolved
        uses) — NOT the upstream servers configured under `/dns/settings`, which
        would be shadowed by this zone's own `local=` directive. The lookup has a
        3 second timeout and a server-wide rate limit (burst 5, 1/s refill). A
        read-only GET, so it is never blocked by read-only/edit-disabled mode.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            example: ns1.example.com
          description: >
            Nameserver host name to resolve. Validated with the same
            charset/label/length rules the DNS record generator uses; a value
            with newlines or invalid characters returns 400 without ever being
            looked up or logged raw.
      responses:
        '200':
          description: Resolved address(es), deduplicated, IPv4 before IPv6, capped at 4
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The validated/normalized name that was resolved.
                    example: ns1.example.com
                  ips:
                    type: array
                    items:
                      type: string
                    example: ["203.0.113.53"]
        '400':
          description: Missing/invalid `name` (empty, malformed, or contains newlines)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The name did not resolve to any address.
        '429':
          description: Server-wide rate limit for this lookup exceeded; retry later.
        '502':
          description: >-
            The DNS lookup failed or timed out. The response message is
            generic — the raw resolver error is never relayed to the client.
        '503':
          description: The DNS Server service is not available on this server instance.

  # =========================================================================
  # SYSTEM & MAINTENANCE
  # =========================================================================
  /system/info:
    get:
      tags:
        - System & Maintenance
      summary: Get host identity for the dashboard System Information card
      description: >
        Composes hostname (via hostnamed), PiGate build version, OS base
        (/etc/os-release), board model (/proc/device-tree/model, Pi only),
        kernel version, uptime, and current system time + timezone. boardModel
        and kernelVersion are omitted when unreadable (e.g. on x86/WSL).
      responses:
        '200':
          description: System information retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'

  /system/capabilities:
    get:
      tags:
        - System & Maintenance
      summary: Get kernel capability detection status
      description: >
        Read-only probe of whether the kernel subsystems PiGate depends on
        (nftables via Netlink, D-Bus/systemd units for dnsmasq and
        systemd-resolved) are actually usable in this environment — e.g. real
        mode on WSL reports nftables unavailable instead of silently failing
        (issue #94). Results are cached for ~30s server-side; pass
        `?force=1` to bypass the cache and probe again immediately. In mock
        mode (`-mock=true` or `-mock-from-real=true`), every capability is
        always reported available with reason `mock`.
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
          description: Pass `force=1` to bypass the server-side cache and probe again.
      responses:
        '200':
          description: Capability status of every probed subsystem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCapabilities'
        '503':
          description: Capability service not available on this server instance

  /system/time:
    get:
      tags:
        - System & Maintenance
      summary: Get timezone and NTP network time synchronization configuration
      responses:
        '200':
          description: System time settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemTimeSettings'
    put:
      tags:
        - System & Maintenance
      summary: Save timezone and NTP server configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemTimeSettings'
      responses:
        '200':
          description: Time settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemTimeSettings'
        '400':
          description: Invalid timezone or NTP server value

  /system/time/manual:
    post:
      tags:
        - System & Maintenance
      summary: Set the wall clock manually (only allowed while NTP sync is disabled)
      description: >
        Sets the device clock to an absolute time via systemd-timedated. Rejected
        with 400 if NTP sync is currently enabled, or if the datetime is malformed
        or its year is outside 2020–2100. The time is runtime-only and never
        persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetManualTimeInput'
      responses:
        '200':
          description: Clock updated; returns the refreshed time settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemTimeSettings'
        '400':
          description: NTP sync is enabled, or datetime is invalid/out of range

  /system/hostname:
    get:
      tags:
        - System & Maintenance
      summary: Get device hostname and DHCP hostname-sharing setting
      responses:
        '200':
          description: System hostname settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHostnameSettings'
    put:
      tags:
        - System & Maintenance
      summary: Set device hostname and/or toggle sharing it with the WAN DHCP server (Option 12)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemHostnameSettings'
      responses:
        '200':
          description: Hostname settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHostnameSettings'
        '400':
          description: Invalid hostname (RFC 1123 label validation failed)

  /system/dhcp-health:
    get:
      tags:
        - System & Maintenance
      summary: Get DHCP link-local (169.254.x.x) fallback health-checker settings (issue #78)
      responses:
        '200':
          description: DHCP health-checker settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DhcpHealthSettings'
    put:
      tags:
        - System & Maintenance
      summary: Update DHCP health-checker thresholds (self-heals interfaces stuck on 169.254.x.x/no IPv4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DhcpHealthSettings'
      responses:
        '200':
          description: DHCP health-checker settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DhcpHealthSettings'
        '400':
          description: A threshold value is outside its allowed range

  /system/dns:
    get:
      tags:
        - System & Maintenance
      summary: Get system-wide DNS configuration
      responses:
        '200':
          description: System DNS settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSConfig'
    put:
      tags:
        - System & Maintenance
      summary: Update system-wide DNS configuration
      description: >
        Affects systemd-resolved for this device only (name resolution done
        by PiGate itself). **Does not write to or restart the local DNS
        Server (dnsmasq) anymore** — the DNS Server has its own upstream
        resolver setting (`upstreamMode`/`upstreamServers` on
        `PUT /api/dns/settings`, DNS Server page → Settings tab). In
        `upstreamMode: system` the new value here is picked up the next time
        pigate-dns.conf is regenerated (POST /api/dns/apply, a DNS Server
        settings save, boot, or restore) — not immediately by this call.
        `primaryDns`/`secondaryDns` (mode `static`) must be bare IP
        addresses and `localDomain` must match `^[a-zA-Z0-9.-]+$`
        (<=253 chars); invalid values return 400 rather than being written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSConfigInput'
      responses:
        '200':
          description: DNS configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSConfigInput'
        '400':
          $ref: '#/components/responses/BadRequest'

  /system/password:
    put:
      tags:
        - System & Maintenance
      summary: Change administrator dashboard login password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated successfully
        '400':
          description: Current password incorrect or validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: รหัสผ่านปัจจุบันไม่ถูกต้อง

  /system/services:
    get:
      tags:
        - System & Maintenance
      summary: Get statuses of critical network service daemons (nftables, isc-dhcp-server, NetworkManager, dnsmasq)
      description: Currently returns mock data — the statuses are hardcoded, not read from systemd.
      responses:
        '200':
          description: Services status list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkServiceStatus'

  /system/services/{id}/restart:
    post:
      tags:
        - System & Maintenance
      summary: Restart a system service daemon by service ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service restart command executed

  /system/reboot:
    post:
      tags:
        - System & Maintenance
      summary: Reboot the Raspberry Pi 5 board host — super_admin only
      security:
        - cookieAuth: []
      description: |
        Restarts the physical board via org.freedesktop.login1 (systemd-logind)
        over D-Bus — no shell execution. Restricted to super_admin; a read-only
        admin receives 403. Responds 200 immediately, then the board begins a
        graceful reboot ~1 second later, so the client should expect the
        connection to drop shortly after the response.
      responses:
        '200':
          description: Reboot accepted; board restarts within ~1 second
        '403':
          description: Forbidden — caller is not super_admin

  /system/shutdown:
    post:
      tags:
        - System & Maintenance
      summary: Shutdown/halt the Raspberry Pi 5 board host — super_admin only
      security:
        - cookieAuth: []
      description: |
        Powers off the physical board via org.freedesktop.login1 (systemd-logind)
        over D-Bus — no shell execution. Restricted to super_admin; a read-only
        admin receives 403. Responds 200 immediately, then the board begins a
        graceful power-off ~1 second later. Powering the board back on requires
        physical intervention.
      responses:
        '200':
          description: Shutdown accepted; board halts within ~1 second
        '403':
          description: Forbidden — caller is not super_admin

  /system/config/export:
    get:
      tags:
        - System & Maintenance
      summary: Export full configuration backup (schema v2) — super_admin only
      security:
        - cookieAuth: []
      description: |
        Returns a complete, typed JSON backup (schema v2) of all persisted
        configuration: interfaces, raw static routes (gateway "default" kept
        verbatim), address/service objects, firewall policies, per-interface DHCP
        configs, DHCP reservations, DNS zones+records, DNS server listen
        interfaces, system DNS, QoS rules, system time, and hostname.

        Runtime/live state (DHCP leases, live time status, firewall counters) is
        excluded by design.

        **super_admin only.** The payload contains real Wi-Fi passwords and,
        when `includeUsers=1`, user credential hashes — a read-only admin gets
        `403`. `meta.checksum` is a SHA-256 over the canonical config, so a
        reformatted file still verifies on import. Also available in
        `-disable-edit` (read-only) mode.

        DNS blocklist metadata (`config.blocklists`, including each list's
        `blockMode`) is always included — it lives in a JSON manifest, not
        the database, but is still part of the exported config. The
        underlying `<id>.hosts` file content is NOT included by default
        (`config.blocklistFiles`); pass `includeBlocklistFiles=1` to embed it
        (gzip+base64), for `sourceType: upload` lists always, and for
        `sourceType: url` lists only when explicitly requested — a
        URL-sourced list can otherwise be recovered with Refresh, so leaving
        this off keeps most exports small. `<id>.conf` (the nxdomain-mode
        derived artifact) is never included; it is always regenerated from
        `<id>.hosts` on import.
      parameters:
        - name: includeUsers
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
          description: When set, embeds the users table (including bcrypt hashes).
        - name: includeBlocklistFiles
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
          description: >-
            When set, embeds each DNS blocklist's `<id>.hosts` file content
            (gzip+base64) in `config.blocklistFiles`, capped at a combined 8
            MB (any remainder is dropped with a warning). Off by default.
        - name: X-Backup-Passphrase
          in: header
          required: false
          schema:
            type: string
          description: When provided, the config section is AES-256-GCM encrypted with an Argon2id-derived key. Sent as a header (not query) to keep it out of access logs.
      responses:
        '200':
          description: Configuration backup payload (schema v2)
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="pigate-backup-<hostname>-<timestamp>.json"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden — requires super_admin

  /system/config/import:
    post:
      tags:
        - System & Maintenance
      summary: Import & restore a configuration backup (Replace semantics) — super_admin only
      security:
        - cookieAuth: []
      description: |
        Validates, snapshots, restores (in a single transaction), and re-applies a
        backup produced by the export endpoint. Accepts both schema v2 and legacy
        v1 files (v1 is mapped into v2 automatically).

        **Replace semantics:** all user-editable configuration is wiped and
        restored from the file. System-seeded rows (system address/service
        objects, `system`/`defaultgateway` routes) are preserved. On any error the
        transaction rolls back and the original DB is left untouched — a pre-import
        DB snapshot is also written next to the DB file.

        Interfaces are matched by name to the live device; interfaces in the file
        that don't exist here are skipped (reported in `warnings`). After the DB
        restore the config is re-applied to the kernel in startup order; individual
        apply failures are non-fatal and returned as `warnings`.

        Users are only restored when `includeUsers=1` and the file contains a
        `users` section; the importing account is always kept as an active
        super_admin to prevent lock-out. **super_admin only**; blocked in
        `-disable-edit` mode.
      parameters:
        - name: includeUsers
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
          description: When set (and the file has a users section), restores user accounts.
        - name: X-Backup-Passphrase
          in: header
          required: false
          schema:
            type: string
          description: Required to decrypt an encrypted backup (`meta.encrypted=true`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupFile'
      responses:
        '200':
          description: Import completed (see counts + non-fatal warnings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: |
            Invalid/corrupt file, checksum mismatch, unsupported schema version,
            wrong passphrase, failed validation, or a restore error (no changes applied).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden — requires super_admin
        '422':
          description: Encrypted backup imported without a passphrase
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  needPassphrase:
                    type: boolean
                    example: true

  # =========================================================================
  # QoS BANDWIDTH CONTROL
  # =========================================================================
  /qos/rules:
    get:
      tags:
        - QoS
      summary: List all QoS rules
      operationId: getQosRules
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of QoS rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QosRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - QoS
      summary: Create a new QoS rule
      operationId: createQosRule
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QosRuleInput'
      responses:
        '201':
          description: QoS rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QosRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /qos/rules/{id}:
    get:
      tags:
        - QoS
      summary: Get a QoS rule by ID
      operationId: getQosRuleById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QoS rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QosRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - QoS
      summary: Update a QoS rule
      operationId: updateQosRule
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QosRuleInput'
      responses:
        '200':
          description: Updated QoS rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QosRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - QoS
      summary: Delete a QoS rule
      operationId: deleteQosRule
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rule deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: QoS rule deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /qos/rules/{id}/toggle:
    post:
      tags:
        - QoS
      summary: Toggle QoS rule enabled/disabled
      operationId: toggleQosRule
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated QoS rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QosRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /qos/sync:
    post:
      tags:
        - QoS
      summary: Sync all QoS rules to kernel (tc)
      operationId: syncQosRules
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: QoS rules synced to kernel
        '401':
          $ref: '#/components/responses/Unauthorized'

  /qos/status/{iface}:
    get:
      tags:
        - QoS
      summary: Get live kernel QoS status for an interface
      operationId: getQosIfaceStatus
      security:
        - cookieAuth: []
      parameters:
        - name: iface
          in: path
          required: true
          schema:
            type: string
          example: eth0
      responses:
        '200':
          description: Interface QoS status from kernel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QosIfaceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /qos/iface/{iface}:
    delete:
      tags:
        - QoS
      summary: Clear all QoS qdiscs/classes from an interface
      operationId: clearQosIface
      security:
        - cookieAuth: []
      parameters:
        - name: iface
          in: path
          required: true
          schema:
            type: string
          example: eth0
      responses:
        '200':
          description: QoS cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: QoS cleared for interface eth0
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =========================================================================
  # MULTI-WAN FAILOVER (docs/ref/todo/multi-wan-failover-plan.md)
  # Phase 1 only: uplink health-check configuration + read-only live
  # status/metrics. No routing is ever changed by anything in this section —
  # the kill switch/mode/manual-override endpoints (superAdminRoute) belong
  # to Phase 2 and are not implemented yet.
  # =========================================================================
  /wan/uplinks:
    get:
      tags:
        - WAN
      summary: List all configured WAN uplinks
      operationId: getWanUplinks
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of WAN uplinks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WanUplink'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - WAN
      summary: Create a new WAN uplink
      operationId: createWanUplink
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WanUplinkInput'
      responses:
        '201':
          description: WAN uplink created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WanUplink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wan/uplinks/{id}:
    put:
      tags:
        - WAN
      summary: Update a WAN uplink
      operationId: updateWanUplink
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WanUplinkInput'
      responses:
        '200':
          description: Updated WAN uplink
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WanUplink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - WAN
      summary: Delete a WAN uplink
      operationId: deleteWanUplink
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Uplink deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: WAN uplink deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /wan/status:
    get:
      tags:
        - WAN
      summary: Get live health status of every configured WAN uplink
      description: >-
        Always returns one entry per configured uplink, even one that has
        never been probed yet (state=unknown in that case). Phase 1 always
        reports bypassedByStaticRoute=false, activeUplinkId="",
        lastSwitchAt="", lastSwitchReason="" — those four fields are reserved
        for the not-yet-implemented Phase 2 automatic failover controller.
      operationId: getWanStatus
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Live WAN uplink status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WanStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wan/metrics:
    get:
      tags:
        - WAN
      summary: Get latency/jitter/loss history for one WAN uplink
      description: >-
        Backed by a RAM-only 5-minute-bucket ring (never persisted to SQLite,
        see tech_stack_design.md §8) — history resets on a pigate restart.
        jitterMs is omitted for buckets built only from TCP connect-only
        probes (metricQuality="connect-only"), since TCP-connect cannot
        measure jitter.
      operationId: getWanMetrics
      security:
        - cookieAuth: []
      parameters:
        - name: uplink
          in: query
          required: true
          schema:
            type: string
          example: wan-3f9c2b1a
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
            default: 1h
      responses:
        '200':
          description: >-
            Time series, oldest first, always exactly the window's bucket
            count long (empty buckets read back as zero-valued points).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WanMetricPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

# =========================================================================
# COMPONENTS & SCHEMAS
# =========================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pigate_session
      description: |
        HttpOnly session cookie set by POST /auth/login. Sent automatically by
        the browser on same-site requests; it is the only supported auth channel.

  responses:
    Unauthorized:
      description: Authentication required or token is invalid/expired
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized

    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Bad Request

    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Not Found

  schemas:
    # --- Central Event Log Schemas ---
    SystemEvent:
      type: object
      description: A single audit/event log entry, persisted to SQLite across reboots.
      properties:
        id:
          type: integer
          format: int64
          example: 42
        time:
          type: string
          format: date-time
          description: Event timestamp in RFC3339 UTC (frontend converts to local time)
          example: "2026-07-09T04:12:33Z"
        category:
          type: string
          enum: [auth, user, network, firewall, route, dhcp, dns, qos, system, config]
          example: auth
        action:
          type: string
          description: Machine-readable action identifier
          example: login.failed
        severity:
          type: string
          enum: [info, warning, error, critical]
          example: warning
        actor:
          type: string
          description: Username that performed the action, or "system"
          example: pigate
        target:
          type: string
          description: Object affected by the action (user/interface/policy name, MAC, ...)
          example: wlan0
        message:
          type: string
          description: Human-readable message for the UI
          example: Login failed for pigate (wrong password)

    # --- User Management Schemas ---
    User:
      type: object
      description: A dashboard administrator account. The password hash is never serialized.
      properties:
        id:
          type: string
          example: user-3f9a2c1b7e6d5a4c
        username:
          type: string
          example: pigate
        isInitial:
          type: boolean
          description: If true, the user must change their password before using other endpoints.
          example: false
        role:
          type: string
          enum: [super_admin, admin_readonly]
          example: super_admin
        status:
          type: string
          enum: [active, disabled]
          example: active
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          description: 3-32 characters, only a-z A-Z 0-9 and underscore. Immutable after creation.
          example: viewer
        password:
          type: string
          format: password
          description: At least 8 characters.
          example: password123
        role:
          type: string
          enum: [super_admin, admin_readonly]
          example: admin_readonly

    UpdateUserRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [super_admin, admin_readonly]
          example: super_admin
        password:
          type: string
          format: password
          nullable: true
          description: Optional. When present, resets the user's password and forces a change on next login.
          example: newpassword456

    # --- Dashboard Schemas ---
    DashboardStats:
      type: object
      required:
        - firewallStatus
        - totalTrafficInBytes
        - totalTrafficOutBytes
        - dhcpLeasesCount
        - wifiStatus
        - wifiSSID
      properties:
        firewallStatus:
          type: string
          example: Active
        totalTrafficInBytes:
          type: integer
          format: int64
          description: Cumulative WAN rx bytes since boot (RAM-only; resets on reboot).
          example: 9345678901
        totalTrafficOutBytes:
          type: integer
          format: int64
          description: Cumulative WAN tx bytes since boot (RAM-only; resets on reboot).
          example: 3987654321
        dhcpLeasesCount:
          type: integer
          example: 18
        wifiStatus:
          type: string
          example: wlan0 Master
        wifiSSID:
          type: string
          example: PiGate-Secure

    PerformanceMetrics:
      type: object
      description: >
        Live host telemetry. The flat cpu/memory/temp fields are retained for
        backward-compatibility; the *Detail objects and storage carry the richer
        data used by the redesigned dashboard.
      required:
        - cpu
        - memory
        - temp
        - cpuDetail
        - memDetail
        - tempDetail
        - storage
        - sessions
      properties:
        cpu:
          type: number
          format: float
          description: CPU usage percent (mirror of cpuDetail.usagePercent).
          example: 34.2
        memory:
          type: number
          format: float
          description: Memory usage percent (mirror of memDetail.percent).
          example: 63.7
        temp:
          type: number
          format: float
          description: SoC temperature °C (0 when tempDetail.available is false).
          example: 58.1
        cpuDetail:
          type: object
          required: [usagePercent, cores, modelName, freqMhz, freqAvailable]
          properties:
            usagePercent:
              type: number
              format: float
              example: 34.2
            cores:
              type: integer
              example: 4
            modelName:
              type: string
              example: Cortex-A76
            freqMhz:
              type: number
              format: float
              example: 2400
            freqAvailable:
              type: boolean
              description: false when /sys cpufreq is absent (e.g. WSL/VM).
              example: true
        memDetail:
          type: object
          required: [usedBytes, totalBytes, percent]
          properties:
            usedBytes:
              type: integer
              format: int64
              example: 5476083712
            totalBytes:
              type: integer
              format: int64
              example: 8589934592
            percent:
              type: number
              format: float
              example: 63.7
        tempDetail:
          type: object
          required: [celsius, throttleCelsius, available]
          properties:
            celsius:
              type: number
              format: float
              example: 58.1
            throttleCelsius:
              type: number
              format: float
              example: 80
            available:
              type: boolean
              description: false when no thermal zone exists (e.g. WSL/x86).
              example: true
        storage:
          type: object
          required: [path, usedBytes, totalBytes, percent]
          properties:
            path:
              type: string
              example: /
            usedBytes:
              type: integer
              format: int64
              example: 44023414784
            totalBytes:
              type: integer
              format: int64
              example: 137438953472
            percent:
              type: number
              format: float
              example: 32.0
        sessions:
          $ref: '#/components/schemas/SessionCounts'

    SessionCounts:
      type: object
      description: >
        Conntrack session snapshot shared by PerformanceMetrics (SSE push,
        ~5s) and TrafficDetail (poll, 60s). total/max/available come straight
        from /proc/sys/net/netfilter/nf_conntrack_count|max (fresh, ~5s).
        tcp/udp/icmp/other are counted from the conntrack dump the
        traffic-detail poller already does every ~10s, so they can lag total
        by up to one poll cycle and are capped server-side (protoCapped=true
        when the dump hit that cap) — do not stack the per-proto counts on
        top of total in the same chart line, they are different
        freshness/sources and will not sum cleanly.
      required:
        - total
        - tcp
        - udp
        - icmp
        - other
        - max
        - available
        - protoSampledAt
        - protoCapped
      properties:
        total:
          type: integer
          example: 412
        tcp:
          type: integer
          example: 288
        udp:
          type: integer
          example: 103
        icmp:
          type: integer
          example: 8
        other:
          type: integer
          example: 13
        max:
          type: integer
          description: nf_conntrack_max (0 when unavailable).
          example: 262144
        available:
          type: boolean
          description: false when nf_conntrack is not loaded (e.g. WSL/dev box).
          example: true
        protoSampledAt:
          type: string
          format: date-time
          description: When tcp/udp/icmp/other were last sampled; "" if never sampled yet.
          example: '2026-07-30T10:15:00Z'
        protoCapped:
          type: boolean
          description: true when the conntrack dump that produced tcp/udp/icmp/other hit the per-dump flow cap.
          example: false

    SessionHistoryPoint:
      type: object
      description: One sample in the RAM-only Active Sessions history ring (30 minutes, 5s cadence).
      required:
        - t
        - total
        - tcp
        - udp
        - icmp
        - other
      properties:
        t:
          type: string
          format: date-time
          example: '2026-07-30T10:15:00Z'
        total:
          type: integer
          example: 412
        tcp:
          type: integer
          example: 288
        udp:
          type: integer
          example: 103
        icmp:
          type: integer
          example: 8
        other:
          type: integer
          example: 13

    SystemInfo:
      type: object
      required:
        - hostname
        - version
        - osName
        - uptimeSeconds
        - systemTime
        - timezone
      properties:
        hostname:
          type: string
          example: PiGate-RPI5
        version:
          type: string
          example: 2.3.2
        osName:
          type: string
          example: Raspberry Pi OS (64-bit)
        boardModel:
          type: string
          description: Omitted when unreadable (non-Pi / x86).
          example: Raspberry Pi 5 Model B Rev 1.0
        kernelVersion:
          type: string
          description: Omitted when unreadable.
          example: 6.6.31-v8+
        uptimeSeconds:
          type: integer
          format: int64
          description: Seconds since boot; the client ticks its own clock between polls.
          example: 273153
        systemTime:
          type: string
          format: date-time
          example: '2026-07-06T09:41:00+07:00'
        timezone:
          type: string
          example: Asia/Bangkok

    CapabilityStatus:
      type: object
      required:
        - id
        - name
        - available
        - degraded
        - reason
        - detail
        - checkedAt
      properties:
        id:
          type: string
          description: >-
            Stable subsystem id (registry key), e.g. `firewall`, `dbus`,
            `dnsmasq`, `resolved`, `conntrack`, `conntrack-events`.
          example: firewall
        name:
          type: string
          description: Human-readable display name.
          example: Firewall (nftables)
        available:
          type: boolean
          description: Whether the subsystem is usable at all.
        degraded:
          type: boolean
          description: >
            True when the subsystem is available but not fully healthy (e.g.
            the probe passed but the last real apply attempt failed).
        reason:
          type: string
          description: Machine-readable reason code.
          enum:
            - ok
            - mock
            - not_supported
            - permission_denied
            - no_dbus
            - service_missing
            - service_inactive
            - apply_failed
            - probe_failed
            - acct_disabled
            - events_unavailable
          example: not_supported
        detail:
          type: string
          description: Human-readable (Thai) explanation for the UI banner.
          example: เคอร์เนลของเครื่องนี้ไม่รองรับ nf_tables (พบบ่อยบน WSL/คอนเทนเนอร์)
        checkedAt:
          type: string
          format: date-time
          description: When this status was last (re)computed.

    SystemCapabilities:
      type: object
      required:
        - mock
        - checkedAt
        - capabilities
      properties:
        mock:
          type: boolean
          description: True when the server is running in mock mode (-mock or -mock-from-real).
        checkedAt:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityStatus'

    TrafficBucket:
      type: object
      required:
        - ts
        - rxBytes
        - txBytes
      properties:
        ts:
          type: string
          format: date-time
          description: Bucket start time (device local, 5-minute aligned).
          example: '2026-07-06T09:00:00+07:00'
        rxBytes:
          type: integer
          format: int64
          example: 123456789
        txBytes:
          type: integer
          format: int64
          example: 2345678

    TrafficHistory:
      type: object
      required:
        - interfaces
        - buckets
      properties:
        interfaces:
          type: array
          items:
            type: string
          example: [eth0]
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/TrafficBucket'

    TrafficCategorySlice:
      type: object
      required: [name, bytes, percent]
      properties:
        name:
          type: string
          description: >-
            A Service Object name the flow's (protocol, destination port)
            matched (narrowest matching port range wins), or "Other" when
            nothing matches.
          example: HTTPS
        bytes:
          type: integer
          format: int64
          example: 5120000000
        percent:
          type: number
          format: float
          description: Share of observedBytes (not of the WAN total).
          example: 62.1

    TopTalker:
      type: object
      required: [ip, hostname, mac, bytes, percent]
      properties:
        ip:
          type: string
          description: Pre-NAT LAN-side source IP (conntrack original tuple).
          example: 192.168.1.50
        hostname:
          type: string
          description: DHCP lease/reservation hostname; falls back to the IP itself.
          example: NAS-Server
        mac:
          type: string
          example: 'AA:11:22:33:44:01'
        bytes:
          type: integer
          format: int64
          example: 4800000000
        percent:
          type: number
          format: float
          description: Share of observedBytes (not of the WAN total).
          example: 39.5

    TopRule:
      type: object
      required: [ruleId, name, chain, action, bytes, packets, percent]
      properties:
        ruleId:
          type: string
        name:
          type: string
        chain:
          type: string
          enum: [input, forward, output]
        action:
          type: string
          enum: [ACCEPT, DROP]
        bytes:
          type: integer
          format: int64
        packets:
          type: integer
          format: int64
        percent:
          type: number
          format: float
          description: >-
            Share of total traffic across all returned rule deltas — NOT
            observedBytes (different accounting source: nftables' own exact
            counter vs. conntrack-derived estimate).

    TrafficDetail:
      type: object
      required: [window, observedBytes, estimated, accuracy, categories, topTalkers, topRules, generatedAt, sessions, sessionHistory]
      properties:
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        observedBytes:
          type: integer
          format: int64
          description: >-
            Total bytes the conntrack-based collector actually observed in
            this window — the denominator for categories/topTalkers percent,
            NOT the WAN total from /dashboard/traffic.
        estimated:
          type: boolean
          description: >-
            Always true — categories/topTalkers are conntrack-derived figures.
            Kept for backward compatibility; see `accuracy` for the current
            (phase 2) accuracy signal. topRules is exact regardless.
        accuracy:
          type: string
          enum: [estimated, near-exact]
          description: >-
            "estimated" when categories/topTalkers come from the 10s conntrack
            poll alone (~95-99% typical accuracy, worse under bursts of
            short-lived flows). "near-exact" once the conntrack DESTROY event
            listener is also active, crediting the final byte count of every
            flow at teardown — including flows that start and end entirely
            between two polls. Falls back to "estimated" automatically when
            the event listener is unavailable (see GET
            /api/system/capabilities id `conntrack-events`); topRules is exact
            regardless of this field.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/TrafficCategorySlice'
        topTalkers:
          type: array
          items:
            $ref: '#/components/schemas/TopTalker'
        topRules:
          type: array
          items:
            $ref: '#/components/schemas/TopRule'
        generatedAt:
          type: string
          format: date-time
        sessions:
          $ref: '#/components/schemas/SessionCounts'
        sessionHistory:
          type: array
          description: RAM-only Active Sessions history ring (30 minutes, 5s cadence) used to seed the Dashboard chart.
          items:
            $ref: '#/components/schemas/SessionHistoryPoint'

    TopHost:
      type: object
      required: [ip, hostname, mac, bytes, percent, bytesUp, bytesDown, private, domain]
      description: >-
        One ranked row for the Statistics page's Top Source Hosts / Top
        Destinations cards (same shape for both).
      properties:
        ip:
          type: string
          example: 192.168.1.101
        hostname:
          type: string
          description: DHCP lease/reservation hostname; falls back to the IP itself.
          example: iPhone-13
        mac:
          type: string
          example: '99:88:77:66:55:44'
        bytes:
          type: integer
          format: int64
          example: 2100000000
        percent:
          type: number
          format: float
          description: Share of observedBytes.
          example: 38.7
        bytesUp:
          type: integer
          format: int64
          description: >-
            Bytes in the flow's orig direction (src -> dst), same convention
            for Top Source Hosts and Top Destinations alike (not relative to
            ip's own role in the flow). bytesUp + bytesDown always equals
            bytes.
          example: 168000000
        bytesDown:
          type: integer
          format: int64
          description: Bytes in the flow's reply direction (dst -> src); see bytesUp for the direction convention.
          example: 1932000000
        private:
          type: boolean
          description: >-
            True when ip is RFC1918/link-local/loopback/ULA (a LAN address).
            A conversation initiated from the internet can appear as
            "source" too (conntrack Forward tuple) — false in that case, so
            the UI can visually separate LAN hosts from internet hosts.
          example: true
        domain:
          type: string
          description: >-
            The domain name dnsmasq most recently answered for ip (empty
            when unknown, DNS Statistics is disabled, or the mapping
            expired). This is a value the DNS server ANSWERED, used for
            DISPLAY ONLY — it can be poisoned by any LAN client asking its
            own DNS server to answer arbitrary names, so it must never be
            treated as fact or used for firewall/routing decisions. May be
            stale (the IP could since be reused for another domain, e.g.
            CDN/cloud load balancers).
          example: www.youtube.com
        rateBpsUp:
          type: integer
          format: int64
          description: >-
            Real-time throughput in bits/second (docs/ref/todo/
            statistics-traffic-speed-plan.md), flow-relative in the SAME
            direction convention as bytesUp (Orig, i.e. src -> dst) — not the
            LAN-relative convention BandwidthPoint uses. This is an AVERAGE
            over the most recent conntrack poll window (~10 seconds), not an
            instantaneous value, and only as accurate as the response's own
            accuracy field. Only present on GET /api/statistics/traffic/hosts
            (the Traffic page) — the Overview page's GET
            /api/statistics/traffic reuses this same schema but never
            populates this field, so it is entirely absent from that
            response's JSON.
          example: 512000
        rateBpsDown:
          type: integer
          format: int64
          description: >-
            Real-time throughput in bits/second in the reply direction (see
            rateBpsUp for the shared caveats: average over ~10s, conntrack
            accuracy, absent on the Overview page's response).
          example: 4300000

    TopConversation:
      type: object
      required: [srcIp, srcHostname, dstIp, dstHostname, proto, dstPort, bytes, percent, bytesUp, bytesDown, dstDomain]
      description: >-
        One src -> dst:port flow-tuple row for the Top Conversations card. A
        4-tuple (no source port — model.FlowSample does not carry one; the
        source port is ephemeral and not meaningful for ranking anyway).
      properties:
        srcIp:
          type: string
          example: 192.168.1.101
        srcHostname:
          type: string
          example: iPhone-13
        dstIp:
          type: string
          example: 142.250.80.46
        dstHostname:
          type: string
          example: 142.250.80.46
        proto:
          type: string
          description: '"TCP"/"UDP"/"ICMP", or "IP:<n>" for anything else.'
          example: TCP
        dstPort:
          type: integer
          example: 443
        bytes:
          type: integer
          format: int64
          example: 9000000
        percent:
          type: number
          format: float
          description: Share of observedBytes.
          example: 12.4
        bytesUp:
          type: integer
          format: int64
          description: >-
            Bytes sent srcIp -> dstIp (the flow's orig direction). bytesUp +
            bytesDown always equals bytes.
          example: 900000
        bytesDown:
          type: integer
          format: int64
          description: Bytes sent dstIp -> srcIp (the flow's reply direction).
          example: 8100000
        dstDomain:
          type: string
          description: >-
            Same display-only domain enrichment as TopHost.domain, applied to
            dstIp. srcIp has no equivalent field (always a LAN address in
            this table).
          example: www.youtube.com

    TopDomain:
      type: object
      required: [domain, queryType, count, percent]
      description: >-
        One ranked row for the "Top Queried Domains" card
        (docs/ref/todo/statistics-dns-top-domain-plan.md). Fed by the DNS
        query-log watcher; empty/absent entirely when DNS Statistics
        (dns/settings.queryLogging) is disabled.
      properties:
        domain:
          type: string
          example: www.youtube.com
        queryType:
          type: string
          description: DNS record type of the most recently seen query for this domain.
          example: A
        count:
          type: integer
          format: int64
          example: 128
        percent:
          type: number
          format: float
          description: Share of TrafficStatistics.dnsQueries (not observedBytes).
          example: 22.5

    TopDeniedSource:
      type: object
      required: [ip, hostname, count, percent]
      description: >-
        One ranked row for the Top Denied Sources card. count is an event
        count, not bytes, and is a sampled approximation (see
        TrafficStatistics.deniedSampled).
      properties:
        ip:
          type: string
          example: 203.0.113.9
        hostname:
          type: string
          description: DHCP lease/reservation hostname; falls back to the IP itself.
          example: 203.0.113.9
        count:
          type: integer
          format: int64
          example: 42
        percent:
          type: number
          format: float
          description: Share of deniedEvents (not observedBytes).
          example: 55.3

    TopDeniedPort:
      type: object
      required: [proto, port, count, percent]
      description: >-
        One ranked "protocol/port" row for the Top Denied Ports card. count
        is an event count, not bytes, and is a sampled approximation (see
        TrafficStatistics.deniedSampled).
      properties:
        proto:
          type: string
          example: TCP
        port:
          type: string
          example: '22'
        count:
          type: integer
          format: int64
          example: 30
        percent:
          type: number
          format: float
          description: Share of deniedEvents (not observedBytes).
          example: 39.5

    TrafficStatistics:
      type: object
      required:
        - window
        - observedBytes
        - accuracy
        - topSources
        - topDestinations
        - topConversations
        - deniedSources
        - deniedPorts
        - deniedSampled
        - deniedEvents
        - truncated
        - topDomains
        - dnsQueries
        - dnsLoggingEnabled
        - dnsTruncated
        - series
        - generatedAt
      description: >-
        The /statistics/traffic response backing the Statistics Overview page
        (`/statistics/overview`).
      properties:
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        observedBytes:
          type: integer
          format: int64
          description: >-
            Total bytes the conntrack-based collector observed in this
            window — the denominator for topSources/topDestinations/
            topConversations percentages.
        accuracy:
          type: string
          enum: [estimated, near-exact]
          description: Same signal as TrafficDetail.accuracy (see there for details).
        topSources:
          type: array
          items:
            $ref: '#/components/schemas/TopHost'
        topDestinations:
          type: array
          items:
            $ref: '#/components/schemas/TopHost'
        topConversations:
          type: array
          items:
            $ref: '#/components/schemas/TopConversation'
        deniedSources:
          type: array
          items:
            $ref: '#/components/schemas/TopDeniedSource'
        deniedPorts:
          type: array
          items:
            $ref: '#/components/schemas/TopDeniedPort'
        deniedSampled:
          type: boolean
          description: >-
            Always true — deniedSources/deniedPorts come from a rate-limited
            nftables log rule, so they are a sampled approximation, never an
            exact packet count. Never mix these counts into observedBytes'
            percentages.
        deniedEvents:
          type: integer
          format: int64
          description: Number of NFLOG DROP events actually counted in this window.
        truncated:
          type: boolean
          description: >-
            True when any per-bucket tracking map (hosts/destinations/
            conversations/denied sources/denied ports) hit its cap during
            this window — the ranking may be missing entries.
        topDomains:
          type: array
          description: >-
            "Top Queried Domains" card rows. Always an empty array (not
            omitted) when DNS Statistics is disabled — see
            dnsLoggingEnabled.
          items:
            $ref: '#/components/schemas/TopDomain'
        dnsQueries:
          type: integer
          format: int64
          description: >-
            Total DNS queries observed in this window — the denominator for
            topDomains percentages (a different unit than observedBytes).
        dnsLoggingEnabled:
          type: boolean
          description: >-
            Mirrors DNSServerSettings.queryLogging — lets the UI show an
            accurate empty-state ("not enabled yet") instead of an empty list.
        dnsTruncated:
          type: boolean
          description: >-
            True when the domain-query ring hit its per-bucket tracking cap
            during this window — topDomains may be missing entries.
        series:
          type: array
          description: >-
            Bandwidth-over-time chart data backing the Statistics Overview
            page's top row (docs/ref/todo/
            statistics-overview-bandwidth-chart-plan.md). Fixed-length,
            zero-filled 5-minute buckets from the same conntrack-derived
            bucket ring as observedBytes/topSources/etc: the number of points
            equals the window's 5-minute bucket count (3/6/12/36/72/144/288
            for window=15m/30m/1h/3h/6h/12h/24h respectively), sorted oldest
            -> newest.
            sum(series[].bytes) always equals observedBytes exactly (buckets
            outside the array's own time axis, e.g. after a long quiet
            period, are carried into the nearest edge point rather than
            dropped, so this invariant always holds). IMPORTANT: direction
            here is LAN-relative (bytesUp = leaving the LAN, bytesDown =
            entering the LAN), computed from each flow's source/destination
            IP — this is a DIFFERENT convention than TopHost.bytesUp/
            bytesDown and TopConversation.bytesUp/bytesDown above, which stay
            flow-relative (orig/reply) per their own descriptions. A row that
            represents an internet-initiated flow can therefore show
            "opposite" up/down between this array and the Top Hosts cards on
            the same page — this is expected, not a bug.
          items:
            $ref: '#/components/schemas/BandwidthPoint'
        generatedAt:
          type: string
          format: date-time

    BandwidthPoint:
      type: object
      required: [ts, bytes, bytesUp, bytesDown]
      description: >-
        One point of a bandwidth-over-time series (TrafficStatistics.series,
        TrafficTopHosts.series, or TrafficHostDetail.series) — a single
        5-minute bucket. IMPORTANT: the meaning of bytesUp/bytesDown depends
        on WHICH schema's series this point came from — see each schema's
        own `series` property description for its convention (LAN-relative
        vs. flow-relative) and denominator; this shape is shared, the
        direction semantics are not.
      properties:
        ts:
          type: string
          format: date-time
          description: >-
            RFC3339 start of this bucket, in device local time (same clock as
            the rest of the bucket ring — not UTC like generatedAt; the
            offset in RFC3339 makes both parseable browser-side).
          example: '2026-08-01T14:35:00+07:00'
        bytes:
          type: integer
          format: int64
          description: Always equals bytesUp + bytesDown.
          example: 4200000
        bytesUp:
          type: integer
          format: int64
          description: Upload bytes in this bucket — direction convention set by the containing schema's `series` property, see its description.
          example: 300000
        bytesDown:
          type: integer
          format: int64
          description: Download bytes in this bucket — direction convention set by the containing schema's `series` property, see its description.
          example: 3900000

    DNSQueryPoint:
      type: object
      required: [ts, count]
      description: >-
        One point of DNSQueryStatistics.querySeries (docs/ref/todo/
        statistics-dns-query-bar-chart-plan.md T-02/T-05) — a single 5-minute
        bucket. count is the NUMBER OF DNS QUERIES observed in the bucket,
        not bytes — deliberately a separate schema from BandwidthPoint so
        clients can't confuse a query count with a byte count.
      properties:
        ts:
          type: string
          format: date-time
          description: >-
            RFC3339 start of this bucket, in device local time (same
            clock/format as BandwidthPoint.ts).
          example: '2026-08-01T14:35:00+07:00'
        count:
          type: integer
          format: int64
          description: Number of DNS queries recorded in this bucket.
          example: 42

    TrafficTopHosts:
      type: object
      required: [window, observedBytes, accuracy, truncated, limit, sources, destinations, series, generatedAt]
      description: >-
        The /statistics/traffic/hosts response backing the Statistics ->
        Traffic page's two top-level tables (docs/ref/todo/
        statistics-traffic-page-plan.md T-01). sources/destinations reuse
        TopHost's exact shape (percent relative to observedBytes, same as
        `/statistics/traffic`) — the only difference from that endpoint's
        topSources/topDestinations is the row count (up to `limit`, not a
        fixed top 10). RAM-only, never persisted to SQLite.
      properties:
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        observedBytes:
          type: integer
          format: int64
          example: 5400000000
        accuracy:
          type: string
          enum: [estimated, near-exact]
          description: >-
            "near-exact" once the conntrack DESTROY-event watcher is
            augmenting the poll-based accounting; "estimated" while running
            poll-only (same signal as TrafficStatistics.accuracy).
          example: near-exact
        truncated:
          type: boolean
          description: >-
            True when the underlying bucket ring hit one of its per-bucket
            tracking caps (traffic-stats-max-hosts / -max-dests /
            -max-conversations) during this window — the ranking below may be
            incomplete.
        limit:
          type: integer
          description: The effective row cap actually applied to each list below.
          example: 100
        sources:
          type: array
          items:
            $ref: '#/components/schemas/TopHost'
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/TopHost'
        series:
          type: array
          description: >-
            Bandwidth-over-time chart data for the WHOLE network, in the
            SAME convention as TrafficStatistics.series above (docs/ref/todo/
            statistics-traffic-bandwidth-chart-plan.md T-01/T-02): direction
            is LAN-relative (bytesUp = leaving the LAN, bytesDown = entering
            the LAN), fixed length equal to the window's 5-minute bucket count
            (3/6/12/36/72/144/288 for window=15m/30m/1h/3h/6h/12h/24h),
            sorted oldest -> newest, and sum(series[].bytes) always equals
            observedBytes exactly. This is the identical series
            TrafficStatistics.series would show for the same window — reused
            here so the Traffic page's bandwidth chart never needs a second
            request.
          items:
            $ref: '#/components/schemas/BandwidthPoint'
        generatedAt:
          type: string
          format: date-time
        rateSampledAt:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp the rateBpsUp/rateBpsDown values on
            sources/destinations above were sampled at (docs/ref/todo/
            statistics-traffic-speed-plan.md) — absent/empty when no rate
            sample exists yet (e.g. right after backend startup, before the
            first poll tick has rotated).

    TrafficHostConversation:
      type: object
      required: [srcIp, srcHostname, dstIp, dstHostname, proto, dstPort, bytes, percent, bytesUp, bytesDown, dstDomain, direction, peerDomain]
      description: >-
        One drill-down row of TrafficHostDetail — TopConversation's fields
        plus two fields that only make sense once a conversation is viewed
        "from" a particular IP (docs/ref/todo/statistics-traffic-page-plan.md
        T-01). bytesUp/bytesDown stay flow-relative (srcIp -> dstIp / dstIp ->
        srcIp) exactly like TopConversation — direction is the ONLY
        IP-relative field, never re-derive up/down from it.
      properties:
        srcIp:
          type: string
          example: 192.168.1.101
        srcHostname:
          type: string
          example: iPhone-13
        dstIp:
          type: string
          example: 142.250.80.46
        dstHostname:
          type: string
          example: 142.250.80.46
        proto:
          type: string
          description: '"TCP"/"UDP"/"ICMP", or "IP:<n>" for anything else.'
          example: TCP
        dstPort:
          type: integer
          example: 443
        bytes:
          type: integer
          format: int64
          example: 9000000
        percent:
          type: number
          format: float
          description: >-
            Share of TrafficHostDetail.totalBytes (the drilled IP's OWN
            total across both directions) — NOT observedBytes, a different
            denominator than TopHost.percent/TopConversation.percent.
          example: 62.4
        bytesUp:
          type: integer
          format: int64
          description: >-
            Bytes sent srcIp -> dstIp (the flow's orig direction). bytesUp +
            bytesDown always equals bytes.
          example: 900000
        bytesDown:
          type: integer
          format: int64
          description: Bytes sent dstIp -> srcIp (the flow's reply direction).
          example: 8100000
        dstDomain:
          type: string
          description: Same display-only domain enrichment as TopConversation.dstDomain.
          example: www.youtube.com
        direction:
          type: string
          enum: [outbound, inbound]
          description: >-
            "outbound" when the drilled IP is this row's srcIp (it appears in
            asSource), "inbound" when it is the dstIp (it appears in
            asDestination). The ONLY field on this row relative to the
            drilled IP — bytesUp/bytesDown are never flipped based on it.
          example: outbound
        peerDomain:
          type: string
          description: >-
            The reverse-DNS-cache domain of the OTHER side of the
            conversation relative to the drilled IP: equals dstDomain for an
            outbound row, but for an inbound row it is the srcIp's domain
            (which dstDomain cannot express). Display only, empty when
            unknown.
          example: www.youtube.com
        rateBpsUp:
          type: integer
          format: int64
          description: >-
            This conversation's real-time throughput in bits/second (docs/
            ref/todo/statistics-traffic-speed-plan.md), flow-relative in the
            SAME direction convention as bytesUp (srcIp -> dstIp) — same
            averaging/accuracy caveats as TopHost.rateBpsUp. Omitempty,
            absent when no rate sample exists yet for this conversation.
          example: 256000
        rateBpsDown:
          type: integer
          format: int64
          description: >-
            This conversation's real-time throughput in bits/second in the
            reply direction (dstIp -> srcIp) — see rateBpsUp for the shared
            caveats.
          example: 2100000

    TrafficHostDetail:
      type: object
      required: [ip, hostname, mac, domain, private, window, accuracy, truncated, limit, found, totalBytes, totalBytesUp, totalBytesDown, percentOfObserved, observedBytes, asSource, asDestination, series, generatedAt]
      description: >-
        The /statistics/traffic/host response — a single IP's conversations
        in BOTH directions (docs/ref/todo/statistics-traffic-page-plan.md
        T-01/§1.3). RAM-only, never persisted to SQLite, resets on restart —
        this shows per-device browsing behavior, same privacy sensitivity as
        the DNS Statistics drill-downs.
      properties:
        ip:
          type: string
          example: 192.168.1.101
        hostname:
          type: string
          description: DHCP lease/reservation hostname; falls back to the IP itself.
          example: iPhone-13
        mac:
          type: string
          example: '99:88:77:66:55:44'
        domain:
          type: string
          description: This IP's own reverse-DNS-cache domain (same source as TopHost.domain), display only.
          example: www.youtube.com
        private:
          type: boolean
          description: True when ip is RFC1918/link-local/loopback/ULA (a LAN address).
          example: true
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        accuracy:
          type: string
          enum: [estimated, near-exact]
        truncated:
          type: boolean
          description: Same meaning as TrafficTopHosts.truncated.
        limit:
          type: integer
          description: The effective per-list row cap applied to asSource/asDestination independently.
          example: 100
        found:
          type: boolean
          description: >-
            False when ip appears nowhere in the window's buckets — the UI
            should show an explicit "no data" state, not an empty table.
        totalBytes:
          type: integer
          format: int64
          description: >-
            This IP's total across BOTH directions (as source PLUS as
            destination), computed over the FULL conversation set BEFORE the
            limit cut below — never contradicted by a truncated table.
          example: 3200000
        totalBytesUp:
          type: integer
          format: int64
          example: 400000
        totalBytesDown:
          type: integer
          format: int64
          example: 2800000
        percentOfObserved:
          type: number
          format: float
          description: >-
            totalBytes as a percent of observedBytes (the window total) — a
            DIFFERENT denominator than each row's own percent above.
          example: 5.9
        observedBytes:
          type: integer
          format: int64
          example: 5400000000
        asSource:
          type: array
          items:
            $ref: '#/components/schemas/TrafficHostConversation'
          description: >-
            Conversations where ip is the flow's srcIp ("this IP went to
            these destinations"). Never null — an empty result is `[]`.
        asDestination:
          type: array
          items:
            $ref: '#/components/schemas/TrafficHostConversation'
          description: >-
            Conversations where ip is the flow's dstIp ("these hosts came to
            this IP"). Never null — an empty result is `[]`.
        series:
          type: array
          description: >-
            Bandwidth-over-time chart data for THIS IP ONLY (docs/ref/todo/
            statistics-traffic-bandwidth-chart-plan.md T-01/T-02) —
            DIFFERENT from TrafficTopHosts.series/TrafficStatistics.series
            above: those are network-wide and LAN-relative, this is per-IP
            and flow-relative (bytesUp = orig direction, bytesDown = reply
            direction — the SAME convention as totalBytesUp/totalBytesDown
            and the asSource/asDestination rows above). Invariants:
            sum(series[].bytes) == totalBytes, sum(series[].bytesUp) ==
            totalBytesUp, sum(series[].bytesDown) == totalBytesDown, always
            exactly (computed from the same conversation data totalBytes is
            summed from). Fixed length equal to the window's 5-minute bucket
            count (3/6/12/36/72/144/288 for window=15m/30m/1h/3h/6h/12h/24h)
            always, even when found=false — a zero-filled array, never null.
          items:
            $ref: '#/components/schemas/BandwidthPoint'
        generatedAt:
          type: string
          format: date-time
        currentRateBpsUp:
          type: integer
          format: int64
          description: >-
            This IP's real-time throughput in bits/second (docs/ref/todo/
            statistics-traffic-speed-plan.md), an AVERAGE over the most
            recent conntrack poll window (~10 seconds), not an instantaneous
            value, and only as accurate as accuracy above. Direction is
            flow-relative (up = orig direction), the same convention as
            totalBytesUp/totalBytesDown. Absent/zero when found is false or
            no rate sample exists yet.
          example: 512000
        currentRateBpsDown:
          type: integer
          format: int64
          description: >-
            This IP's real-time throughput in bits/second in the reply
            direction — see currentRateBpsUp for the shared caveats.
          example: 4300000
        rateSampledAt:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp currentRateBpsUp/currentRateBpsDown above
            were sampled at — same field as TrafficTopHosts.rateSampledAt,
            absent/empty when no rate sample exists yet.

    IPInfoLookup:
      type: object
      required: [ip]
      description: >-
        The /statistics/ipinfo response (docs/ref/todo/
        statistics-host-ipinfo-plan.md). Every field except `ip` is optional
        — deliberately provider-agnostic: the current provider (ipinfo.io, no
        API token) does not guarantee any of them will be present, and a
        future provider swap (paid tier, or an offline MaxMind GeoLite2
        database) may return a different subset. RAM-only, never persisted to
        SQLite.
      properties:
        ip:
          type: string
          example: 8.8.8.8
        hostname:
          type: string
          example: dns.google
        city:
          type: string
          example: Mountain View
        region:
          type: string
          example: California
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code, as returned by the provider.
          example: US
        countryName:
          type: string
          description: Full country name, when the provider returns one (not guaranteed).
          example: United States
        org:
          type: string
          description: The provider's combined ASN + organization name string, verbatim.
          example: 'AS15169 Google LLC'
        asn:
          type: string
          description: Autonomous System Number, parsed out of `org` when possible.
          example: AS15169
        asName:
          type: string
          example: Google LLC
        timezone:
          type: string
          example: America/Los_Angeles
        loc:
          type: string
          description: '"latitude,longitude" as returned by the provider.'
          example: '37.4056,-122.0775'
        source:
          type: string
          enum: [cache, live]
          description: >-
            "cache" when served from the gateway's in-memory cache without an
            outbound request this call; "live" when a fresh ipinfo.io lookup
            was just performed.
        cachedAt:
          type: string
          format: date-time
          description: When this entry was stored in the cache.

    DNSClientStat:
      type: object
      required: [ip, hostname, domain, count, percent, domains, bytes, bytesUp, bytesDown, bytesPercent]
      description: >-
        One ranked row for the "Top Clients" table on the DNS Query
        Statistics tab (docs/ref/todo/dns-query-statistics-drilldown-plan.md),
        extended with a distinct-domain count and an APPROXIMATE byte volume
        by docs/ref/todo/statistics-dns-page-revamp-plan.md T-01/T-04 — one
        row per source IP (or the reserved "unknown" bucket) that issued DNS
        queries. RAM-only, display-only.
      properties:
        ip:
          type: string
          description: >-
            Source IP that issued the query, or the reserved literal
            "unknown" when the source IP could not be parsed.
          example: 192.168.1.101
        hostname:
          type: string
          description: >-
            DHCP lease/reservation hostname; falls back to this row's own ip
            when there is no matching lease/reservation, NOT an empty
            string.
          example: laptop-living-room
        domain:
          type: string
          description: >-
            The domain name dnsmasq most recently answered for ip, from the
            SAME reverse cache TopHost.domain above uses
            (docs/ref/todo/statistics-dns-host-domain-label-plan.md T-04) —
            display only, empty when unknown/expired. NEVER used for
            firewall/policy/routing/QoS decisions — the cache can be
            poisoned by any LAN client simply querying a name it controls.
            Usually empty for the rows in this table: the reverse cache is
            keyed by DNS ANSWER ips (mostly Internet destinations), while
            these rows are LAN client (source) ips — a value only appears
            when a DNS answer happens to point back at a LAN ip (e.g. a
            local zone like nas.home.lan -> 192.168.1.50).
          example: nas.home.lan
        count:
          type: integer
          format: int64
          example: 340
        percent:
          type: number
          format: float
          description: >-
            Share of the enclosing response's totalQueries (QUERY COUNT, not
            bytes) — see that response's schema for which totalQueries this
            is relative to. Never confuse with bytesPercent below.
          example: 41.2
        domains:
          type: integer
          description: >-
            Number of distinct domains this client queried in the window,
            system-wide — NOT scoped to the parent response's own domain/
            client focus (docs/ref/todo/statistics-dns-review-fixes-plan.md
            T-06): in a domain drill-down's per-client row this is the count
            across every domain that client asked in the window, not just
            this one (which would trivially always be 1) — same
            system-wide-not-drill-down-scoped convention as
            DNSDomainStat.clients below.
          example: 12
        bytes:
          type: integer
          format: int64
          description: >-
            APPROXIMATE byte volume, computed by joining conntrack-derived
            traffic data by IP — never a per-query byte count. Meaning
            depends on the parent response: for DNSQueryStatistics.topClients
            this is the client's TOTAL observed bytes across ALL
            destinations in the window (not limited to DNS-resolved
            traffic); for DNSDomainDrilldown.clients it is ONLY the bytes
            exchanged between this client and the drilled domain's known
            IPs (a strict subset of the total). bytesUp + bytesDown ==
            bytes always.
          example: 15400000
        bytesUp:
          type: integer
          format: int64
          description: >-
            Upload share of bytes, flow-relative (orig direction, i.e.
            client -> server) — same convention as TopHost.bytesUp.
          example: 2200000
        bytesDown:
          type: integer
          format: int64
          description: Download share of bytes, flow-relative (reply direction).
          example: 13200000
        bytesPercent:
          type: number
          format: float
          description: >-
            bytes as a percent of BYTES (never query count) — a separate "%
            Vol" figure from percent's "% Query" above; the denominator is
            specified on the parent response's schema.
          example: 8.4

    DNSDomainStat:
      type: object
      required: [domain, queryType, count, percent, clients, ipCount, sharedIps, bytes, bytesUp, bytesDown, bytesPercent, blocked, blockedRule, blockedMode]
      description: >-
        One row of the domain-centric tables on the Statistics -> DNS page
        (docs/ref/todo/statistics-dns-page-revamp-plan.md T-01) — the same
        fields as TopDomain (domain/queryType/count/percent) plus
        client-count and APPROXIMATE byte-volume fields joined in from
        TrafficStatsService by IP. Used ONLY by the 3 DNS statistics
        endpoints below (/statistics/dns, /statistics/dns/domain,
        /statistics/dns/client) — never by /statistics/traffic, whose
        topDomains stays the plain TopDomain shape, byte-for-byte unchanged.
      properties:
        domain:
          type: string
          example: www.youtube.com
        queryType:
          type: string
          description: DNS record type of the most recently seen query for this domain.
          example: A
        count:
          type: integer
          format: int64
          example: 128
        percent:
          type: number
          format: float
          description: Share of QUERY COUNT (never bytesPercent's byte share).
          example: 22.5
        clients:
          type: integer
          description: >-
            Number of distinct client IPs that queried this domain in the
            window.
          example: 6
        ipCount:
          type: integer
          description: >-
            Number of IPs currently known for this domain in the RAM-only
            domain->IP forward index — may be 0 when the domain was queried
            but no matching DNS answer was ever observed/kept (e.g. the
            answer's TTL expired, or the index was capped).
          example: 3
        sharedIps:
          type: boolean
          description: >-
            True when at least one of this domain's known IPs is also
            referenced by another domain (e.g. a CDN/cloud load balancer) —
            a caution flag: bytes below double-counts that IP's traffic
            against every domain that shares it.
          example: false
        bytes:
          type: integer
          format: int64
          description: >-
            APPROXIMATE traffic volume for this domain, computed by summing
            the conntrack-derived byte counters of the IPs this domain was
            last resolved to — NOT a true per-domain packet count (the
            kernel has no notion of "domain" at the packet level). Traffic
            to an IP reached without going through this device's DNS
            resolver is never counted here. bytesUp + bytesDown == bytes
            always.
          example: 48200000
        bytesUp:
          type: integer
          format: int64
          description: Upload share, flow-relative (orig = client -> server).
          example: 3100000
        bytesDown:
          type: integer
          format: int64
          description: Download share, flow-relative (reply direction).
          example: 45100000
        bytesPercent:
          type: number
          format: float
          description: >-
            bytes as a percent of BYTES (never query count) — the
            denominator is specified on the parent response's schema (e.g.
            DNSQueryStatistics.domainBytes). Always labelled "% Vol"
            separately from percent's "% Query" in the UI.
          example: 61.7
        blocked:
          type: boolean
          description: >-
            docs/ref/todo/dns-blocked-query-statistics-plan.md T-04/T-11:
            true when this domain matched an ENABLED deny-list entry that had
            actually been applied to dnsmasq at the moment it was queried
            (RECORD-TIME classification — never re-evaluated against the
            CURRENT deny-list). A blocked domain is still counted in count/
            percent above (never subtracted). Always false when DNS query
            logging is disabled or no deny-list entry ever matched.
          example: false
        blockedRule:
          type: string
          description: >-
            The deny-list entry that matched at record time — may be a
            PARENT of domain above (e.g. domain "ads.example.com" matched
            via the "example.com" rule, mirroring dnsmasq's own
            address=/domain/ subdomain semantics). Empty when blocked is
            false.
          example: ""
        blockedMode:
          type: string
          enum: [nxdomain, sinkhole, ""]
          description: >-
            The deny-list rule's mode as recorded at query time (NOT
            necessarily its CURRENT mode if it was edited afterwards). Empty
            when blocked is false.
          example: ""

    DNSDomainIP:
      type: object
      required: [ip, bytes, bytesUp, bytesDown, bytesPercent, shared, lastSeen]
      description: >-
        One row of the "Resolved IPs" table on a domain's drill-down page
        (docs/ref/todo/statistics-dns-page-revamp-plan.md T-01) — an IP a
        domain was seen resolving to, ranked by APPROXIMATE volume. RAM-only,
        sourced from the same forward index as DNSDomainStat.ipCount/
        sharedIps. The domain->IP mapping backing this row is display-only
        and MUST NEVER be used to drive firewall rule generation, policy
        matching, routing, or QoS decisions — it can be poisoned by any LAN
        client's DNS queries.
      properties:
        ip:
          type: string
          example: 142.250.199.14
        bytes:
          type: integer
          format: int64
          description: >-
            This IP's conntrack-derived byte counters within the window —
            real per-IP data, but attributing it to "this domain" assumes
            the resolution is still current. bytesUp + bytesDown == bytes.
          example: 20500000
        bytesUp:
          type: integer
          format: int64
          example: 1400000
        bytesDown:
          type: integer
          format: int64
          example: 19100000
        bytesPercent:
          type: number
          format: float
          description: >-
            bytes as a percent of the PARENT domain's totalBytes
            (DNSDomainDrilldown.totalBytes) — a different denominator than
            DNSDomainStat.bytesPercent above (which is window-wide
            domainBytes).
          example: 42.5
        shared:
          type: boolean
          description: >-
            True when this IP is also referenced by another domain in the
            forward index (e.g. a CDN/cloud load balancer) — same meaning as
            DNSDomainStat.sharedIps but scoped to this one IP row.
          example: true
        lastSeen:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp of the most recent DNS answer that
            resolved this domain to this IP — NOT tied to the stats window;
            it can be older than the window if the answer hasn't been
            refreshed.
          example: '2026-08-04T10:12:00Z'

    DNSIPDomain:
      description: >-
        One row of the /statistics/dns/ip response (docs/ref/todo/
        statistics-dns-ip-filter-plan.md T-02) — a domain that has ever
        resolved to the IP being looked up. Same fields as DNSDomainStat
        (count/percent are window-scoped for THIS domain; clients/ipCount/
        sharedIps are this domain's system-wide values; bytes/bytesUp/
        bytesDown are this domain's TOTAL volume across ALL of its known IPs,
        not just the one being looked up) plus lastSeen. bytesPercent here is
        bytes as a percent of DNSIPDomains.matchedBytes (the sum across every
        row of this response) — deliberately NOT the window-wide domainBytes
        used by the other DNS statistics endpoints, because computing that
        denominator would mean joining every domain in the window without
        helping answer "what domains use this IP"; the UI must label this
        clearly as scoped to the matched domain group, not the whole window.
        A domain can appear here with count=0/percent=0 when the forward
        index still remembers the domain->IP mapping but the domain had no
        query in this time window — that row is still the correct answer to
        "what domain is this IP for" and is never dropped.
      allOf:
        - $ref: '#/components/schemas/DNSDomainStat'
        - type: object
          required: [lastSeen]
          properties:
            lastSeen:
              type: string
              format: date-time
              description: >-
                RFC3339 UTC timestamp of the most recent DNS answer that
                resolved this domain to the IP being looked up — NOT tied to
                the stats window (same convention as DNSDomainIP.lastSeen).
                The domain<->IP mapping backing this row is display-only and
                MUST NEVER be used to drive firewall rule generation, policy
                matching, routing, or QoS decisions.
              example: '2026-08-04T10:12:00Z'

    DNSIPDomains:
      type: object
      required:
        - ip
        - window
        - enabled
        - hostname
        - totalQueries
        - truncated
        - ipsTruncated
        - domains
        - domainCount
        - shared
        - matchedBytes
        - matchedBytesUp
        - matchedBytesDown
        - ipBytes
        - ipBytesUp
        - ipBytesDown
        - series
        - observedBytes
        - accuracy
        - generatedAt
      description: >-
        The /statistics/dns/ip response — every domain the RAM-only reverse
        index (service/dns_domain_ips.go's DomainsForIP) knows to have
        resolved to `ip`, answering "this IP shows up under more than one
        domain — which ones?" (docs/ref/todo/statistics-dns-ip-filter-plan.md
        §0/§2). Same RAM-only, display-only, opt-in data source as
        /statistics/dns — never persisted to SQLite, resets on restart. The
        domain<->IP mapping backing this response is derived from dnsmasq's
        answer log, which any LAN client can influence by simply querying
        attacker-controlled domains: it MUST NEVER be used to drive firewall
        rule generation, policy matching, routing, or QoS decisions. No
        sort-key input is accepted — sorting is done entirely in the browser.
      properties:
        ip:
          type: string
          description: >-
            Canonical (net/netip-normalized) form of the address that was
            looked up — never the raw client-supplied string.
          example: 64.233.166.127
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        enabled:
          type: boolean
          description: Mirrors DNSServerSettings.queryLogging.
        hostname:
          type: string
          description: >-
            Resolved from a DHCP lease/reservation for ip — display only,
            falls back to ip itself when unknown.
          example: 64.233.166.127
        totalQueries:
          type: integer
          format: int64
          description: >-
            Total DNS queries observed in this window across ALL domains
            (not just the ones matching this IP) — the denominator for each
            domains[] row's percent, identical meaning to
            DNSQueryStatistics.totalQueries.
        truncated:
          type: boolean
          description: >-
            True when the window's query-count ring hit one of its
            per-bucket tracking caps while computing count/percent for the
            rows below — same signal as DNSDomainDrilldown.truncated.
        ipsTruncated:
          type: boolean
          description: >-
            True when EITHER (a) the domain->IP forward index rejected a
            brand-new domain because dns-stats-max-domains was hit within the
            last TTL window (index-wide — the same signal as
            DNSQueryStatistics.domainIndexTruncated), OR (b) at least one of
            the domains actually returned in domains below currently holds
            dns-stats-max-ips-per-domain or more IPs (scoped to this result's
            own rows, computed fresh on every read — not a sticky index-wide
            latch). Either way it means domains below may be missing some
            domain<->IP associations for at least one of the rows shown.
        domains:
          type: array
          description: >-
            Every domain known to have resolved to ip, sorted by bytes desc,
            then count desc, then domain asc. Never null — an empty array
            means no domain in the RAM-only index currently maps to this IP
            (it may have expired past its TTL, or traffic to it never went
            through this device's DNS resolver).
          items:
            $ref: '#/components/schemas/DNSIPDomain'
        domainCount:
          type: integer
          description: len(domains), echoed for convenience.
          example: 2
        shared:
          type: boolean
          description: >-
            True when domainCount > 1 — this IP is used by more than one
            domain (e.g. a CDN or shared hosting IP), so each domain's bytes
            below double-counts the same underlying traffic to this IP.
          example: true
        matchedBytes:
          type: integer
          format: int64
          description: >-
            Sum of domains[].bytes across every row of this response — the
            denominator for each row's bytesPercent (see DNSIPDomain's
            description for why this differs from the window-wide
            domainBytes used by the other DNS statistics endpoints).
          example: 20500000
        matchedBytesUp:
          type: integer
          format: int64
          example: 1400000
        matchedBytesDown:
          type: integer
          format: int64
          example: 19100000
        ipBytes:
          type: integer
          format: int64
          description: >-
            Conntrack-derived byte counters for the IP being looked up
            itself (not summed across domains) — the same per-destination
            totals TrafficHostDetail would report for this IP.
          example: 20500000
        ipBytesUp:
          type: integer
          format: int64
          example: 1400000
        ipBytesDown:
          type: integer
          format: int64
          example: 19100000
        series:
          type: array
          description: >-
            This IP's traffic over time — flow-relative (orig = up, reply =
            down), fixed length equal to the window's bucket count,
            zero-filled (never null). sum(series[].bytes) == ipBytes.
          items:
            $ref: '#/components/schemas/BandwidthPoint'
        observedBytes:
          type: integer
          format: int64
        accuracy:
          type: string
          enum: [estimated, near-exact]
        generatedAt:
          type: string
          format: date-time

    ReferenceDomainRef:
      type: object
      required: [domain]
      description: >-
        One row of IPReferenceSummary.domains (docs/ref/todo/
        reference-popover-plan.md). Its meaning changes with the parent
        response's scope: when scope=="public", domain resolved to the IP at
        least once (lastSeen is set, count is 0); when scope=="lan", domain
        is one this client (the IP) queried in the fixed 1h window (count is
        its query count, lastSeen is empty).
      properties:
        domain:
          type: string
          example: example.com
        lastSeen:
          type: string
          format: date-time
          description: Only populated when the parent scope=="public".
        count:
          type: integer
          format: int64
          description: Only populated when the parent scope=="lan".

    IPReferenceSummary:
      type: object
      required:
        - ip
        - hostname
        - mac
        - scope
        - enabled
        - found
        - domains
        - domainCount
        - bytes
        - bytesUp
        - bytesDown
        - window
        - generatedAt
      description: >-
        The /statistics/reference/ip response — a lightweight hover-popover
        summary of a single IP (docs/ref/todo/reference-popover-plan.md),
        reusing the exact same RAM-only indices DNSIPDomains/
        GetDNSClientDomains already read, without any traffic series or
        per-client join. Same RAM-only, display-only data source as
        /statistics/dns/ip: MUST NEVER be used to drive firewall rule
        generation, policy matching, routing, or QoS decisions.
      properties:
        ip:
          type: string
          description: >-
            Canonical (net/netip-normalized) form of the address that was
            looked up — never the raw client-supplied string.
          example: 142.250.199.14
        hostname:
          type: string
          description: >-
            Resolved from a DHCP lease/reservation for ip — display only,
            empty when unknown (never falls back to echoing ip itself).
        mac:
          type: string
          description: >-
            DHCP lease's MAC address for ip, when known — empty otherwise.
            Display only.
        scope:
          type: string
          enum: [public, lan]
          description: >-
            Decided EXCLUSIVELY by the server via isGloballyRoutable() — a
            security boundary, never accepted from or overridable by the
            client. The frontend must only call /statistics/ipinfo for this
            ip when scope=="public".
        enabled:
          type: boolean
          description: >-
            Mirrors DNSServerSettings.queryLogging. false means DNS query
            logging is off: domains is an empty array and domainCount is 0 —
            not an error, the UI should show a muted notice rather than
            treating this as a failure.
        found:
          type: boolean
          description: >-
            True when this IP has ANY reference data at all (a resolved
            hostname, at least one related domain, or observed traffic) — a
            hint for the UI to render a minimal "no data yet" state. Never
            used to gate a 404; this endpoint always returns 200 for a
            syntactically valid ip.
        domains:
          type: array
          description: >-
            Capped at the request's limit (default 3, max 10) — never null.
            See ReferenceDomainRef's description for how its shape depends
            on scope.
          items:
            $ref: '#/components/schemas/ReferenceDomainRef'
        domainCount:
          type: integer
          description: >-
            TRUE total count of matching domains BEFORE the limit was
            applied, so the UI can render "+N more" correctly.
          example: 5
        bytes:
          type: integer
          format: int64
          description: >-
            This IP's observed traffic volume in the fixed 1h window —
            Dests[ip] when scope=="public", Hosts[ip] when scope=="lan"
            (same conntrack-derived join every other statistics endpoint
            uses). Zero when there was no observed traffic — not an error.
          example: 20500000
        bytesUp:
          type: integer
          format: int64
          example: 1400000
        bytesDown:
          type: integer
          format: int64
          example: 19100000
        window:
          type: string
          enum: [1h]
          description: >-
            Always "1h" — this endpoint does not accept a window query
            parameter; echoed back purely so the UI can render a label
            without hardcoding the string itself.
        generatedAt:
          type: string
          format: date-time

    ReferenceIPRef:
      type: object
      required: [ip, lastSeen, shared]
      description: One row of DomainReferenceSummary.ips.
      properties:
        ip:
          type: string
          example: 93.184.216.34
        lastSeen:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp of the most recent DNS answer that
            resolved this domain to this IP.
        shared:
          type: boolean
          description: >-
            True when this IP is currently also known to resolve for at
            least one other domain.

    DomainReferenceSummary:
      type: object
      required:
        - domain
        - enabled
        - found
        - ips
        - ipCount
        - queryCount
        - clients
        - sharedIPs
        - ipsTruncated
        - bytes
        - bytesUp
        - bytesDown
        - window
        - generatedAt
      description: >-
        The /statistics/reference/domain response — a lightweight
        hover-popover summary of a single domain (docs/ref/todo/
        reference-popover-plan.md), reusing dns_domain_ips.go's IPsFor (the
        same forward index DNSDomainDrilldown reads) without any traffic
        series or per-client join. Same RAM-only, display-only data source as
        /statistics/dns/domain: MUST NEVER be used to drive firewall rule
        generation, policy matching, routing, or QoS decisions.
      properties:
        domain:
          type: string
          description: >-
            Normalized (model.NormalizeQueryDomain) form of the domain that
            was looked up — never the raw client-supplied string.
          example: example.com
        enabled:
          type: boolean
          description: >-
            Mirrors DNSServerSettings.queryLogging. false means ips is an
            empty array and ipCount/queryCount/clients are 0 — not an error.
        found:
          type: boolean
          description: >-
            True when this domain has ANY reference data at all (at least
            one resolved IP, or at least one query) — same non-error
            "no data yet" hint as IPReferenceSummary.found.
        ips:
          type: array
          description: >-
            Resolved IPs, newest-lastSeen-first, capped at the request's
            limit (default 3, max 10) — never null.
          items:
            $ref: '#/components/schemas/ReferenceIPRef'
        ipCount:
          type: integer
          description: >-
            TRUE total count of resolved IPs BEFORE the limit was applied.
          example: 4
        queryCount:
          type: integer
          format: int64
          description: This domain's total query count in the fixed 1h window.
        clients:
          type: integer
          description: >-
            Distinct count of client IPs that queried this domain in the
            window.
        sharedIPs:
          type: boolean
          description: >-
            True when at least one of the domain's resolved IPs (across the
            FULL set, before the limit) is also known to resolve for another
            domain — same CDN/shared-hosting warning signal as
            DNSDomainDrilldown.sharedIPs.
        ipsTruncated:
          type: boolean
          description: >-
            True when this domain's own resolved-IP set is at (or over) the
            configured dns-stats-max-ips-per-domain cap.
        bytes:
          type: integer
          format: int64
          description: >-
            This domain's total observed traffic volume (join of ALL of the
            domain's known resolved IPs, not just the limited ips above) in
            the fixed 1h window.
          example: 20500000
        bytesUp:
          type: integer
          format: int64
          example: 1400000
        bytesDown:
          type: integer
          format: int64
          example: 19100000
        window:
          type: string
          enum: [1h]
        generatedAt:
          type: string
          format: date-time

    DNSQueryStatistics:
      type: object
      required:
        - window
        - enabled
        - totalQueries
        - querySeries
        - truncated
        - domainIndexTruncated
        - topDomains
        - topClients
        - observedBytes
        - domainBytes
        - totalDomains
        - totalClients
        - accuracy
        - generatedAt
        - blockedQueries
        - blockedPercent
        - blockedSeries
        - blockedTruncated
        - totalBlockedDomains
        - totalBlockedClients
        - topBlockedDomains
        - topBlockedClients
      description: >-
        The /statistics/dns response backing the Statistics -> DNS page's two
        top-level tables (Top Domains / Top Clients). **RAM-only,
        display-only**: sourced from an in-memory (domain, client) ring
        joined against TrafficStatsService's conntrack-derived byte counters
        by IP, never persisted to SQLite — a pigate restart resets all counts
        to zero. Opt-in via `dns/settings.queryLogging`; all fields are
        zero-valued (empty arrays / false / 0) rather than omitted when
        disabled, so a client never has to special-case absence. There is no
        sort-key input accepted from the client — sorting of topDomains/
        topClients is done entirely client-side in the browser.
      properties:
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        enabled:
          type: boolean
          description: Mirrors DNSServerSettings.queryLogging.
        totalQueries:
          type: integer
          format: int64
          description: >-
            Total DNS queries observed in this window — the denominator for
            both topDomains and topClients percent (query-count) figures.
        querySeries:
          type: array
          description: >-
            DNS-query-count-over-time bar chart series backing the Statistics
            -> DNS overview page (docs/ref/todo/
            statistics-dns-query-bar-chart-plan.md T-02/T-03): one
            DNSQueryPoint per raw 5-minute bucket. Fixed length equal to the
            number of 5-minute buckets the window covers (3/6/12/36/72/144/288
            for 15m/30m/1h/3h/6h/12h/24h respectively), zero-filled — never
            null. Sorted oldest -> newest; the last point is the current,
            still-open bucket (its count keeps climbing until the bucket
            closes). Invariant: sum(querySeries[].count) == totalQueries
            always holds, using the same carry rule as
            TrafficStatistics.series. Empty array (not omitted) when
            enabled=false.
          items:
            $ref: '#/components/schemas/DNSQueryPoint'
        truncated:
          type: boolean
          description: >-
            True only when data was actually dropped: the domain×client
            pair ring or the per-bucket client tracking cap was hit during
            this window. Deliberately does NOT fire just because
            totalDomains/totalClients exceeds the top-50 table size — that
            is normal, fully-and-accurately-tracked data that simply doesn't
            all fit in the table. As of docs/ref/todo/
            statistics-dns-cap-notification-fix-plan.md §3.3, this field no
            longer reflects the domain->IP forward index's own cap
            (dns-stats-max-domains) — see domainIndexTruncated below for that,
            a deliberately separate signal.
        domainIndexTruncated:
          type: boolean
          description: >-
            True when the RAM-only domain->IP forward index
            (service/dns_domain_ips.go) rejected a brand-new domain because
            it was already at dns-stats-max-domains, within the last TTL
            window (self-clears once a full TTL has passed with no further
            rejection, or immediately after the cap is raised — it does NOT
            latch forever). Completely separate from truncated above:
            truncated is about the (domain,client) pair ring;
            domainIndexTruncated is about the domain->IP index hitting its
            DOMAIN count cap specifically — it says nothing about any single
            domain's resolved-IP list being incomplete (see
            DNSDomainDrilldown.ipsTruncated for that, which is per-domain).
        topDomains:
          type: array
          description: >-
            Domain-centric overview table (plan §2.2) — []DNSDomainStat, an
            ADDITIVE JSON shape scoped to this endpoint only; NOT the same
            schema as TrafficStatistics.topDomains, which stays TopDomain
            unchanged.
          items:
            $ref: '#/components/schemas/DNSDomainStat'
        topClients:
          type: array
          items:
            $ref: '#/components/schemas/DNSClientStat'
        observedBytes:
          type: integer
          format: int64
          description: >-
            The SAME network-wide conntrack-observed byte total as
            TrafficStatistics.observedBytes for this window — included so
            the UI can show "% of all traffic" as a second, clearly labelled
            denominator distinct from domainBytes below.
          example: 512000000
        domainBytes:
          type: integer
          format: int64
          description: >-
            Sum of bytes across all rows of topDomains — i.e. only the
            portion of observedBytes that could be attributed to a known
            domain via the domain->IP join (direct-IP traffic with no DNS
            lookup is never counted here). This is the denominator used for
            each topDomains row's bytesPercent.
          example: 210500000
        totalDomains:
          type: integer
          description: >-
            Number of distinct domains observed in the window (before any
            per-response row limit is applied), so the UI can show "showing
            N of M" even when topDomains is capped.
          example: 143
        totalClients:
          type: integer
          description: Same as totalDomains but for distinct client IPs.
          example: 18
        accuracy:
          type: string
          enum: [estimated, near-exact]
          description: >-
            Mirrors TrafficStatistics.accuracy — the same
            conntrack-poll-vs-DESTROY-event signal, since bytes above is
            derived from the same traffic breakdown.
        generatedAt:
          type: string
          format: date-time
        blockedQueries:
          type: integer
          format: int64
          description: >-
            docs/ref/todo/dns-blocked-query-statistics-plan.md: total number
            of queries classified as "blocked" (RECORD-TIME match against the
            deny-list actually applied to dnsmasq — see
            DNSDomainStat.blocked). Uncapped by any ring limit (same
            unconditional-increment contract as totalQueries) and already
            INCLUDED in totalQueries above, never subtracted from it. Can be
            LARGER than the sum of topBlockedDomains[].count once the
            underlying ring is full — see blockedTruncated below, which
            signals exactly that case rather than the two numbers silently
            disagreeing.
          example: 342
        blockedPercent:
          type: number
          format: float
          description: blockedQueries as a percent of totalQueries.
          example: 4.2
        blockedSeries:
          type: array
          description: >-
            Same shape/axis as querySeries above, but counting only blocked
            queries. Invariant: sum(blockedSeries[].count) == blockedQueries
            always holds. Empty array (not omitted) when enabled=false.
          items:
            $ref: '#/components/schemas/DNSQueryPoint'
        blockedTruncated:
          type: boolean
          description: >-
            True when the (domain,client) pair ring hit dns-stats-max-pairs,
            OR the per-bucket blocked-domain tracking hit
            dns-stats-max-blocked-domains, during this window — meaning
            topBlockedDomains/topBlockedClients below may under-report
            relative to the always-accurate blockedQueries total. A SEPARATE
            signal from truncated above (which does not require any query to
            have been blocked at all).
        totalBlockedDomains:
          type: integer
          description: >-
            Number of distinct blocked domains observed in the window (before
            the row cap on topBlockedDomains is applied) — same "showing N of
            M" convention as totalDomains above.
          example: 12
        totalBlockedClients:
          type: integer
          description: Same as totalBlockedDomains but for distinct client IPs.
          example: 5
        topBlockedDomains:
          type: array
          description: >-
            The "Blocked Query" sub-tab's per-domain table, ranked by blocked
            query count, capped at the same row limit as topDomains. Never
            null — empty array when enabled=false or no query was ever
            classified as blocked in the window.
          items:
            $ref: '#/components/schemas/DNSBlockedDomainStat'
        topBlockedClients:
          type: array
          description: >-
            The "Blocked Query" sub-tab's per-client table, ranked by blocked
            query count.
          items:
            $ref: '#/components/schemas/DNSBlockedClientStat'

    DNSBlockedDomainStat:
      type: object
      required: [domain, rule, mode, count, percent, clients]
      description: >-
        docs/ref/todo/dns-blocked-query-statistics-plan.md T-04: one row of
        the "Top Blocked Domains" table on the DNS Query Statistics tab's
        "Blocked Query" sub-tab — ranked by blocked query count. Unlike
        DNSDomainStat, deliberately has NO bytes/bytesUp/bytesDown/
        bytesPercent column: a blocked domain is answered NXDOMAIN or a
        sinkhole address by dnsmasq, so it carries essentially no real
        traffic volume worth joining against conntrack.
      properties:
        domain:
          type: string
          example: ads.example.com
        rule:
          type: string
          description: >-
            The deny-list entry that matched this domain at record time — may
            be a PARENT of domain (e.g. domain "ads.example.com" matched via
            the "example.com" rule).
          example: example.com
        mode:
          type: string
          enum: [nxdomain, sinkhole]
          description: >-
            The rule's mode as recorded at the time this domain was queried —
            NOT necessarily the rule's CURRENT mode if it was edited
            afterwards (record-time classification).
          example: nxdomain
        count:
          type: integer
          format: int64
          example: 87
        percent:
          type: number
          format: float
          description: >-
            count as a percent of DNSQueryStatistics.blockedQueries — a
            DIFFERENT (smaller) denominator than DNSDomainStat.percent, which
            divides by totalQueries.
          example: 25.4
        clients:
          type: integer
          description: >-
            Number of distinct client IPs that issued this blocked query in
            the window.
          example: 3

    DNSBlockedClientStat:
      type: object
      required: [ip, hostname, count, percent, domains]
      description: >-
        docs/ref/todo/dns-blocked-query-statistics-plan.md T-04: one row of
        the "Top Blocked Clients" table on the DNS Query Statistics tab's
        "Blocked Query" sub-tab — ranked by blocked query count, one row per
        client IP that issued at least one blocked query.
      properties:
        ip:
          type: string
          example: 192.168.1.101
        hostname:
          type: string
          description: >-
            Resolved from a DHCP lease/reservation — display only, falls back
            to ip itself when unknown.
          example: laptop-alice
        count:
          type: integer
          format: int64
          example: 61
        percent:
          type: number
          format: float
          description: count as a percent of DNSQueryStatistics.blockedQueries.
          example: 17.8
        domains:
          type: integer
          description: >-
            Number of distinct BLOCKED domains this client queried in the
            window — DIFFERENT from DNSClientStat.domains (which counts ALL
            domains, system-wide, not just blocked ones).
          example: 4

    DNSDomainDrilldown:
      type: object
      required:
        - domain
        - window
        - enabled
        - totalQueries
        - truncated
        - clients
        - ips
        - totalBytes
        - totalBytesUp
        - totalBytesDown
        - sharedIps
        - ipsTruncated
        - series
        - accuracy
        - observedBytes
        - generatedAt
        - blocked
        - blockedRule
        - blockedMode
      description: >-
        The /statistics/dns/domain response — for a single domain, the
        clients that queried it within the window, the IPs it was resolved
        to, and an APPROXIMATE traffic volume/time series joined in by IP.
        **RAM-only, display-only**, same opt-in switch and reset-on-restart
        behavior as DNSQueryStatistics. There is no sort-key input accepted
        from the client — sorting of clients/ips is done entirely
        client-side in the browser.
      properties:
        domain:
          type: string
          description: The normalized domain this drill-down is for (as validated/echoed by the server, not the raw request value).
          example: www.youtube.com
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        enabled:
          type: boolean
          description: Mirrors DNSServerSettings.queryLogging.
        totalQueries:
          type: integer
          format: int64
          description: >-
            Total queries for this domain in this window — the denominator
            for clients[].percent (NOT the window-wide total; a different
            denominator than DNSQueryStatistics.topDomains).
        truncated:
          type: boolean
          description: >-
            True only when data was actually dropped: the domain×client pair
            ring or the per-bucket client tracking cap was hit during this
            window. Deliberately does NOT fire just because
            totalDomains/totalClients exceeds the top-50 table size — that
            is normal, fully-and-accurately-tracked data that simply doesn't
            all fit in the table.
        clients:
          type: array
          description: >-
            Each row's bytes/bytesUp/bytesDown are ONLY the traffic exchanged
            between that client and this domain's known IPs (a
            conversation-level join) — see DNSClientStat.bytes. Each row's
            domains is that client's distinct-domain count system-wide in
            this window (docs/ref/todo/statistics-dns-review-fixes-plan.md
            T-06 — review fix on PR 127), NOT scoped to this domain (which
            would trivially always be 1) — see DNSClientStat.domains.
          items:
            $ref: '#/components/schemas/DNSClientStat'
        ips:
          type: array
          description: >-
            The "Resolved IPs" table for this domain, ranked by APPROXIMATE
            volume (bytes desc, ip asc). Never null (empty array when no IP
            is known for this domain, e.g. the answer expired or was never
            observed).
          items:
            $ref: '#/components/schemas/DNSDomainIP'
        totalBytes:
          type: integer
          format: int64
          description: >-
            Sum of ips[].bytes above — this domain's approximate total
            volume in the window, and the denominator for each ips[] row's
            bytesPercent.
          example: 48200000
        totalBytesUp:
          type: integer
          format: int64
          example: 3100000
        totalBytesDown:
          type: integer
          format: int64
          example: 45100000
        sharedIps:
          type: boolean
          description: >-
            True when at least one row of ips has shared=true — this
            domain's total is inflated by traffic to an IP that other
            domains also resolve to.
          example: false
        ipsTruncated:
          type: boolean
          description: >-
            True when THIS domain's own IP set (ips above) is currently at
            dns-stats-max-ips-per-domain — computed fresh from len(ips) each
            time this endpoint is read, scoped to THIS domain only (never any
            other domain in the index) — a separate truncation signal from
            truncated (which covers the query-count ring), so the UI can
            distinguish "clients list may be incomplete" from "this domain's
            resolved-IP list may be incomplete". A domain with only one known
            IP can never report ipsTruncated=true, regardless of what any
            other domain in the index is doing.
        series:
          type: array
          description: >-
            This domain's approximate volume over time — the sum of dest
            bytes across all of ips[] per 5-minute bucket, flow-relative (up
            = orig direction, down = reply), NOT LAN-relative like
            TrafficStatistics.series. Fixed length equal to the window's
            bucket count, zero-filled (never null). Invariant:
            sum(series[].bytes) == totalBytes.
          items:
            $ref: '#/components/schemas/BandwidthPoint'
        accuracy:
          type: string
          enum: [estimated, near-exact]
          description: >-
            Mirrors TrafficStatistics.accuracy — same signal backing
            totalBytes/series above.
        observedBytes:
          type: integer
          format: int64
          description: >-
            The same network-wide byte total as TrafficStatistics.
            observedBytes for this window, included so the UI can show
            totalBytes as "% of all traffic" alongside the per-IP
            percentages.
          example: 512000000
        generatedAt:
          type: string
          format: date-time
        blocked:
          type: boolean
          description: >-
            docs/ref/todo/dns-blocked-query-statistics-plan.md T-04/T-11:
            this domain's own "Blocked Domain Query" classification — same
            record-time meaning as DNSDomainStat.blocked, i.e. whether THIS
            domain (the one being drilled into) matched an active deny-list
            rule at the moment any of its queries in this window were
            recorded.
          example: false
        blockedRule:
          type: string
          description: Same meaning as DNSDomainStat.blockedRule. Empty when blocked is false.
          example: ""
        blockedMode:
          type: string
          enum: [nxdomain, sinkhole, ""]
          description: Same meaning as DNSDomainStat.blockedMode. Empty when blocked is false.
          example: ""

    DNSClientDrilldown:
      type: object
      required:
        - client
        - hostname
        - window
        - enabled
        - totalQueries
        - truncated
        - domainIndexTruncated
        - domains
        - totalBytes
        - totalBytesUp
        - totalBytesDown
        - series
        - accuracy
        - generatedAt
      description: >-
        The /statistics/dns/client response — for a single client (source
        IP, or the reserved "unknown" bucket), the domains it queried within
        the window plus an APPROXIMATE traffic volume/time series joined in
        by IP. **RAM-only, display-only**, same opt-in switch and
        reset-on-restart behavior as DNSQueryStatistics. There is no
        sort-key input accepted from the client — sorting of domains is done
        entirely client-side in the browser.
      properties:
        client:
          type: string
          description: The client IP (or "unknown") this drill-down is for.
          example: 192.168.1.101
        hostname:
          type: string
          description: DHCP lease/reservation hostname for client; empty when unknown.
          example: laptop-living-room
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        enabled:
          type: boolean
          description: Mirrors DNSServerSettings.queryLogging.
        totalQueries:
          type: integer
          format: int64
          description: >-
            Total queries this client made in this window — the denominator
            for domains[].percent (NOT the window-wide total; a different
            denominator than DNSQueryStatistics.topClients).
        truncated:
          type: boolean
          description: >-
            True only when data was actually dropped: the domain×client pair
            ring or the per-bucket client tracking cap was hit during this
            window. Deliberately does NOT fire just because
            totalDomains/totalClients exceeds the top-50 table size — that
            is normal, fully-and-accurately-tracked data that simply doesn't
            all fit in the table.
        domainIndexTruncated:
          type: boolean
          description: >-
            Mirrors DNSQueryStatistics.domainIndexTruncated — see that
            field's description. Separate from truncated above for the same
            reason.
        domains:
          type: array
          description: >-
            []DNSDomainStat, an ADDITIVE JSON shape scoped to this endpoint.
            Since docs/ref/todo/statistics-dns-review-fixes-plan.md T-04
            (review fix on PR 127): clients = the number of clients,
            system-wide, that queried that domain in this window (NOT just
            this one); ipCount/sharedIps = that domain's known IPs in the
            RAM-only forward index, system-wide — identical meaning to the
            same fields on the overview (/statistics/dns) and domain
            drill-down (/statistics/dns/domain) responses, not scoped to
            client. bytes/bytesUp/bytesDown are still ONLY the bytes
            exchanged between THIS client and that domain's known IPs —
            unlike clients/ipCount/sharedIps, those stay drill-down-scoped.
          items:
            $ref: '#/components/schemas/DNSDomainStat'
        totalBytes:
          type: integer
          format: int64
          description: >-
            This client's total observed bytes across ALL destinations in
            the window — NOT limited to DNS-resolved domains, so it can
            exceed the sum of domains[].bytes. Always 0 for the reserved
            "unknown" client bucket (no IP to join against).
          example: 15400000
        totalBytesUp:
          type: integer
          format: int64
          example: 2200000
        totalBytesDown:
          type: integer
          format: int64
          example: 13200000
        series:
          type: array
          description: >-
            This client's traffic over time, flow-relative (up = orig
            direction, down = reply) — the same TrafficHostDetail.series
            convention. Fixed length equal to the window's bucket count,
            zero-filled (never null) for a known client; empty for the
            "unknown" bucket. Invariant: sum(series[].bytes) == totalBytes.
          items:
            $ref: '#/components/schemas/BandwidthPoint'
        accuracy:
          type: string
          enum: [estimated, near-exact]
          description: >-
            Mirrors TrafficStatistics.accuracy — same signal backing
            totalBytes/series above.
        generatedAt:
          type: string
          format: date-time

    CapacityPoint:
      type: object
      required:
        - ts
        - count
      description: >-
        One point of RingCapacity.series — a fixed 5-minute bucket on the
        same time axis as BandwidthPoint.ts/DNSQueryPoint.ts (docs/ref/todo/
        statistics-capacity-visibility-plan.md T-01). Only meaningful for a
        "bucket"-kind ring.
      properties:
        ts:
          type: string
          format: date-time
          description: RFC3339 start of this 5-minute bucket, device local time.
        count:
          type: integer
          description: >-
            How many distinct keys (hosts/dests/conversations/sources/ports/
            pairs/clients, depending on the ring) were tracked in this
            bucket — NOT a byte count.

    RingCapacity:
      type: object
      required:
        - id
        - group
        - label
        - kind
        - cap
        - capSource
        - current
        - currentPercent
        - peak
        - peakPercent
        - fullBuckets
        - truncated
        - estimatedBytes
        - entryBytes
      description: >-
        One row of CapacityStatistics.rings — current/peak usage of a single
        RAM-only tracking structure against its configured cap (docs/ref/todo/
        statistics-capacity-visibility-plan.md T-01).
      properties:
        id:
          type: string
          description: >-
            Stable machine-readable identifier (e.g. "traffic.hosts",
            "dns.reverseCache") — links a CapacityIndicator pill to its
            section on the /statistics/capacity detail page.
          example: traffic.hosts
        group:
          type: string
          enum: [traffic, dns, firewall]
          description: Which Statistics page(s) this ring is relevant to.
        label:
          type: string
          description: Short human-readable display name.
          example: Top Source Hosts
        kind:
          type: string
          enum: [bucket, flat]
          description: >-
            "bucket" = a 5-minute-bucket ring (series populated when
            requested); "flat" = a single flat map/index with no time
            dimension (series never populated).
        cap:
          type: integer
          description: >-
            The configured maximum this ring/index enforces. For a "bucket"
            ring this is the PER-BUCKET cap, not a whole-ring total.
        capSource:
          type: string
          description: >-
            The config key backing cap (e.g. "traffic-stats-max-hosts"),
            display-only.
          example: traffic-stats-max-hosts
        current:
          type: integer
          description: >-
            Live size right now: most recent bucket's tracked-key count for
            a "bucket" ring, or the current total entry count for a "flat"
            index.
        currentPercent:
          type: number
          format: double
          description: current as a percent of cap (can exceed 100).
        peak:
          type: integer
          description: >-
            Highest tracked-key count seen across the buckets `window`
            covers (bucket ring), or equal to current (flat index).
        peakPercent:
          type: number
          format: double
        fullBuckets:
          type: integer
          description: >-
            How many buckets within `window` had their tracked-key count at
            or above cap at least once. Always 0 for a "flat" index.
        truncated:
          type: boolean
          description: >-
            True once at least one admission has actually been rejected
            because this cap was hit — the SAME after-the-fact signal
            already exposed elsewhere; currentPercent/peakPercent are the
            NEW early-warning signal this endpoint adds. The frontend's
            ringStatus() reads this field FIRST and forces "danger" whenever
            it is true — otherwise a "flat" ring (fullBuckets always 0, no
            bucket dimension) would have no way to ever show red even at
            100% (docs/ref/todo/statistics-dns-cap-notification-fix-plan.md
            §2.3/T-10).
        estimatedBytes:
          type: integer
          format: int64
          description: >-
            APPROXIMATE RAM footprint (entries currently held x entryBytes)
            — NEVER a measured value. For a "bucket" ring this sums entries
            across the WHOLE ring (up to 24h), not just `window`.
        entryBytes:
          type: integer
          description: >-
            Assumed per-entry RAM cost (bytes) used to compute
            estimatedBytes — documented per-ring in
            service/statistics_capacity.go.
        series:
          type: array
          description: >-
            Per-bucket tracked-key count over `window`. Only present when
            the request asked for it (series=1/true) AND kind == "bucket".
          items:
            $ref: '#/components/schemas/CapacityPoint'
        oldestEntry:
          type: string
          format: date-time
          description: >-
            As-stored time string (RFC3339 or RFC3339Nano) of the oldest
            entry still held by this ring — only meaningful for a ring with
            a FIFO time dimension. Currently only set on the
            `firewall.logBuffer` ring (docs/ref/todo/
            firewall-log-buffer-capacity-plan.md, GitHub issue #134); every
            other ring omits this field.

    CapacityStatistics:
      type: object
      required:
        - window
        - bucketCount
        - rings
        - generatedAt
      description: >-
        The GET /statistics/capacity response — current usage vs configured
        cap for all 11 RAM-only tracking structures, always in the same fixed
        order (docs/ref/todo/statistics-capacity-visibility-plan.md T-01,
        GitHub issue #123; the 10th ring, dns.domainIpsPerDomain, was added
        by docs/ref/todo/statistics-dns-cap-notification-fix-plan.md
        §3.4/T-06; the 11th ring, firewall.logBuffer, was added by docs/ref/
        todo/firewall-log-buffer-capacity-plan.md, GitHub issue #134).
        Contains ONLY counts/percentages — no domain name, IP address, or
        hostname ever appears here.
      properties:
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        bucketCount:
          type: integer
          description: >-
            How many 5-minute buckets `window` covers (3/6/12/36/72/144/288).
        rings:
          type: array
          description: >-
            Always exactly 11 entries, in the fixed order: traffic.hosts,
            traffic.dests, traffic.conversations, firewall.denySources,
            firewall.denyPorts, dns.pairs, dns.clients, dns.reverseCache,
            dns.domainIps, dns.domainIpsPerDomain, firewall.logBuffer.
          items:
            $ref: '#/components/schemas/RingCapacity'
        generatedAt:
          type: string
          format: date-time

    FirewallTrendPoint:
      type: object
      description: >-
        One 5-minute bucket of the Firewall Traffic Trend chart (bytes) —
        accept vs drop, sourced from the nft per-rule counter (exact,
        user-rule-only — see FirewallStatistics description).
      required: [ts, acceptedBytes, blockedBytes, acceptedPackets, blockedPackets]
      properties:
        ts:
          type: string
          format: date-time
        acceptedBytes:
          type: integer
          format: uint64
        blockedBytes:
          type: integer
          format: uint64
        acceptedPackets:
          type: integer
          format: uint64
        blockedPackets:
          type: integer
          format: uint64

    FirewallDenyPoint:
      type: object
      description: >-
        One 5-minute bucket of the Blocked Events Trend chart — an NFLOG
        EVENT count (not bytes), a completely different unit/source than
        FirewallTrendPoint.
      required: [ts, events]
      properties:
        ts:
          type: string
          format: date-time
        events:
          type: integer
          format: uint64

    FirewallChainStat:
      type: object
      description: >-
        One row of the Chain Breakdown table — accept vs drop bytes/packets
        for one nftables chain, from the same nft-rule-counter source as
        FirewallTrendPoint. percent is against the sum of
        acceptedBytes+blockedBytes across ALL chains in the response.
      required: [chain, acceptedBytes, blockedBytes, acceptedPackets, blockedPackets, percent]
      properties:
        chain:
          type: string
          enum: [forward, input, output]
        acceptedBytes:
          type: integer
          format: uint64
        blockedBytes:
          type: integer
          format: uint64
        acceptedPackets:
          type: integer
          format: uint64
        blockedPackets:
          type: integer
          format: uint64
        percent:
          type: number
          format: double

    FirewallRuleStatRow:
      type: object
      description: >-
        One row of the Top Rules by Traffic table. Mirrors PolicyRuleStat
        field-for-field for the fields they share, plus it can represent a
        rule id that no longer exists (deleted/renamed mid-window) as a
        "(deleted rule)" row instead of omitting it or erroring.
      required: [ruleId, name, bytes, packets, percent, unused]
      properties:
        ruleId:
          type: string
          example: rule-a1b2
        name:
          type: string
          description: '"(deleted rule)" when ruleId no longer maps to a live policy rule.'
          example: Block_Malicious
        chain:
          type: string
          enum: [forward, input, output]
        action:
          type: string
          enum: [ACCEPT, DROP]
        log:
          type: boolean
        monitored:
          type: boolean
        bytes:
          type: integer
          format: uint64
        packets:
          type: integer
          format: uint64
        percent:
          type: number
          format: double
        unused:
          type: boolean
        lastMatchedAt:
          type: string
          format: date-time
        lastMatchedSource:
          type: string
          enum: [log, counter]

    FirewallBlockedEvent:
      type: object
      description: >-
        One row of the Recent Blocked Events table — a single NFLOG DROP
        entry, read directly off the existing traffic-log ring buffer,
        newest first.
      required: [ts, sourceIp, proto, port, chain]
      properties:
        ts:
          type: string
          format: date-time
        sourceIp:
          type: string
          example: 203.0.113.9
        proto:
          type: string
          example: TCP
        port:
          type: string
          example: '23'
        chain:
          type: string
          enum: [forward, input, output]
        ruleName:
          type: string
          description: >-
            Best-effort/omitted when the entry predates rule-name capture or
            the drop came from the built-in default-drop rather than a user
            rule.

    FirewallStatistics:
      type: object
      required:
        - window
        - generatedAt
        - available
        - truncated
        - acceptedBytes
        - acceptedPackets
        - blockedBytes
        - blockedPackets
        - blockedEvents
        - rulesEnabled
        - rulesUnused
        - trend
        - denyTrend
        - chains
        - rules
        - blockedSources
        - blockedPorts
        - recentBlockedEvents
        - limit
      description: >-
        The GET /statistics/firewall response — see that path's description
        for the full explanation of the two independent data sources
        (nft-rule-counter vs NFLOG) this DTO combines.
      properties:
        window:
          type: string
          enum: [15m, 30m, 1h, 3h, 6h, 12h, 24h]
        generatedAt:
          type: string
          format: date-time
        available:
          type: boolean
          description: >-
            False until the nft rule-counter poller has completed at least
            one tick (mirrors PolicyRuleStats.available).
        truncated:
          type: boolean
          description: >-
            True when the NFLOG deny ring (blockedSources/blockedPorts/
            recentBlockedEvents) hit one of its per-bucket tracking caps in
            this window. The rule-counter side of this response has no such
            cap and never sets this.
        countersSince:
          type: string
          format: date-time
          description: >-
            Last successful Apply Settings — every nft-rule-counter-sourced
            figure is "since" this timestamp, not lifetime. Omitted if no
            successful apply has happened yet this run.
        acceptedBytes:
          type: integer
          format: uint64
        acceptedPackets:
          type: integer
          format: uint64
        blockedBytes:
          type: integer
          format: uint64
          description: >-
            nft-rule-counter-sourced — NOT the same population as
            blockedEvents (does not include default-drop traffic). Never
            combine into a percentage with blockedEvents.
        blockedPackets:
          type: integer
          format: uint64
        blockedEvents:
          type: integer
          format: uint64
          description: NFLOG DROP event count for this window (includes default-drop traffic).
        rulesEnabled:
          type: integer
        rulesUnused:
          type: integer
        trend:
          type: array
          items:
            $ref: '#/components/schemas/FirewallTrendPoint'
        denyTrend:
          type: array
          items:
            $ref: '#/components/schemas/FirewallDenyPoint'
        chains:
          type: array
          items:
            $ref: '#/components/schemas/FirewallChainStat'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/FirewallRuleStatRow'
        blockedSources:
          type: array
          items:
            $ref: '#/components/schemas/TopDeniedSource'
        blockedPorts:
          type: array
          items:
            $ref: '#/components/schemas/TopDeniedPort'
        recentBlockedEvents:
          type: array
          items:
            $ref: '#/components/schemas/FirewallBlockedEvent'
        limit:
          type: integer
          description: The effective (server-clamped) row cap applied to the 4 list fields above.

    TrafficLogBufferUsage:
      type: object
      required:
        - used
        - capacity
        - usedPercent
        - evicted
      description: >-
        The GET /logs/traffic/usage response — a small, purpose-built summary
        of the traffic log ring buffer's fill state for the Forward/Local
        Traffic page headers (docs/ref/todo/
        firewall-log-buffer-capacity-plan.md, GitHub issue #134). Numbers are
        for the WHOLE ring buffer (all three chains share it), not scoped to
        a single page.
      properties:
        used:
          type: integer
          description: Current number of entries held in the buffer (<= capacity).
        capacity:
          type: integer
          description: >-
            Buffer's configured maximum size, from the traffic-log-buffer-
            capacity key in pigate.conf (default 10000, accepted range
            500-100000) — only changes on the next service restart.
        usedPercent:
          type: number
          format: double
          description: used as a percent of capacity (0 when capacity is 0).
        oldestEntry:
          type: string
          format: date-time
          description: >-
            As-stored time string (RFC3339 or RFC3339Nano) of the oldest
            entry still in the buffer; empty when the buffer is empty.
        newestEntry:
          type: string
          format: date-time
          description: >-
            As-stored time string of the most recently added entry still in
            the buffer; empty when the buffer is empty.
        evicted:
          type: integer
          format: int64
          description: >-
            Cumulative count of entries pushed out of the buffer since boot
            or the last POST /dashboard/logs/clear; non-zero means the
            buffer has filled up and started discarding old entries.

    FirewallLog:
      type: object
      required:
        - id
        - time
        - action
        - src
        - dest
        - srcPort
        - port
        - proto
        - inIface
        - outIface
        - reason
        - chain
      properties:
        id:
          type: string
          example: log-1
        time:
          type: string
          example: "2026-07-28T14:31:02.123456789Z"
        action:
          type: string
          enum: [PASS, DROP]
          example: DROP
        src:
          type: string
          example: 185.220.101.4
        dest:
          type: string
          example: 10.0.0.45
        srcPort:
          type: string
          description: Source port (TCP/UDP only); "-" for other protocols or if unknown.
          example: "51422"
        port:
          type: string
          description: Destination port (TCP/UDP only); "-" for other protocols or if unknown.
          example: "445"
        proto:
          type: string
          example: TCP
        inIface:
          type: string
          description: Ingress interface name (NFLOG indev); "-" if unknown.
          example: eth0
        outIface:
          type: string
          description: Egress interface name (NFLOG outdev); "-" if unknown.
          example: eth1
        reason:
          type: string
          example: Blocked Port (SMB)
        chain:
          type: string
          enum: [forward, input, output]
          description: |
            Which nftables chain produced this entry. "forward" is LAN↔WAN
            traffic routed through the box; "input" is traffic destined to
            the box itself (e.g. admin reaching the web UI/SSH, or an
            unsolicited WAN scan); "output" is traffic the box itself
            originates (e.g. its own DNS/NTP lookups). Empty string means
            unknown (defensive default; should not normally occur).
          example: forward
        ruleId:
          type: string
          description: |
            Internal token captured from the nftables log prefix at the
            moment this entry was logged: either the id of the matching
            PolicyRule, or a fixed "sys-*" token for a structural log point
            (default drop, admin access, docker-compat bypass, etc — not
            tied to a single user-configured rule). Omitted when the log
            prefix carried no recognizable token (e.g. it predates this
            feature). Not intended for display on its own — see ruleName.
          example: rule-1a2b3c4d
        ruleName:
          type: string
          description: |
            Human-readable name resolved from ruleId. Snapshot-on-write: it
            is resolved once, when the entry was logged, and never updated
            afterwards — if the matching PolicyRule is later renamed or
            deleted, this entry keeps showing the name as it was at match
            time. Omitted if ruleId is empty or could not be resolved yet
            (e.g. logged in the brief window before the first snapshot
            refresh after startup).
          example: Block Telnet
        srcDomain:
          type: string
          description: |
            Domain name most recently observed answering to src, from the
            local DNS query-log cache (same cache the Statistics pages use).
            Resolved fresh on every read, never stored — turning off DNS
            Query Logging clears it immediately, including for already
            logged entries. Omitted when unavailable (logging disabled, no
            matching cache entry, or its TTL expired).
          example: dns.google
        destDomain:
          type: string
          description: Same as srcDomain, but for dest.
          example: dns.google
        srcHostname:
          type: string
          description: |
            Hostname for src resolved from an active DHCP lease or
            reservation, used as a fallback for LAN addresses when
            srcDomain is unavailable. Resolved fresh on every read, never
            stored. Omitted when src has a domain, or no lease/reservation
            matches.
          example: laptop-office
        destHostname:
          type: string
          description: Same as srcHostname, but for dest.
          example: laptop-office

    # --- Network Interface Schemas ---
    NetworkInterface:
      type: object
      required:
        - id
        - name
        - alias
        - role
        - type
        - subtype
        - addressingMode
        - ip
        - netmask
        - gateway
        - macAddress
        - adminAccess
        - status
        - speed
      properties:
        id:
          type: string
          example: iface-1
        name:
          type: string
          description: OS-level interface name (e.g. eth0, wlan0)
          example: eth0
        alias:
          type: string
          description: >-
            Human-readable label for the interface, shown UI-wide as "alias (name)".
            Unique across interfaces (case-insensitive) and must not equal another
            interface's OS name; an empty alias defaults to the OS name.
          example: LAN_Internal
        role:
          type: string
          enum: [LAN, WAN]
          example: LAN
        type:
          type: string
          enum: [ethernet, wireless]
          example: ethernet
        subtype:
          type: string
          description: |
            More specific interface subtype. Examples: 'device' (physical NIC), 'veth' (virtual ethernet),
            'bridge' (software bridge), 'vlan' (VLAN sub-interface).
          example: device
        addressingMode:
          type: string
          enum: [dhcp, static]
          example: static
        ip:
          type: string
          example: 192.168.1.1
        netmask:
          type: string
          description: CIDR prefix length as string (e.g. "24")
          example: "24"
        gateway:
          type: string
          example: ""
        metric:
          type: integer
          nullable: true
          minimum: 1
          maximum: 9999
          description: >-
            Default-gateway route priority for this interface (lower = preferred,
            used for multi-WAN failover). null/omitted means auto (static uses 100,
            dhcp keeps dhcpcd's default). IPv4 only.
          example: 100
        macAddress:
          type: string
          example: "DC:A6:32:AA:BB:C1"
        adminAccess:
          type: array
          description: List of management protocols allowed on this interface
          items:
            type: string
            enum: [HTTPS, HTTP, PING, SSH]
          example: [PING, HTTP, SSH]
        status:
          type: string
          enum: [up, down, offline]
          description: >-
            Live administrative state of the interface. "offline" is a computed value (never
            persisted): the interface has a configuration row in the database but no live
            kernel link — e.g. a VLAN whose parent vanished or an unplugged USB NIC. Offline
            rows appear in GET /interfaces so the config can be deleted; mutating endpoints
            reject them with 409.
          example: up
        managed:
          type: boolean
          description: >-
            Computed field (not persisted): true when the interface has a configuration
            row in the database (pigate has configured it). false marks an interface that
            exists in the kernel but is unmanaged — e.g. one never configured, or one whose
            config was removed via Reset. Purely informational; does not change any behavior.
          example: true
        speed:
          type: string
          description: Link speed string from kernel (e.g. "1000 Mbps")
          example: "1000 Mbps"
        vlanParent:
          type: string
          nullable: true
          description: >-
            Parent interface name for an 802.1Q VLAN sub-interface. Present only when
            subtype='vlan'. Immutable after creation.
          example: eth0
        vlanId:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4094
          description: >-
            802.1Q VLAN ID for a VLAN sub-interface. Present only when subtype='vlan'.
            Immutable after creation.
          example: 100
        # Optional Wireless-only Fields (present when type=wireless)
        wifiSSID:
          type: string
          example: MyHome_5G
        wifiPassword:
          type: string
          description: Masked as "••••••••" in API responses for security. Send masked value to preserve existing password.
          example: "••••••••"
        wifiSecurity:
          type: string
          description: Wi-Fi security protocol (Open, WPA2-PSK, WPA3-SAE, etc.)
          example: WPA2-PSK
        macMode:
          type: string
          enum: [hardware, randomized, laa]
          description: |
            MAC address mode for the wireless interface.
            - hardware: use the real burned-in MAC address
            - randomized: let wpa_supplicant randomize MAC per-connection (preassoc_mac_addr=1, mac_addr=1)
            - laa: use a locally administered address (LAA) specified in laaMacAddress
          example: hardware
        prefer5GHz:
          type: boolean
          description: Lock Wi-Fi scanning to 5GHz channels only (adds freq_list to wpa_supplicant network block) for maximum speed.
        realMacAddress:
          type: string
          description: The actual hardware MAC burned into the NIC
          example: "DC:A6:32:AA:BB:C1"
        randomizedMac:
          type: string
          description: Last randomized MAC address used by wpa_supplicant
          example: "4E:88:2F:BC:A1:90"
        laaMacAddress:
          type: string
          description: Custom locally administered MAC address when macMode=laa
          example: "9A:11:22:33:44:55"
        randomizeOnReconnect:
          type: boolean
          description: If true, wpa_supplicant generates a new random MAC on each reconnect
          example: true
        failoverEnabled:
          type: boolean
          description: If true, automatic failover to backupSsid is enabled when primary SSID is unreachable
          example: false
        backupSsid:
          type: string
          example: MyHome_2G
        backupWifiPassword:
          type: string
          description: Backup SSID password (masked as "••••••••" in responses)
          example: "••••••••"
        backupWifiSecurity:
          type: string
          example: WPA2-PSK
        ipCheckTimeout:
          type: integer
          description: Seconds to wait before declaring primary connection failed (failover check)
          example: 15
        primaryMaxRetries:
          type: integer
          description: Number of retries before switching to backup SSID
          example: 3
        failoverCooldown:
          type: integer
          description: Seconds to wait before attempting to reconnect to primary SSID after failover
          example: 60

    WifiScanResult:
      type: object
      required:
        - ssid
        - signal
        - security
        - channel
        - frequency
      properties:
        ssid:
          type: string
          example: MyHome_5G
        signal:
          type: integer
          minimum: 0
          maximum: 100
          example: 85
        security:
          type: string
          example: WPA2-PSK
        channel:
          type: integer
          example: 36
        frequency:
          type: string
          example: "5 GHz"

    WifiConnectionStatus:
      type: object
      required:
        - state
        - ssid
        - bssid
        - activeMac
      properties:
        state:
          type: string
          description: |
            wpa_supplicant connection state string. Common values:
            COMPLETED (connected), DISCONNECTED, SCANNING, ASSOCIATING, AUTHENTICATING,
            ASSOCIATED, 4WAY_HANDSHAKE, GROUP_HANDSHAKE, INACTIVE, INTERFACE_DISABLED.
            Mapped to user-friendly strings by the backend (e.g. COMPLETED → "Connected").
          example: COMPLETED
        ssid:
          type: string
          description: Name of the currently connected Wi-Fi network
          example: MyHome_5G
        bssid:
          type: string
          description: MAC address of the connected Access Point
          example: "00:11:22:33:44:55"
        activeMac:
          type: string
          description: The currently effective MAC address of the interface (may differ from hardware MAC if randomization is active)
          example: "4E:88:2F:BC:A1:90"
        freq:
          type: integer
          description: Connection frequency in MHz (e.g. 5180, 2412)
          example: 5745
        keyMgmt:
          type: string
          description: Security protocol in use (e.g. WPA3, WPA2, Open)
          example: WPA3
        wifiGen:
          type: string
          description: Wi-Fi generation string (e.g. WiFi 6, WiFi 5, WiFi 4)
          example: WiFi 6

    # --- Firewall Policy Schemas ---
    PolicyRule:
      type: object
      required:
        - id
        - name
        - inInterface
        - outInterface
        - source
        - destination
        - service
        - action
        - log
        - status
      properties:
        id:
          type: string
          example: rule-a1b2
        name:
          type: string
          example: Block_Malicious
        chain:
          type: string
          enum: [forward, input, output]
          default: forward
          description: >-
            Which nftables base chain this rule targets. "input" (Local-In
            Policy) ignores outInterface/nat; "output" (Local-Out Policy)
            ignores inInterface/nat. Empty/omitted normalizes to "forward"
            for backward compatibility with clients that predate this field.
          example: forward
        inInterface:
          type: string
          example: eth0
        outInterface:
          type: string
          example: wlan0
        source:
          type: array
          items:
            type: string
          example: [LAN_Network]
        destination:
          type: array
          items:
            type: string
          example: [Malicious_IP_List]
        service:
          type: array
          items:
            type: string
          example: [ALL]
        action:
          type: string
          enum: [ACCEPT, DROP]
          example: DROP
        log:
          type: boolean
          example: true
        nat:
          type: boolean
          description: Source NAT (masquerade to outgoing interface address). Must be false for chain input/output.
          example: false
        status:
          type: boolean
          example: true
        monitored:
          type: boolean
          default: false
          description: >-
            Opts this rule into a persisted running total (bytes/packets)
            that accumulates in SQLite across every Apply Settings and
            process restart, unlike the ephemeral counters exposed by GET
            /policies/stats (see PolicyRuleStat.monitored* below). Toggle
            via POST /policies/{id}/toggle-monitor, never by editing this
            flag through PUT /policies/{id} (docs/ref/todo/
            fqdn-retry-and-monitored-counters-plan.md D-6, issue #141).
          example: false

    PolicyRuleStat:
      type: object
      description: >-
        One row of PolicyRuleStats.rules. See GET /policies/stats for the 4
        limitations (snapshot-not-cumulative, percent-across-all-chains,
        hybrid lastMatchedAt, disabled rules omitted).
      required:
        - ruleId
        - name
        - chain
        - action
        - log
        - status
        - bytes
        - packets
        - percent
        - unused
      properties:
        ruleId:
          type: string
          example: rule-a1b2
        name:
          type: string
          example: Block_Malicious
        chain:
          type: string
          enum: [forward, input, output]
          example: forward
        action:
          type: string
          enum: [ACCEPT, DROP]
          example: DROP
        log:
          type: boolean
        status:
          type: boolean
          description: Always true — disabled rules are omitted from the rules array entirely.
          example: true
        bytes:
          type: integer
          format: uint64
          example: 15420
        packets:
          type: integer
          format: uint64
          example: 132
        percent:
          type: number
          format: double
          description: Share of totalBytes across EVERY chain, not just the ?chain= filter.
          example: 12.4
        unused:
          type: boolean
          description: true when the (enabled) rule has matched no traffic since countersSince.
          example: false
        lastMatchedAt:
          type: string
          format: date-time
          description: RFC3339(Nano) timestamp, omitted if unknown.
        lastMatchedSource:
          type: string
          enum: [log, counter]
          description: >-
            "log" = resolved from the traffic-log ring buffer (rule has
            Log enabled); "counter" = fallback from the 10s nft counter
            poll (±10s accuracy). Omitted when lastMatchedAt is omitted.
        monitored:
          type: boolean
          description: >-
            Mirrors PolicyRule.monitored. When true, monitoredBytes/
            monitoredPackets/monitoredSince below are populated from a
            SEPARATE persisted counter that accumulates across every Apply
            Settings and process restart — it is NOT the same accounting as
            bytes/packets/percent above (those remain "since the last
            successful apply" only, and monitored totals are never folded
            into totalBytes/totalPackets/percent). It only resets when the
            user explicitly resets it (POST /policies/{id}/monitor/reset)
            or turns Monitor off (POST /policies/{id}/toggle-monitor).
          example: false
        monitoredBytes:
          type: integer
          format: uint64
          description: Persisted running total, only meaningful when monitored=true.
          example: 812400
        monitoredPackets:
          type: integer
          format: uint64
          description: Persisted running total, only meaningful when monitored=true.
          example: 5210
        monitoredSince:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC — when the current persisted total started
            accumulating (set when Monitor was turned on, or refreshed by a
            reset). Empty when monitored=false.

    PolicyRuleStats:
      type: object
      required:
        - rules
        - totalBytes
        - totalPackets
        - available
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRuleStat'
        totalBytes:
          type: integer
          format: uint64
          description: Sum across every chain, used as the denominator for every rule's percent.
          example: 124300
        totalPackets:
          type: integer
          format: uint64
          example: 980
        countersSince:
          type: string
          format: date-time
          description: >-
            Timestamp of the last successful Apply Settings (RFC3339 UTC);
            omitted if no apply has ever succeeded. nftables counters reset
            to 0 on every apply, so this doubles as "stats collected since".
        available:
          type: boolean
          description: >-
            false only before the background traffic-stats poller has ever
            completed a tick (e.g. immediately after startup) — the UI
            should show a "not available yet" state rather than a
            misleading all-zero table.
          example: true

    EndpointHit:
      type: object
      description: >-
        One aggregated source or destination IP observed matching a rule, in
        GET /policies/{id}/endpoints. Name precedence for display:
        addressName, then domain, then hostname (see that endpoint's
        description) — the raw ip is always present as a fallback.
      required:
        - ip
        - count
        - firstSeenAt
        - lastSeenAt
        - addressName
        - hostname
        - domain
        - fromRule
      properties:
        ip:
          type: string
          example: 192.168.1.120
        count:
          type: integer
          description: Number of matching log entries currently in the buffer (NOT bytes).
          example: 210
        firstSeenAt:
          type: string
          format: date-time
          description: RFC3339(Nano) timestamp of the oldest matching entry still in the buffer.
        lastSeenAt:
          type: string
          format: date-time
          description: RFC3339(Nano) timestamp of the newest matching entry.
        addressName:
          type: string
          description: User-defined Address Object name covering this IP, or "" if none matched.
          example: LAN_Clients
        hostname:
          type: string
          description: DHCP lease/reservation hostname, or "" (only used when addressName and domain are both empty).
          example: notebook-01
        domain:
          type: string
          description: DNS reverse-cache domain, or "" (only used when addressName is empty).
          example: www.google.com
        fromRule:
          type: boolean
          description: true when addressName is one of this rule's own source/destination Address Objects.
          example: true

    ServiceHit:
      type: object
      description: >-
        One aggregated proto/port pair observed matching a rule, in GET
        /policies/{id}/endpoints.
      required:
        - proto
        - port
        - count
        - firstSeenAt
        - lastSeenAt
        - serviceName
        - fromRule
      properties:
        proto:
          type: string
          example: TCP
        port:
          type: string
          description: Destination port, or "-" for ICMP/ICMPv6 (never converted to "0").
          example: "443"
        count:
          type: integer
          description: Number of matching log entries currently in the buffer (NOT bytes).
          example: 301
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        serviceName:
          type: string
          description: Matching Service Object name, or "" if none matched (client shows raw PROTO/PORT instead).
          example: HTTPS
        fromRule:
          type: boolean
          description: true when serviceName is this rule's own Service object.
          example: true

    PolicyRuleEndpoints:
      type: object
      description: >-
        Response of GET /policies/{id}/endpoints — see that endpoint's
        description for the 4 hard limitations (requires log enabled, counts
        are log entries not bytes, data window equals the ring buffer for
        source="buffer", only new-connections/drops are logged).

        Since docs/ref/todo/persisted-rule-endpoints-plan.md (issue #141
        follow-up) this response has two possible sources, indicated by the
        `source` field:

        - `source: "persisted"` — the rule has Monitor turned on (and the
          monitored-endpoints-enabled kill switch is on), so this data comes
          from SQLite (the policy_rule_endpoints table) instead of the
          traffic-log ring buffer. It survives Apply Settings, a process
          restart, and clearing the Traffic Log — none of those reset it.
          Counting starts from zero at the moment Monitor was turned on (or
          last reset) — there is no backfill from data the ring buffer
          already had, so `scannedEntries`/`bufferOldestAt` are meaningless
          in this mode and are simply omitted/zero.
        - `source: "buffer"` — the original behavior: a single scan of the
          in-memory traffic-log ring buffer. This is what every rule gets
          when Monitor is off, or when monitored-endpoints-enabled is false.

        Both modes still require the rule's `log` flag to be on before any
        data is collected at all (`logEnabled: false` means the lists below
        are always empty, not an error) — this is an NFLOG limitation, not a
        bug, and is unaffected by which source mode is active.
      required:
        - ruleId
        - ruleName
        - chain
        - logEnabled
        - matchedEntries
        - uniqueSources
        - uniqueDestinations
        - uniqueServices
        - limit
        - truncated
        - scannedEntries
        - sources
        - destinations
        - services
        - source
        - capped
        - evicted
        - maxPerDirection
      properties:
        ruleId:
          type: string
          example: rule-xxxx
        ruleName:
          type: string
          example: Allow LAN to WAN
        chain:
          type: string
          enum: [forward, input, output]
          example: forward
        logEnabled:
          type: boolean
          description: rule.log — false means the lists below are always empty.
          example: true
        matchedEntries:
          type: integer
          description: >-
            Number of log entries for this rule. When source="buffer" this
            is a precise count of entries currently in the traffic-log ring
            buffer. When source="persisted" this is an APPROXIMATION — the
            sum of the returned top sources rows only (not a SUM across
            every persisted row for this rule) — deliberately avoiding a
            full-table aggregate query on every request, since this
            endpoint is polled every ~10s while the drawer stays open.
          example: 482
        uniqueSources:
          type: integer
          description: Distinct source IPs seen, counted BEFORE the limit truncation.
          example: 12
        uniqueDestinations:
          type: integer
          example: 96
        uniqueServices:
          type: integer
          example: 7
        limit:
          type: integer
          example: 10
        truncated:
          type: boolean
          description: true when at least one category has more entries than limit.
          example: true
        scannedEntries:
          type: integer
          description: >-
            Size of the traffic-log buffer actually scanned (every
            chain/rule combined). Always 0 when source="persisted" (no
            buffer scan happens in that mode).
          example: 10000
        bufferOldestAt:
          type: string
          format: date-time
          description: >-
            Timestamp of the oldest entry currently in the whole buffer —
            the edge of this endpoint's data window. Omitted if the buffer
            is empty, and always omitted when source="persisted" (no
            meaning in that mode).
        sources:
          type: array
          items:
            $ref: '#/components/schemas/EndpointHit'
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/EndpointHit'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHit'
        source:
          type: string
          enum: [persisted, buffer]
          description: >-
            Where this response's data came from — see the schema
            description above. "persisted" means the rule has Monitor on and
            the data is read from SQLite (survives Apply/restart/clearing
            the Traffic Log); "buffer" is the original ring-buffer-scan
            behavior.
          example: buffer
        collectingSince:
          type: string
          format: date-time
          description: >-
            Only present when source="persisted" — the moment Monitor was
            turned on for this rule (or last reset), i.e. "data has been
            collected since this timestamp, with no backfill from before
            it". Mirrors the rule's persisted-counter started_at.
        capped:
          type: boolean
          description: >-
            true when at least one direction (sources/destinations/services)
            currently holds exactly maxPerDirection rows — the cap has been
            reached and the least-recently-seen entries are being evicted to
            make room for new ones. Always false when source="buffer" (the
            cap only applies to the persisted table).
          example: false
        evicted:
          type: integer
          description: >-
            Cumulative number of rows evicted (LRU) for this rule since
            Monitor was last turned on/reset. Always 0 when
            source="buffer".
          example: 0
        maxPerDirection:
          type: integer
          description: >-
            The effective cap (rows per direction) in effect —
            monitored-endpoints-max-per-rule, default 1000. Surfaced here so
            clients never need to hardcode this number. Present regardless
            of source, so the UI can always describe the cap even for a rule
            that isn't monitored yet.
          example: 1000

    PolicyRuleInput:
      type: object
      required:
        - name
        - inInterface
        - outInterface
        - source
        - destination
        - service
        - action
        - log
        - status
      properties:
        name:
          type: string
          example: Block_Malicious
        chain:
          type: string
          enum: [forward, input, output]
          default: forward
          description: >-
            Which nftables base chain this rule targets. On PUT, an
            empty/omitted value keeps the existing rule's chain unchanged
            (it never resets to "forward"). On POST, empty/omitted
            normalizes to "forward".
          example: forward
        inInterface:
          type: string
          deprecated: true
          description: >-
            Deprecated: compat mirror of inInterfaces[0] only, kept for
            clients that predate multi-interface support. If the request
            includes inInterfaces, that list wins and this field is
            ignored. On PUT, if the request includes neither inInterfaces
            nor inInterface, the rule's existing in-interfaces are kept
            unchanged (never silently widened to "ALL").
          example: eth0
        outInterface:
          type: string
          deprecated: true
          description: >-
            Deprecated: compat mirror of outInterfaces[0] only. See
            inInterface's description above (same list-wins and
            PUT-preserves-existing-when-omitted rules, for the out
            direction).
          example: wlan0
        inInterfaces:
          type: array
          items:
            type: string
          description: >-
            The in-interface list — the source of truth (docs/ref/todo/
            multi-interface-firewall-rule-plan.md). Empty or exactly
            ["ALL"] means "any interface". Every entry other than "ALL"
            must be a valid interface name (letters, digits, '.', '_',
            '-', max 15 characters), and the number of entries per
            direction is capped by the file-only config key
            max-policy-interfaces-per-direction (default 8) — exceeding
            it, or sending an invalid name, returns HTTP 400. On PUT, if
            neither this field nor inInterface is present in the request
            body, the rule's existing in-interfaces are kept unchanged.
          example: [eth0, wlan0]
        outInterfaces:
          type: array
          items:
            type: string
          description: >-
            The out-interface list — see inInterfaces above for the full
            semantics (source of truth, ALL/empty meaning, name/count
            limits, list-wins-over-scalar precedence, PUT-preserves-when-
            omitted).
          example: [eth1]
        source:
          type: array
          items:
            type: string
          example: [LAN_Network]
        destination:
          type: array
          items:
            type: string
          example: [Malicious_IP_List]
        service:
          type: array
          items:
            type: string
          example: [ALL]
        action:
          type: string
          enum: [ACCEPT, DROP]
          example: DROP
        log:
          type: boolean
          example: true
        nat:
          type: boolean
          description: Source NAT (masquerade to outgoing interface address). Must be false for chain input/output.
          example: false
        status:
          type: boolean
          example: true
        monitored:
          type: boolean
          default: false
          description: >-
            Accepted for symmetry with the PolicyRule response shape, but
            ignored by POST/PUT /policies — Monitor can only be toggled via
            POST /policies/{id}/toggle-monitor (docs/ref/todo/
            fqdn-retry-and-monitored-counters-plan.md D-6/T-11).
          example: false

    # --- Port Forwarding (DNAT) Schemas ---
    PortForward:
      type: object
      required:
        - id
        - name
        - inInterface
        - externalPort
        - protocol
        - internalIP
        - status
      properties:
        id:
          type: string
          example: pf-a1b2
        name:
          type: string
          example: WebServer
        inInterface:
          type: string
          description: External (WAN) interface receiving the traffic
          example: eth0
        externalPort:
          type: string
          description: Single port ("8080") or range ("8000-8010", keep-port only)
          example: '8080'
        protocol:
          type: string
          enum: [tcp, udp]
          example: tcp
        internalIP:
          type: string
          description: Internal LAN target IPv4 address
          example: 192.168.1.10
        internalPort:
          type: string
          description: Translated destination port; empty keeps the original port (required-empty for ranges)
          example: '80'
        status:
          type: boolean
          example: true

    PortForwardInput:
      type: object
      required:
        - name
        - inInterface
        - externalPort
        - protocol
        - internalIP
        - status
      properties:
        name:
          type: string
          example: WebServer
        inInterface:
          type: string
          example: eth0
        externalPort:
          type: string
          example: '8080'
        protocol:
          type: string
          enum: [tcp, udp]
          example: tcp
        internalIP:
          type: string
          example: 192.168.1.10
        internalPort:
          type: string
          example: '80'
        status:
          type: boolean
          example: true

    # --- Address Object Schemas ---
    AddressEntry:
      type: object
      description: >-
        One address match within an AddressObject. An AddressObject can hold
        multiple entries (multi-value objects) — each entry becomes exactly
        one nft match/rule fragment when the object is expanded. `type` is
        per-entry, so subnet/range/fqdn entries can be mixed within the same
        object.
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum: [subnet, range, fqdn]
          example: subnet
        value:
          type: string
          example: 192.168.1.0/24

    AddressObject:
      type: object
      required:
        - id
        - name
        - type
        - value
        - system
        - refPolicies
      properties:
        id:
          type: string
          example: addr-2
        name:
          type: string
          example: LAN_Network
        type:
          type: string
          enum: [subnet, range, fqdn]
          example: subnet
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].type` only, kept
            temporarily for old clients. Never used to generate firewall
            rules. Planned removal in the next major version — use `entries`
            instead.
        value:
          type: string
          example: 192.168.1.0/24
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].value` only, kept
            temporarily for old clients. Never used to generate firewall
            rules. Planned removal in the next major version — use `entries`
            instead.
        system:
          type: boolean
          example: false
        refPolicies:
          type: array
          items:
            type: string
          example: [rule-a1b2]
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AddressEntry'
          description: >-
            The multi-value entries for this address object (source of
            truth). The maximum number of entries per object is capped by the
            `max-object-entries` key in `pigate.conf` (default 64).
          example:
            - type: subnet
              value: 192.168.1.0/24

    AddressObjectInput:
      type: object
      required:
        - name
        - type
        - value
      properties:
        name:
          type: string
          example: LAN_Network
        type:
          type: string
          enum: [subnet, range, fqdn]
          example: subnet
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].type`. Used only when
            `entries` is not sent in the request body. Planned removal in the
            next major version — use `entries` instead.
        value:
          type: string
          example: 192.168.1.0/24
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].value`. Used only when
            `entries` is not sent in the request body. Planned removal in the
            next major version — use `entries` instead.
        comment:
          type: string
          example: Local LAN network subnet card
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AddressEntry'
          description: >-
            The multi-value entries for this address object. When omitted,
            the legacy `type`/`value` fields are used to build a single-entry
            object instead. The maximum number of entries per object is
            capped by the `max-object-entries` key in `pigate.conf` (default
            64).
          example:
            - type: subnet
              value: 192.168.1.0/24

    # --- Wi-Fi Preset Schemas ---
    WifiPreset:
      type: object
      description: >-
        A saved Wi-Fi network. Returned by GET/create/update responses — the
        password is write-only and is never present here; `hasPassword` reports
        whether one is stored.
      required:
        - id
        - name
        - ssid
        - security
        - hasPassword
      properties:
        id:
          type: string
          example: wifi-preset-3f9a
        name:
          type: string
          example: Home
        ssid:
          type: string
          example: MyHomeNetwork
        security:
          type: string
          enum: [Open, WPA2, WPA2-PSK, WPA3, WPA2/WPA3]
          example: WPA2
        macMode:
          type: string
          enum: ["", hardware, randomized, laa]
          description: Optional MAC address mode to apply with this preset; empty leaves it untouched.
          example: hardware
        hasPassword:
          type: boolean
          description: Read-only; true when a password is stored. The plaintext value is never returned.
          example: true

    WifiPresetInput:
      type: object
      required:
        - name
        - ssid
        - security
      properties:
        name:
          type: string
          example: Home
        ssid:
          type: string
          example: MyHomeNetwork
        security:
          type: string
          enum: [Open, WPA2, WPA2-PSK, WPA3, WPA2/WPA3]
          example: WPA2
        password:
          type: string
          format: password
          writeOnly: true
          description: >-
            Write-only. Stored plaintext in the DB (same as interface Wi-Fi) and
            never returned. On update, submit an empty string to keep the existing
            password. Must not contain newline or double-quote characters.
          example: s3cr3t-passphrase
        macMode:
          type: string
          enum: ["", hardware, randomized, laa]
          example: hardware

    # --- Service Object Schemas ---
    ServiceEntry:
      type: object
      description: >-
        One protocol/port match within a ServiceObject. A ServiceObject can
        hold multiple entries — each entry becomes exactly one nft
        match/rule fragment when the object is expanded. `protocol` is
        per-entry, so e.g. a TCP entry and a UDP entry can be mixed within
        the same object.
      required:
        - protocol
        - port
      properties:
        protocol:
          type: string
          enum: [TCP, UDP, TCP/UDP, ICMP]
          example: TCP
        port:
          type: string
          example: "80"

    ServiceObject:
      type: object
      required:
        - id
        - name
        - protocol
        - port
        - type
        - refPolicies
      properties:
        id:
          type: string
          example: svc-2
        name:
          type: string
          example: HTTP
        protocol:
          type: string
          enum: [TCP, UDP, TCP/UDP, ICMP]
          example: TCP
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].protocol` only, kept
            temporarily for old clients. Never used to generate firewall
            rules. Planned removal in the next major version — use `entries`
            instead.
        port:
          type: string
          example: "80"
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].port` only, kept
            temporarily for old clients. Never used to generate firewall
            rules. Planned removal in the next major version — use `entries`
            instead.
        type:
          type: string
          enum: [system, custom]
          example: system
        refPolicies:
          type: array
          items:
            type: string
          example: []
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceEntry'
          description: >-
            The multi-value entries for this service object (source of
            truth). The maximum number of entries per object is capped by the
            `max-object-entries` key in `pigate.conf` (default 64).
          example:
            - protocol: TCP
              port: "80"

    ServiceObjectInput:
      type: object
      required:
        - name
        - protocol
        - port
      properties:
        name:
          type: string
          example: Custom_Web_Port
        protocol:
          type: string
          enum: [TCP, UDP, TCP/UDP, ICMP]
          example: TCP
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].protocol`. Used only
            when `entries` is not sent in the request body. Planned removal
            in the next major version — use `entries` instead.
        port:
          type: string
          example: "8080"
          deprecated: true
          description: >-
            Deprecated: compat mirror of `entries[0].port`. Used only when
            `entries` is not sent in the request body. Planned removal in the
            next major version — use `entries` instead.
        comment:
          type: string
          example: Alternative HTTP web port
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceEntry'
          description: >-
            The multi-value entries for this service object. When omitted,
            the legacy `protocol`/`port` fields are used to build a
            single-entry object instead. The maximum number of entries per
            object is capped by the `max-object-entries` key in
            `pigate.conf` (default 64).
          example:
            - protocol: TCP
              port: "8080"

    # --- DNS Server Schemas ---
    DNSZone:
      type: object
      required:
        - id
        - zoneName
        - forwardTo
        - allowedIps
        - isAuthoritative
        - enabled
        - records
      properties:
        id:
          type: string
          example: zone-a1b2c3d4
        zoneName:
          type: string
          description: Domain suffix this zone matches (e.g. lan, corp.local)
          example: home.lan
        forwardTo:
          type: string
          description: Upstream DNS server IP to forward queries for this zone to. Empty for authoritative zones.
          example: 192.168.1.53
        allowedIps:
          type: string
          description: Optional client IP/CIDR restriction for this zone (empty = all clients).
          example: 192.168.1.0/24
        isAuthoritative:
          type: boolean
          description: >-
            True marks this as a local zone: dnsmasq answers it from the zone's own
            records (`local=/zone/`) and returns NXDOMAIN for unknown names instead
            of forwarding upstream. False makes it a forward zone (queries are sent
            to forwardTo). The field name is retained for API compatibility.
          example: true
        enabled:
          type: boolean
          example: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/DNSRecord'

    DNSZoneInput:
      type: object
      required:
        - zoneName
        - isAuthoritative
        - enabled
      properties:
        zoneName:
          type: string
          description: >-
            Zone name. Allowed characters: letters, digits, '.' and '-' only
            (no spaces, underscores or newlines). Invalid values are rejected
            with 400 (guards against dnsmasq config injection).
          example: home.lan
        forwardTo:
          type: string
          description: >-
            Upstream resolver for a forward zone (IPv4/IPv6, optional '#port',
            or hostname). Charset-validated; invalid values return 400.
          example: 192.168.1.53
        allowedIps:
          type: string
          example: 192.168.1.0/24
        isAuthoritative:
          type: boolean
          example: true
        enabled:
          type: boolean
          example: true

    DNSRecord:
      type: object
      required:
        - id
        - zoneId
        - name
        - type
        - value
        - ttl
      properties:
        id:
          type: string
          example: rec-a1b2c3d4
        zoneId:
          type: string
          description: ID of the zone this record belongs to (immutable).
          example: zone-a1b2c3d4
        name:
          type: string
          description: Record host name (relative to the zone or FQDN).
          example: nas
        type:
          type: string
          description: DNS record type (e.g. A, AAAA, CNAME, MX, TXT).
          example: A
        value:
          type: string
          example: 192.168.1.50
        ttl:
          type: integer
          description: Time-to-live in seconds.
          example: 3600
        glueIps:
          type: array
          items:
            type: string
          description: >-
            NS-delegation glue IPs (NS records only, max 4). Meaning depends on
            delegationMode: in "glue" mode (default), PiGate emits
            `server=/<fqdn>/<ip>` per IP so dnsmasq forwards every query under
            that name straight to the delegated nameserver, on top of
            publishing the NS record itself. In "upstream" mode, glueIps are
            NOT used for forwarding - they only create a `host-record=` for
            the nameserver's own name when it lives in the parent zone. Not
            allowed on the zone apex (use a Forward Zone instead) and not
            allowed on non-NS records - both return 400. Loopback/unspecified/
            multicast addresses are rejected.
          example: ["203.0.113.53"]
        delegationMode:
          type: string
          enum: ["", "glue", "upstream"]
          description: >-
            NS records only. "" / "glue" (default) forwards the delegated subtree
            straight to glueIps. "upstream" instead emits `server=/<fqdn>/#`, handing
            the subtree to the box's normal upstream resolvers - required when the
            delegated nameserver answers with a CNAME pointing outside its own zone,
            because dnsmasq cannot combine records coming from two different servers
            (the client would otherwise get the CNAME with no A/AAAA). Only works when
            the delegated name is resolvable by those upstreams. Not allowed on the
            zone apex, and not allowed on non-NS records - both return 400.
          example: "upstream"

    DNSRecordInput:
      type: object
      required:
        - name
        - type
        - value
        - ttl
      properties:
        name:
          type: string
          description: >-
            Host name relative to the zone ('@' or empty = zone apex). Allowed
            characters: letters, digits, '.' and '-'. Invalid values return 400.
          example: nas
        type:
          type: string
          description: One of A, AAAA, CNAME, MX, TXT, PTR, NS. Any other type is rejected with 400.
          example: A
        value:
          type: string
          description: >-
            Validated per type (A=IPv4, AAAA=IPv6, CNAME/PTR=FQDN charset,
            MX="<pref> <target>" or "<target>", TXT<=255 chars, no quotes,
            NS=nameserver name; a short name is appended with the zone name;
            published via dnsmasq's dns-rr type 2, and additionally forwarded
            (forwarding-based delegation, glue or upstream mode - see
            delegationMode/glueIps) when the record is set up to forward.
            Values with newlines/invalid charset return 400 (dnsmasq injection guard).
          example: 192.168.1.50
        ttl:
          type: integer
          example: 3600
        glueIps:
          type: array
          items:
            type: string
          description: >-
            NS-delegation glue IPs (NS records only, max 4). Meaning depends on
            delegationMode: in "glue" mode (default), PiGate emits
            `server=/<fqdn>/<ip>` per IP so dnsmasq forwards every query under
            that name straight to the delegated nameserver, on top of
            publishing the NS record itself. In "upstream" mode, glueIps are
            NOT used for forwarding - they only create a `host-record=` for
            the nameserver's own name when it lives in the parent zone. Not
            allowed on the zone apex (use a Forward Zone instead) and not
            allowed on non-NS records - both return 400. Loopback/unspecified/
            multicast addresses are rejected.
          example: ["203.0.113.53"]
        delegationMode:
          type: string
          enum: ["", "glue", "upstream"]
          description: >-
            NS records only. "" / "glue" (default) forwards the delegated subtree
            straight to glueIps. "upstream" instead emits `server=/<fqdn>/#`, handing
            the subtree to the box's normal upstream resolvers - required when the
            delegated nameserver answers with a CNAME pointing outside its own zone,
            because dnsmasq cannot combine records coming from two different servers
            (the client would otherwise get the CNAME with no A/AAAA). Only works when
            the delegated name is resolvable by those upstreams. Not allowed on the
            zone apex, and not allowed on non-NS records - both return 400.
          example: "upstream"

    DNSServerSettings:
      type: object
      required:
        - interfaces
        - queryLogging
        - dnsCacheTtlMinutes
        - dnsCacheMaxEntries
      properties:
        interfaces:
          type: array
          description: Names of the real interfaces the DNS server binds (listens) on.
          items:
            type: string
          example: [eth0, wlan0]
        queryLogging:
          type: boolean
          default: false
          description: >-
            Enables both the "Top Queried Domains" card and IP->domain
            enrichment of Top Destinations/Conversations
            (docs/ref/todo/statistics-dns-top-domain-plan.md). Off by
            default (privacy). Changing this value RESTARTS dnsmasq
            (DNS and DHCP briefly interrupted, same process) and, when
            turned off, immediately deletes the on-disk query log and
            clears all in-memory DNS statistics.
        dnsCacheTtlMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 60
          description: >-
            How long the IP->domain reverse-cache remembers a mapping since
            it was last seen. Applies immediately — changing this value does
            NOT restart dnsmasq or anything else.
          example: 60
        dnsCacheMaxEntries:
          type: integer
          minimum: 128
          maximum: 65536
          default: 4096
          description: >-
            Caps the reverse cache's entry count. Applies immediately,
            including evicting down to the new cap right away when
            lowered — does NOT restart dnsmasq or anything else.
          example: 4096
        upstreamMode:
          type: string
          enum: [system, custom]
          default: system
          description: >-
            Where the DNS Server (dnsmasq) sources its upstream resolvers
            from when generating pigate-dns.conf (docs/ref/todo/
            dns-server-settings-tab-and-upstream-plan.md). `system` (default)
            *reads* System DNS (`GET/PUT /api/system/dns`) at the moment
            pigate-dns.conf is generated (POST /api/dns/apply, this endpoint
            when something else changes, boot, or restore) — it does not copy
            or cache the value. `custom` forwards exclusively to
            `upstreamServers`. Optional in the request body — an old client
            that omits it is treated as `system`; the response always
            includes it. Changing this value (or `upstreamServers`) RESTARTS
            dnsmasq (DNS and DHCP briefly interrupted, same process), same as
            `queryLogging` — unlike `dnsCacheTtlMinutes`/`dnsCacheMaxEntries`.
            **`PUT /api/system/dns` no longer has any effect on dnsmasq** —
            saving System DNS only ever updates systemd-resolved for this
            device; the new value takes effect for the DNS Server the next
            time one of the paths above regenerates pigate-dns.conf.
        upstreamServers:
          type: array
          maxItems: 4
          description: >-
            Bare IPv4/IPv6 upstream resolver addresses used only when
            `upstreamMode` is `custom` (max 4). No port suffix, hostname, DoT
            or DoH URL is accepted — validation rejects (400) rather than
            strips a malformed entry, since each value is written verbatim
            into a `server=<ip>` directive in pigate-dns.conf. Loopback
            addresses are also rejected (forwarding loop with dnsmasq itself
            or systemd-resolved's stub resolver). Values entered while in
            `system` mode are preserved (but unused) if the mode is later
            switched back to `custom`.
          items:
            type: string
          example: ["1.1.1.1", "8.8.8.8"]

    BlockedDomain:
      type: object
      description: >-
        A DNS Server deny-list entry (docs/ref/todo/dns-blocked-domains-plan.md).
        Blocking a domain automatically blocks every subdomain of it too
        (dnsmasq matches most-specific domain, `server=/<domain>/` /
        `address=/<domain>/<ip>` cover the whole subtree) — there is no
        exact-only mode.
      required:
        - id
        - domain
        - mode
        - enabled
        - comment
        - createdAt
      properties:
        id:
          type: string
          example: blk-a1b2c3d4
        domain:
          type: string
          description: >-
            Domain to block, plus all of its subdomains. Stored/rendered
            lower-case with any trailing dot stripped.
          example: ads.example.com
        mode:
          type: string
          enum: [nxdomain, sinkhole]
          default: nxdomain
          description: >-
            `nxdomain` (default) answers NXDOMAIN for the domain and every
            subdomain, without forwarding upstream (`server=/<domain>/`).
            `sinkhole` answers `0.0.0.0` / `::` instead
            (`address=/<domain>/0.0.0.0` and `address=/<domain>/::`) — useful
            for ad-block use cases where a browser handles a fake address
            better than NXDOMAIN.
          example: nxdomain
        enabled:
          type: boolean
          example: true
        comment:
          type: string
          description: Free-text note, max 128 characters, no newlines.
          example: ad network
        createdAt:
          type: string
          example: "2026-07-31 10:00:00"

    BlockedDomainInput:
      type: object
      required:
        - domain
        - enabled
      properties:
        domain:
          type: string
          description: >-
            Domain to block (letters, digits, '.', '-' only; must contain at
            least one '.'; no leading/trailing '.', '-' or whitespace; max 253
            chars). A value colliding with an existing enabled DNS zone name,
            carrying an embedded newline, or exceeding the 1000-entry cap is
            rejected with 400 (dnsmasq config injection guard).
          example: ads.example.com
        mode:
          type: string
          enum: [nxdomain, sinkhole]
          default: nxdomain
          example: nxdomain
        enabled:
          type: boolean
          example: true
        comment:
          type: string
          description: Max 128 characters, no newlines.
          example: ad network

    DNSBlocklist:
      type: object
      description: >-
        One DNS blocklist import entry (docs/ref/todo/
        dns-blocklist-import-plan.md) — a bulk-imported hosts-format list,
        either subscribed from a URL or uploaded as a file. Metadata for
        every list lives in a single JSON manifest file on disk
        (`/var/lib/pigate/blocklists/manifest.json`), never in the
        database. This is a separate feature from the deny-list
        (`BlockedDomain`, capped at 1000 hand-curated entries) and shares no
        storage with it. The block mode is chosen per list, never per
        domain within a list.
      required:
        - id
        - name
        - sourceType
        - enabled
        - domainCount
        - fileBytes
        - sha256
        - createdAt
      properties:
        id:
          type: string
          description: >-
            Also the filename stem of the generated `<id>.hosts`/`<id>.conf`
            files under `/var/lib/pigate/blocklists/`.
          example: bl-3f9a2c
        name:
          type: string
          example: StevenBlack unified
        sourceType:
          type: string
          enum: [url, upload]
          example: url
        url:
          type: string
          description: "Present only for `sourceType: url` lists. HTTPS-only."
          example: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        blockMode:
          type: string
          enum: [sinkhole, nxdomain]
          default: sinkhole
          description: >-
            Chosen per list, NOT per domain — there is no per-domain
            override within a blocklist. `sinkhole` (default) renders
            `addn-hosts=/var/lib/pigate/blocklists/<id>.hosts`: dnsmasq
            answers `0.0.0.0` for an exact domain match only and does
            **not** cover subdomains — the cheapest option at
            tens-of-thousands-of-domains scale, and adequate because public
            blocklists already enumerate every subdomain they mean to
            block. `nxdomain` renders
            `conf-file=/var/lib/pigate/blocklists/<id>.conf` (one
            `address=/<domain>/` line per domain): dnsmasq answers
            NXDOMAIN for the domain **and every subdomain**, but requires
            dnsmasq >= 2.86 and this list's domains count against the
            separate, lower `DNSBlocklistMaxNXDomainDomains` quota, because
            the conf-file is parsed twice per Apply (`dnsmasq --test` plus
            actual daemon start) versus `addn-hosts`, which is never parsed
            during `--test`. This default (sinkhole) is the OPPOSITE of the
            deny-list's default (`BlockedDomain.mode` defaults to
            `nxdomain`) — the deny-list is small and hand-curated and
            benefits from automatic subdomain coverage; a public blocklist
            is large and already exhaustive. Metadata (including this
            field) lives only in the JSON manifest, never the database.
          example: sinkhole
        enabled:
          type: boolean
          example: true
        domainCount:
          type: integer
          description: >-
            Number of distinct domains after parsing/dedupe (0 if the list
            has never been successfully fetched/uploaded).
          example: 93412
        fileBytes:
          type: integer
          format: int64
          description: Size in bytes of the generated `<id>.hosts` file.
          example: 1902344
        sha256:
          type: string
          description: >-
            SHA-256 of the generated `<id>.hosts` content — not the
            original source file, and not `<id>.conf` (which is always a
            derived artifact re-rendered from `<id>.hosts` when needed,
            never hashed itself).
          example: "9f86d081..."
        lastFetchedAt:
          type: string
          format: date-time
          description: "Present only for `sourceType: url` lists that have been fetched at least once."
        lastError:
          type: string
          description: >-
            Message from the most recent failed fetch/parse, if any. A
            failed refresh never discards the previously working
            `<id>.hosts`/`<id>.conf` files or `domainCount` — only this
            field is updated.
        createdAt:
          type: string
          format: date-time

    DNSBlocklistInput:
      type: object
      description: Create/update request body for a DNS blocklist (POST/PUT /dns/blocklists).
      required:
        - name
        - enabled
      properties:
        name:
          type: string
          description: Max 64 characters, no newlines, no leading/trailing whitespace.
          example: StevenBlack unified
        url:
          type: string
          description: >-
            Required when creating a `sourceType: url` list via `POST
            /dns/blocklists` (name/blockMode/enabled only apply to
            upload-sourced lists created via `POST
            /dns/blocklists/upload`, which takes no JSON body). Must be
            `https://`, no userinfo, port empty or `443`, max 2048
            characters.
          example: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        blockMode:
          type: string
          enum: [sinkhole, nxdomain]
          default: sinkhole
          description: >-
            Omit (or send an empty string) to keep the default `sinkhole`.
            An unrecognized value is rejected with `400` at the handler
            layer, before any network fetch happens. See
            `DNSBlocklist.blockMode` for the behavioral difference between
            the two modes and why the default here is the opposite of the
            deny-list's.
          example: sinkhole
        enabled:
          type: boolean
          example: true

    # --- Static Route Schemas ---
    RoutesConfig:
      type: object
      description: Backend runtime flags controlling routing behavior
      required:
        - allowEditSystemRoutes
        - prioritizeKernelRoutes
        - enableEditSystemRoute
      properties:
        allowEditSystemRoutes:
          type: boolean
          description: |
            When true, routes of type 'system' (directly connected kernel routes) can be
            edited, deleted, or toggled. Controlled by the `-allow-edit-system-routes` CLI flag.
          example: false
        prioritizeKernelRoutes:
          type: boolean
          description: |
            [Experimental] When true, the kernel routing table (/proc/net/route) is the source of truth.
            Routes found in kernel have their metric and type updated from kernel data.
            Routes NOT in kernel (system/defaultgateway types) are automatically marked inactive.
            User-toggled status in DB is preserved and not overridden by kernel state.
            Controlled by the `-prioritize-kernel-routes` CLI flag. (Default: false)
          example: false
        enableEditSystemRoute:
          type: boolean
          description: |
            Runtime active state of system route editing. Reflects whether the user has currently
            toggled the system route edit mode on. This is the live state used by the RoutingService,
            and may be false even when allowEditSystemRoutes is true.
          example: false

    StaticRoute:
      type: object
      required:
        - id
        - destination
        - gateway
        - interface
        - metric
        - description
        - status
        - type
        - scope
        - src
        - proto
      properties:
        id:
          type: string
          description: |
            For user-created routes: UUID (e.g. `route-1`).
            For kernel-only routes not yet in DB: canonical ID `route-sys-[dest]-[gw]-[iface]`.
          example: route-1
        destination:
          type: string
          example: 0.0.0.0/0
        gateway:
          type: string
          description: Next-hop gateway IP. Empty string for directly connected (system) routes.
          example: 10.0.0.1
        interface:
          type: string
          example: wlan0
        metric:
          type: integer
          description: Route priority. Lower value = higher priority. Synced from kernel when prioritizeKernelRoutes is true.
          example: 100
        description:
          type: string
          example: Default gateway route (WAN)
        status:
          type: boolean
          description: |
            Whether the route is enabled. Stored in DB and preserved across GetRoutes calls.
            For system/defaultgateway types: auto-set to false if route not found in kernel.
          example: true
        type:
          type: string
          enum: [system, custom, defaultgateway, customgateway]
          description: |
            - `system`: directly connected route (no gateway), read-only unless -allow-edit-system-routes is set
            - `defaultgateway`: route to 0.0.0.0/0, always editable and toggleable
            - `custom`: user-defined route, always editable and toggleable
            - `customgateway`: user-defined route with gateway, always editable and toggleable
          example: defaultgateway
        scope:
          type: string
          description: Route scope (e.g. 'global', 'link', 'host').
          example: global
        src:
          type: string
          description: Preferred source IP address.
          example: 192.168.1.2
        proto:
          type: string
          description: Route protocol (e.g. 'kernel', 'boot', 'static', '120').
          example: static

    StaticRouteInput:
      type: object
      required:
        - destination
        - gateway
        - interface
        - metric
        - description
        - status
        - scope
        - src
        - proto
      properties:
        destination:
          type: string
          example: 192.168.10.0/24
        gateway:
          type: string
          example: 192.168.1.250
        interface:
          type: string
          example: eth0
        metric:
          type: integer
          example: 10
        description:
          type: string
          example: Connection route to branch office
        status:
          type: boolean
          example: true
        scope:
          type: string
          description: Route scope (e.g. 'global', 'link', 'host').
          example: global
        src:
          type: string
          description: Preferred source IP address.
          example: 192.168.1.2
        proto:
          type: string
          description: Route protocol (e.g. 'kernel', 'boot', 'static', '120').
          example: static

    # --- DHCP Server Schemas ---
    DhcpConfig:
      type: object
      required:
        - enabled
        - interface
        - startIp
        - endIp
        - gateway
        - netmask
        - dns1
        - dns2
        - leaseTime
      properties:
        id:
          type: string
          description: |
            Configuration ID. Always present in responses. Optional on create —
            when omitted, the backend assigns `dhcp-cfg-<interface>`.
          example: dhcp-cfg-eth0
        enabled:
          type: boolean
          example: true
        interface:
          type: string
          example: eth0
        startIp:
          type: string
          example: 192.168.1.100
        endIp:
          type: string
          example: 192.168.1.200
        gateway:
          type: string
          example: 192.168.1.1
        netmask:
          type: string
          example: 255.255.255.0
        dns1:
          type: string
          example: 8.8.8.8
        dns2:
          type: string
          example: 1.1.1.1
        leaseTime:
          type: integer
          description: Lease duration in seconds
          example: 86400
        domain:
          type: string
          description: |
            Optional domain name advertised to clients in this scope via DHCP
            option 15. Empty (default) means the option is not emitted.
          example: home.lan

    DhcpReservation:
      type: object
      required:
        - id
        - deviceName
        - macAddress
        - ipAddress
      properties:
        id:
          type: string
          example: res-1
        deviceName:
          type: string
          example: CEO_Laptop
        macAddress:
          type: string
          example: "A1:B2:C3:D4:E5:F6"
        ipAddress:
          type: string
          example: 192.168.1.10

    DhcpReservationInput:
      type: object
      required:
        - deviceName
        - macAddress
        - ipAddress
      properties:
        deviceName:
          type: string
          description: >-
            Device name written to dnsmasq as the reservation hostname. Letters,
            digits, spaces (collapsed to '-') and '-' only, max 63 chars; may be
            empty (a default is used). Invalid values return 400.
          example: CEO_Laptop
        macAddress:
          type: string
          description: Colon- or hyphen-separated 6-octet MAC. Invalid values return 400.
          example: "A1:B2:C3:D4:E5:F6"
        ipAddress:
          type: string
          description: Reserved IPv4/IPv6 address. Invalid values return 400.
          example: 192.168.1.10

    ActiveDhcpLease:
      type: object
      required:
        - id
        - ipAddress
        - macAddress
        - hostname
        - expiresIn
      properties:
        id:
          type: string
          example: lease-1
        ipAddress:
          type: string
          example: 192.168.1.101
        macAddress:
          type: string
          example: "99:88:77:66:55:44"
        hostname:
          type: string
          example: iPhone-13
        expiresIn:
          type: string
          example: 11 hours, 45 mins

    # --- System & Maintenance Schemas ---
    TimeStatus:
      type: object
      description: Live time state read from the kernel (read-only; never sent on PUT).
      properties:
        currentTime:
          type: string
          format: date-time
          description: Device local time (RFC3339)
          example: "2026-07-03T15:04:05+07:00"
        ntpSynchronized:
          type: boolean
          description: True once systemd-timesyncd has synchronized the clock
          example: true

    SystemTimeSettings:
      type: object
      required:
        - timezone
        - ntpSync
        - ntpServer
      properties:
        timezone:
          type: string
          description: Bare IANA timezone name (no GMT-offset suffix)
          example: "Asia/Bangkok"
        ntpSync:
          type: boolean
          example: true
        ntpServer:
          type: string
          description: NTP server hostname/IP (space-separated list allowed); empty = distro default
          example: pool.ntp.org
        status:
          allOf:
            - $ref: '#/components/schemas/TimeStatus'
          description: Live kernel status; present on GET responses only.

    SetManualTimeInput:
      type: object
      required:
        - datetime
      properties:
        datetime:
          type: string
          format: date-time
          description: Absolute time in RFC3339. Only accepted while ntpSync is false.
          example: "2026-07-03T15:04:05+07:00"

    SystemHostnameSettings:
      type: object
      required:
        - hostname
        - shareWithDhcp
      properties:
        hostname:
          type: string
          example: "PiGate-RPI5"
          description: RFC 1123 label (letters, digits, hyphens; max 63 chars; no leading/trailing hyphen)
        shareWithDhcp:
          type: boolean
          example: false
          description: When true, dhcpcd sends this hostname to the WAN DHCP server via DHCP Option 12

    DhcpHealthSettings:
      type: object
      description: >
        Tunable thresholds for the background DHCP link-local (169.254.x.x APIPA)
        fallback health-checker (issue #78). It self-heals DHCP-mode interfaces that
        are carrier-ready (up and running) but stuck without a real IPv4 address:
        it deletes a stray 169.254 address when a real IP coexists, or restarts
        dhcpcd for that interface when there is no real IP at all.
      required:
        - enabled
        - checkIntervalSeconds
        - consecutiveStrikes
        - minRunningSeconds
        - restartBackoffSeconds
        - maxRestartsBeforePause
      properties:
        enabled:
          type: boolean
          example: true
          description: Master on/off switch for the health-checker.
        checkIntervalSeconds:
          type: integer
          example: 60
          minimum: 10
          maximum: 3600
          description: How often (seconds) the checker polls every DHCP-mode interface.
        consecutiveStrikes:
          type: integer
          example: 3
          minimum: 1
          maximum: 20
          description: Consecutive unhealthy ticks required before the checker acts.
        minRunningSeconds:
          type: integer
          example: 30
          minimum: 0
          maximum: 600
          description: Grace period after an interface becomes carrier-ready before strikes are counted, so a fresh reconnect isn't penalized.
        restartBackoffSeconds:
          type: integer
          example: 300
          minimum: 0
          maximum: 3600
          description: Minimum time between two dhcpcd restarts for the same interface.
        maxRestartsBeforePause:
          type: integer
          example: 3
          minimum: 1
          maximum: 20
          description: Restart ceiling since the interface was last genuinely healthy; once hit, the checker stops restarting that interface and logs a single actionable event instead of restarting indefinitely.

    BackupFile:
      type: object
      description: Configuration backup file (schema v2) produced by the export endpoint.
      required:
        - meta
        - config
      properties:
        meta:
          type: object
          properties:
            device:
              type: string
              example: PiGate Firewall Gateway
            hostname:
              type: string
              example: pigate-rpi5
            appVersion:
              type: string
              example: v0.1.0-pre
            schemaVersion:
              type: integer
              example: 2
            exportedAt:
              type: string
              format: date-time
            checksum:
              type: string
              description: SHA-256 over the canonical JSON of the plaintext `config`, prefixed with "sha256:"
              example: "sha256:7a2891..."
            includeUsers:
              type: boolean
            encrypted:
              type: boolean
              description: True when the config is passphrase-encrypted (then `config` is absent and `encryptedConfig` is present).
            encryption:
              type: object
              description: KDF/cipher parameters — present only when encrypted. Carries no secret.
              properties:
                algorithm:
                  type: string
                  example: AES-256-GCM
                kdf:
                  type: string
                  example: argon2id
                salt:
                  type: string
                  description: base64 Argon2id salt
                nonce:
                  type: string
                  description: base64 GCM nonce
                time:
                  type: integer
                memory:
                  type: integer
                threads:
                  type: integer
        encryptedConfig:
          type: string
          description: base64 AES-256-GCM ciphertext of the marshalled config. Present only when `meta.encrypted` is true (mutually exclusive with `config`).
        config:
          type: object
          description: |
            Typed configuration sections (present only when NOT encrypted). Arrays
            reuse the same item schemas as their live endpoints (interfaces,
            staticRoutes, addresses, serviceObjects, policies, dhcpConfigs,
            dhcpReservations, dnsZones, qosRules, presets) plus singletons
            dnsServerSettings, systemDns, systemTime, systemHostname, and an
            optional users array.
          properties:
            interfaces:
              type: array
              items:
                $ref: '#/components/schemas/NetworkInterface'
            staticRoutes:
              type: array
              items:
                $ref: '#/components/schemas/StaticRoute'
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/AddressObject'
            serviceObjects:
              type: array
              items:
                $ref: '#/components/schemas/ServiceObject'
            policies:
              type: array
              items:
                $ref: '#/components/schemas/PolicyRule'
            dhcpConfigs:
              type: array
              items:
                $ref: '#/components/schemas/DhcpConfig'
            dhcpReservations:
              type: array
              items:
                $ref: '#/components/schemas/DhcpReservation'
            dnsZones:
              type: array
              items:
                $ref: '#/components/schemas/DNSZone'
            dnsServerSettings:
              $ref: '#/components/schemas/DNSServerSettings'
            systemDns:
              type: object
            qosRules:
              type: array
              items:
                $ref: '#/components/schemas/QosRule'
            presets:
              type: array
              description: >-
                Saved Wi-Fi presets. Unlike the API's GET responses, backup
                entries DO carry the plaintext `password` (a backup must be
                restorable) — same as interface Wi-Fi passwords in this file.
              items:
                $ref: '#/components/schemas/WifiPresetInput'
            systemTime:
              $ref: '#/components/schemas/SystemTimeSettings'
            systemHostname:
              $ref: '#/components/schemas/SystemHostnameSettings'
            users:
              type: array
              description: Present only when exported with includeUsers. Contains bcrypt hashes.
              items:
                type: object

    ImportResult:
      type: object
      description: Summary returned after a successful configuration import.
      properties:
        schemaVersion:
          type: integer
          description: Detected schema version of the imported file (1 or 2)
          example: 2
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Number of restored objects per section
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal issues (skipped interfaces, kernel re-apply failures)
        interfacesChanged:
          type: boolean
          description: True if any interface config changed (admin may need to reconnect)
        usersImported:
          type: boolean

    NetworkServiceStatus:
      type: object
      required:
        - id
        - name
        - serviceName
        - status
        - restartAllowed
      properties:
        id:
          type: string
          example: dnsmasq
        name:
          type: string
          example: DHCP/DNS Forwarder (dnsmasq)
        serviceName:
          type: string
          example: dnsmasq.service
        status:
          type: string
          enum: [running, stopped, failed, unavailable]
          example: running
        restartAllowed:
          type: boolean
          description: |
            false for read-only catalog entries (currently only pigate.service
            itself) — the UI must not offer a restart action, and the server
            also rejects the restart request with 403 regardless.
          example: true

    DNSConfig:
      type: object
      required:
        - mode
        - primaryDns
        - secondaryDns
        - localDomain
        - dynamicDnsServers
      properties:
        mode:
          type: string
          enum: [wan, static]
          example: static
        primaryDns:
          type: string
          example: 1.1.1.1
        secondaryDns:
          type: string
          example: 8.8.8.8
        localDomain:
          type: string
          example: pigate.local
        dynamicDnsServers:
          type: array
          items:
            $ref: '#/components/schemas/DynamicDNSServer'

    DNSConfigInput:
      type: object
      required:
        - mode
        - primaryDns
        - secondaryDns
        - localDomain
      properties:
        mode:
          type: string
          enum: [wan, static]
          example: static
        primaryDns:
          type: string
          example: 1.1.1.1
        secondaryDns:
          type: string
          example: 8.8.8.8
        localDomain:
          type: string
          example: pigate.local

    DynamicDNSServer:
      type: object
      required:
        - interfaceName
        - interfaceAlias
        - dnsServers
      properties:
        interfaceName:
          type: string
          example: eth0
        interfaceAlias:
          type: string
          example: WAN_OS
        dnsServers:
          type: array
          items:
            type: string
          example: [192.168.0.1, 8.8.4.4]

    QosRule:
      type: object
      properties:
        id:
          type: string
          example: qos-001
        name:
          type: string
          example: Limit Guest WiFi
        interface:
          type: string
          example: eth1
        matchSrcIp:
          type: string
          description: Source IP CIDR to match (empty = all)
          example: 192.168.10.0/24
        matchDstIp:
          type: string
          description: Destination IP CIDR to match (empty = all)
          example: ""
        egressRateMbps:
          type: integer
          description: Guaranteed egress (download) rate in Mbps. 0 = unlimited.
          example: 10
        egressCeilMbps:
          type: integer
          description: Burst ceiling for egress in Mbps.
          example: 20
        ingressRateMbps:
          type: integer
          description: Guaranteed ingress (upload) rate in Mbps via IFB. 0 = unlimited.
          example: 5
        ingressCeilMbps:
          type: integer
          description: Burst ceiling for ingress in Mbps.
          example: 10
        priority:
          type: integer
          description: Rule priority (lower = matched first).
          example: 10
        status:
          type: boolean
          description: Whether the rule is active.
          example: true
        description:
          type: string
          example: Bandwidth limit for guest network

    QosRuleInput:
      type: object
      required:
        - name
        - interface
      properties:
        name:
          type: string
          example: Limit Guest WiFi
        interface:
          type: string
          example: eth1
        matchSrcIp:
          type: string
          example: 192.168.10.0/24
        matchDstIp:
          type: string
          example: ""
        egressRateMbps:
          type: integer
          example: 10
        egressCeilMbps:
          type: integer
          example: 20
        ingressRateMbps:
          type: integer
          example: 5
        ingressCeilMbps:
          type: integer
          example: 10
        priority:
          type: integer
          example: 10
        status:
          type: boolean
          example: true
        description:
          type: string
          example: Bandwidth limit for guest network

    QosIfaceStatus:
      type: object
      properties:
        interface:
          type: string
          example: eth0
        hasQdisc:
          type: boolean
          example: true
        classes:
          type: array
          items:
            $ref: '#/components/schemas/QosClass'
        ingressSupported:
          type: boolean
          description: >-
            Whether the kernel has the IFB module available (probed once at
            startup). When false, ingress (upload) shaping is skipped and only
            egress (download) QoS is applied; the UI warns the user.
          example: true

    QosClass:
      type: object
      properties:
        classId:
          type: string
          example: "1:10"
        rate:
          type: string
          example: 10Mbit
        ceil:
          type: string
          example: 20Mbit
        ruleName:
          type: string
          example: Limit Guest WiFi

    WanUplink:
      type: object
      description: >-
        A configured WAN path health-checked via ICMP/TCP probes bound to its
        interface (SO_BINDTODEVICE). Persisted config, not runtime state — see
        WanUplinkState for the live health side.
      properties:
        id:
          type: string
          example: wan-3f9c2b1a
        name:
          type: string
          example: Primary Fiber
        interface:
          type: string
          example: eth0
        priority:
          type: integer
          description: Lower value = higher priority. Not used by anything in Phase 1.
          example: 1
        probeTargets:
          type: array
          description: >-
            IPv4 literals ONLY, never hostnames (no DNS dependency during an
            outage, no DNS-poisoning influence on routing behavior). There is
            no built-in default target — at least one must be provided.
          items:
            type: string
          example: ["1.1.1.1", "8.8.8.8"]
        probeMethod:
          type: string
          enum: [icmp, tcp, auto]
          description: >-
            "auto" tries ICMP first and falls back to TCP-connect within the
            same round if every target gets zero replies.
          example: auto
        probeTcpPort:
          type: integer
          description: >-
            Required (1-65535) when probeMethod is "tcp" or "auto"; must be 0
            when probeMethod is "icmp".
          example: 443
        probeIntervalSeconds:
          type: integer
          example: 5
        probeCount:
          type: integer
          description: Packets/connections sent per target per round.
          example: 3
        probeTimeoutMs:
          type: integer
          example: 1000
        lossThresholdPct:
          type: number
          format: float
          example: 50
        latencyThresholdMs:
          type: number
          format: float
          example: 200
        failStrikes:
          type: integer
          description: Consecutive failing rounds required before transitioning to down.
          example: 3
        recoverStrikes:
          type: integer
          description: Consecutive healthy rounds required to transition back to up.
          example: 3
        status:
          type: boolean
          description: Whether this uplink is monitored at all.
          example: true
        description:
          type: string
          example: Main fiber uplink

    WanUplinkInput:
      type: object
      required:
        - name
        - interface
        - probeTargets
        - probeMethod
        - probeIntervalSeconds
        - probeCount
        - probeTimeoutMs
        - lossThresholdPct
        - latencyThresholdMs
        - failStrikes
        - recoverStrikes
      properties:
        name:
          type: string
          example: Primary Fiber
        interface:
          type: string
          example: eth0
        priority:
          type: integer
          example: 1
        probeTargets:
          type: array
          items:
            type: string
          example: ["1.1.1.1", "8.8.8.8"]
        probeMethod:
          type: string
          enum: [icmp, tcp, auto]
          example: auto
        probeTcpPort:
          type: integer
          example: 443
        probeIntervalSeconds:
          type: integer
          example: 5
        probeCount:
          type: integer
          example: 3
        probeTimeoutMs:
          type: integer
          example: 1000
        lossThresholdPct:
          type: number
          format: float
          example: 50
        latencyThresholdMs:
          type: number
          format: float
          example: 200
        failStrikes:
          type: integer
          example: 3
        recoverStrikes:
          type: integer
          example: 3
        status:
          type: boolean
          example: true
        description:
          type: string
          example: Main fiber uplink

    WanUplinkState:
      type: object
      description: RAM-only (never persisted) live health snapshot of one uplink.
      properties:
        uplinkId:
          type: string
          example: wan-3f9c2b1a
        interface:
          type: string
          example: eth0
        state:
          type: string
          enum: [unknown, up, degraded, down]
          description: >-
            "degraded" is display-only (a latency-threshold breach with no
            loss) and never triggers a failover — only "down" does.
          example: up
        active:
          type: boolean
          description: Always false in Phase 1 (no failover controller exists yet).
          example: false
        lastLatencyMs:
          type: number
          format: float
          example: 12.4
        jitterMs:
          type: number
          format: float
          description: >-
            Only meaningful when metricQuality="full" — a connect-only round
            still reports 0, callers must check metricQuality before
            displaying it.
          example: 2.1
        lossPct:
          type: number
          format: float
          example: 0
        effectiveMethod:
          type: string
          enum: [icmp, tcp]
          description: >-
            The method actually used on the most recent round — may differ
            from the configured probeMethod once probeMethod="auto" has gone
            sticky-failed on ICMP.
          example: icmp
        metricQuality:
          type: string
          enum: [full, connect-only]
          example: full
        strikes:
          type: integer
          description: Current consecutive fail/recover streak driving the next transition.
          example: 0
        lastChangeAt:
          type: string
          format: date-time
          description: Empty until the first state change.
          example: "2026-09-06T10:00:00Z"
        reason:
          type: string
          example: healthy

    WanStatusEntry:
      description: One WanUplinkState plus its static name/priority.
      allOf:
        - $ref: '#/components/schemas/WanUplinkState'
        - type: object
          properties:
            name:
              type: string
              example: Primary Fiber
            priority:
              type: integer
              example: 1

    WanStatusResponse:
      type: object
      properties:
        uplinks:
          type: array
          items:
            $ref: '#/components/schemas/WanStatusEntry'
        bypassedByStaticRoute:
          type: boolean
          description: >-
            Phase 2 field (reserved). Always false in Phase 1 — nothing here
            can change routing yet.
          example: false
        activeUplinkId:
          type: string
          description: Phase 2 field (reserved). Always empty in Phase 1.
          example: ""
        lastSwitchAt:
          type: string
          description: Phase 2 field (reserved). Always empty in Phase 1.
          example: ""
        lastSwitchReason:
          type: string
          description: Phase 2 field (reserved). Always empty in Phase 1.
          example: ""

    WanMetricPoint:
      type: object
      description: One 5-minute bucket of a WAN uplink's latency/loss history.
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-06T10:00:00Z"
        avgLatencyMs:
          type: number
          format: float
          example: 12.4
        maxLatencyMs:
          type: number
          format: float
          example: 25.0
        jitterMs:
          type: number
          format: float
          nullable: true
          description: >-
            null/omitted when the bucket has no full-quality (ICMP) samples —
            never interpret a missing value as zero jitter.
          example: 2.1
        lossPct:
          type: number
          format: float
          example: 0
